ch hormones are in excess?","c":"T3 and T4","w":["TSH and TRH","Calcitonin and PTH","Cortisol and ACTH"],"e":"Excess T3 and T4 cause thyrotoxicosis and raise tissue metabolism."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What is the etiology?","c":"Antibodies to the TSH receptor","w":["Viral destruction of thyroid follicles","Iodine deficiency in the diet","Overproduction of TRH by the hypothalamus"],"e":"Autoimmune antibodies against the TSH receptor, with familial predisposition."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What do the antibodies do?","c":"Stimulate hormone release","w":["Block thyroid hormone release","Destroy the thyroid follicles","Neutralize circulating T4 only"],"e":"They stimulate hormone release and thyroid epithelial cell activity."},{"g":"8-41 · Graves’ disease (title inferred)","q":"How much more common is it in women than in men?","c":"Seven times","w":["Two times","Twenty times","It is equal"],"e":"It is seven times more common in women."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What is the peak incidence age?","c":"20 to 40 years","w":["0 to 10 years","50 to 60 years","Over 70 years"],"e":"Peak incidence is between 20 and 40 years."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What causes the exophthalmos?","c":"Retrobulbar and eye muscle infiltration","w":["Raised pressure inside the eyeball","Weakness of the upper lid retractors","Atrophy of the orbital fat pads"],"e":"An infiltrative increase in retrobulbar connective tissue and extraocular muscles."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What is pretibial myxedema?","c":"Thickened skin over the shin","w":["Puffy swelling of the face","Dry scaling skin of the hands","Wasting of the thigh muscles"],"e":"Thickened skin on the leg."},{"g":"8-41 · Graves’ disease (title inferred)","q":"What may be heard over the goiter?","c":"A thrill and a bruit","w":["A pleural friction rub","A diastolic murmur only","No sounds at all"],"e":"The goiter may have a thrill and bruit."},{"g":"8-41 · Graves’ disease (title inferred)","q":"Which combination is expected?","c":"Weight loss, increased appetite","w":["Weight gain, reduced appetite","Cold intolerance, slow pulse","Constipation, dry coarse skin"],"e":"Increased metabolism, with warm velvety skin."},{"g":"8-42 · Primary hypothyroidism","q":"What defines primary hypothyroidism?","c":"Thyroid hormone production too low","w":["Excess thyroid hormone release","Pituitary failure to make TSH","Tissue resistance to thyroid hormone"],"e":"The thyroid gland produces inadequate hormone."},{"g":"8-42 · Primary hypothyroidism","q":"What happens to TSH levels?","c":"They are elevated","w":["They are suppressed","They are normal","They are undetectable"],"e":"TSH levels are elevated."},{"g":"8-42 · Primary hypothyroidism","q":"Which is the autoimmune form?","c":"Hashimoto’s thyroiditis","w":["Graves’ disease","Subacute thyroiditis","Riedel’s thyroiditis"],"e":"Hashimoto’s thyroiditis is an autoimmune inflammatory disorder."},{"g":"8-42 · Primary hypothyroidism","q":"Which other causes are listed?","c":"Thyroidectomy and radiation damage","w":["Iodine excess and pituitary tumor","Viral infection and pregnancy","Steroid use and sun exposure"],"e":"Surgical ablation, radiation, Hashimoto’s, and idiopathic causes."},{"g":"8-42 · Primary hypothyroidism","q":"How frequent are congenital cases?","c":"About 1 in 5000 births","w":["About 1 in 50 births","About 1 in 500,000 births","About 1 in 5 births"],"e":"Congenital cases are about 1 in 5000 births."},{"g":"8-42 · Primary hypothyroidism","q":"Which sex is more affected?","c":"Women more than men","w":["Men more than women","Equal in both sexes","Only girls and young women"],"e":"It is more common in women and can occur at any age."},{"g":"8-42 · Primary hypothyroidism","q":"Which voice and tongue changes occur?","c":"Deep coarse voice, thick tongue","w":["High pitched voice, thin tongue","Hoarse whisper, swollen uvula","Normal voice, deviated tongue"],"e":"Thick tongue with slow speech and a deep, coarse voice."},{"g":"8-42 · Primary hypothyroidism","q":"Which cardiovascular findings may occur?","c":"Slow pulse, big heart, high BP","w":["Rapid pulse, small heart, low BP","Irregular pulse, normal heart size","Bounding pulse with a normal heart"],"e":"Also poor heart sounds and occasional precordial pain."},{"g":"8-42 · Primary hypothyroidism","q":"What is the skin like?","c":"Coarse, dry, cold, yellowish","w":["Warm, moist and velvety","Oily, flushed and warm","Thin, pale and sweaty"],"e":"Carotenemia gives a yellowish tint."},{"g":"8-42 · Primary hypothyroidism","q":"Which menstrual change is typical?","c":"Menorrhagia (heavy bleeding)","w":["Oligomenorrhea (scant bleeding)","Primary amenorrhea in all","Regular cycles in all cases"],"e":"Menorrhagia, with amenorrhea possible late in disease."},{"g":"8-43 · Hyperparathyroidism","q":"What is the usual cause?","c":"A solitary benign adenoma","w":["Diffuse parathyroid carcinoma","Chronic vitamin D deficiency","Long-standing kidney failure"],"e":"More than 85% are solitary benign adenomas, causing excess PTH and calcium."},{"g":"8-43 · Hyperparathyroidism","q":"Which symptoms are typical?","c":"Fatigue, constipation, polyuria","w":["Tremor, diarrhea, heat intolerance","Cold intolerance, weight gain","Cough, fever and night sweats"],"e":"Mild or nonspecific: also polydipsia, depression, skeletal pain, nausea."},{"g":"8-43 · Hyperparathyroidism","q":"What is the sex ratio?","c":"Two to one, women to men","w":["One to two, women to men","Equal in both sexes","Ten to one, men to women"],"e":"Prevalence is 2:1 in women and rises with age."},{"g":"8-43 · Hyperparathyroidism","q":"What is the management?","c":"Surgical removal of the glands","w":["Lifelong high-dose calcium supplements","Radioactive iodine ablation therapy","Long-term daily thyroxine therapy"],"e":"Surgical removal of the parathyroid glands."},{"g":"8-43 · Hyperparathyroidism","q" d first?","c":"Thyroid notch","w":["Hyoid bone","Sternal notch","Cricoid ring"],"e":"Locate the thyroid notch, then slide a finger inferiorly."},{"g":"8-44 · Cricothyrotomy","q":"How far below the thyroid notch is the membrane?","c":"About one fingerbreadth","w":["About one handbreadth","About five centimeters","About one arm-length"],"e":"About one fingerbreadth inferior to the notch."},{"g":"8-44 · Cricothyrotomy","q":"The space lies between which structures?","c":"Thyroid and cricoid cartilages","w":["Hyoid bone and thyroid cartilage","Cricoid cartilage and first tracheal ring","First and second tracheal rings"],"e":"Between the thyroid and cricoid cartilages."},{"g":"8-44 · Cricothyrotomy","q":"What can a pyramidal lobe cause?","c":"Laceration and significant bleeding","w":["Immediate airway obstruction at the glottis","Injury to the recurrent laryngeal nerve","Aspiration of gastric contents"],"e":"It may be lacerated, causing significant bleeding."},{"g":"8-44 · Cricothyrotomy","q":"How is the opening enlarged?","c":"By twisting the instrument","w":["By cutting the thyroid cartilage","By stretching with the fingers only","By cutting through the cricoid ring"],"e":"Opening may be enlarged by twisting the instrument."},{"g":"8-44 · Cricothyrotomy","q":"What preserves patency?","c":"Rubber tubing or a suitable object","w":["Gauze packing inside the wound","A suture placed across the wound","A pressure bandage on the neck"],"e":"Insert rubber tubing or any suitable object."},{"g":"8-44 · Cricothyrotomy","q":"How is the membrane identified?","c":"Palpating a transverse indentation","w":["Palpating the hyoid bone","Visualizing the vocal cords","Auscultating the trachea"],"e":"Palpate for the indentation between the thyroid and cricoid cartilages."},{"g":"8-44 · Cricothyrotomy","q":"What can be used to open the membrane?","c":"A scalpel or other sharp tool","w":["Blunt dissecting forceps alone","A large-bore needle alone","A flexible suction catheter"],"e":"Scalpel, knife or any sharp instrument at hand."},{"g":"8-45 · Hoarseness","q":"What causes hoarseness?","c":"Poor vocal fold vibration or closure","w":["Excess tension in the hyoid bone","Swelling of the esophageal wall","Dryness of the oral cavity floor"],"e":"Improper vibration or coaptation of the vocal folds."},{"g":"8-45 · Hoarseness","q":"Which is a listed cause of acute laryngitis?","c":"Gastroesophageal reflux","w":["Chronic hypocalcemia states","Long-term iron deficiency","Untreated hyperthyroidism"],"e":"Also smoking, rhinosinusitis, cough, voice overuse, myxedema, infection."},{"g":"8-45 · Hoarseness","q":"Which endocrine condition is listed for laryngeal edema?","c":"Myxedema","w":["Thyrotoxicosis","Hyperparathyroidism","Acromegaly"],"e":"Myxedema is listed among causes of acute laryngitis."},{"g":"8-45 · Hoarseness","q":"What causes laryngeal stiffness?","c":"Surgical scarring or inflammation","w":["Nodules or granulomas on cords","Injury to the laryngeal nerve","Acute viral infection of cords"],"e":"Stiffness: surgical scarring or inflammation."},{"g":"8-45 · Hoarseness","q":"Which are listed mass lesions?","c":"Nodule, cyst, granuloma","w":["Scarring, stiffness, edema","Paralysis, paresis, stroke","Croup, laryngitis, myxedema"],"e":"Also neoplasm and fungal infection."},{"g":"8-45 · Hoarseness","q":"Which causes of paralysis or paresis are listed?","c":"Recurrent nerve lesion, stroke","w":["Smoking, reflux, voice overuse","Cough, croup, chronic sinusitis","Surgical scarring or fungal cysts"],"e":"Also after viral infection; congenital or iatrogenic causes."},{"g":"8-45 · Hoarseness","q":"What does inflammatory croup show?","c":"Subglottic inflammation and swelling","w":["Supraglottic abscess","Epiglottic cyst","Vocal cord paralysis"],"e":"Subglottic inflammation and swelling."},{"g":"8-45 · Hoarseness","q":"What is seen in chronic laryngitis?","c":"Edematous vocal cords","w":["A pedunculated papilloma","A subglottic polyp","Hyperkeratosis of one cord"],"e":"Edematous vocal cords in chronic laryngitis."},{"g":"8-45 · Hoarseness","q":"Where is the pedunculated papilloma shown?","c":"Anterior commissure","w":["Arytenoid region","Subglottic space","Posterior commissure"],"e":"At the anterior commissure."},{"g":"8-45 · Hoarseness","q":"What is often the initial sign of extrinsic laryngeal carcinoma?","c":"A palpable node in the neck","w":["Coughing up blood early","Referred pain to the ear","Marked weight loss first"],"e":"A node in the neck is often the initial sign."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which test detects a vagus nerve lesion?","c":"Asking the patient to say “ah”","w":["Asking the patient to blink","Asking the patient to smile","Asking the patient to shrug"],"e":"A vagus lesion is easily detected by asking the patient to say “ah.”","d":"A vagus lesion is easily detected by asking the patient to say “ah.” Observe the soft palate and uvula during the sound.##The “ah” test assesses CN X."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"What is the normal response to saying “ah”?","c":"Symmetric elevation of soft palate and uvula","w":["Uvula deviation to one side","Soft palate drops","No palate movement"],"e":"If the nerve is intact, the soft palate and uvula elevate symmetrically.","d":"If the nerve is intact, the soft palate and uvula elevate symmetrically. Asymmetry indicates a lesion.##Intact CN X gives symmetric elevation."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which way does the uvula deviate in a unilateral vagus lesion?","c":"Away from the lesioned side","w":["Toward the lesioned side","Straight upward","Downward"],"e":"The palate and uvula deviate away from the lesioned side.","d":"The palate and uvula deviate away from the lesioned side. The paralyzed side fails to elevate, so the normal side pulls the uvula.##The uvula deviates away from the lesion."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"To which side is the uvula drawn in uvular paralysis?","c":"The nonparalyzed side","w":["The paralyzed side","The posterior wall","It does not move"],"e":"The uvula is drawn to the nonparalyzed side when the patient says “A-AH.”","d":"The uvula is drawn to the nonparalyzed side when the patient says “A-AH.” The muscles on the intact side contract.##The uvula moves toward the normal side."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which way does the tongue deviate in a peripheral hypoglossal lesion?","c":"Toward the lesioned side","w":["Away from the lesioned side","Upward","Backward"],"e":"The tongue deviates toward the side of the lesioned nerve on protrusion.","d":"The tongue deviates toward the side of the lesioned nerve on protrusion. The genioglossus on the normal side pushes the tongue toward the weak side.##Hypoglossal lesion deviates the tongue to the affected side."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"What accompanies a lower motor neuron hypoglossal lesion?","c":"Ipsilateral tongue atrophy","w":["Contralateral tongue atrophy","Tongue hypertrophy","Uvular deviation"],"e":"The ipsilateral tongue also shows muscle atrophy.","d":"The ipsilateral tongue also shows muscle atrophy. Atrophy is typical of lower motor neuron lesions.##Ipsilateral atrophy occurs."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which nerve is tested by tongue protrusion?","c":"Hypoglossal nerve","w":["Vagus nerve","Glossopharyngeal nerve","Accessory nerve"],"e":"Protruding the tongue tests the hypoglossal nerve.","d":"Protruding the tongue tests the hypoglossal nerve. Deviation indicates the side of weakness.##CN XII is tested by tongue protrusion."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Where does saliva accumulate in vagus nerve paralysis?","c":"Piriform fossa on the affected side","w":["Vallecula only","Nasopharynx","Buccal sulcus"],"e":"Saliva accumulates in the piriform fossa on the affected side.","d":"Saliva accumulates in the piriform fossa on the affected side. This is due to cricopharyngeal muscle paralysis and inability to swallow.##Vagus paralysis causes piriform fossa pooling."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which vocal cord finding occurs in vagus paralysis?","c":"Paramedian cord with poor or no movement","w":["Fully abducted cord with normal movement","Normal cords","Cord lengthening only"],"e":"The cord is paramedian with poor or no movement due to paralysis.","d":"The cord is paramedian with poor or no movement due to paralysis. This reflects loss of recurrent laryngeal nerve function.##Vagus paralysis leaves a paramedian cord."},{"g":"8-46 · Nerve lesions (CN X and CN XII)","q":"Which swallowing problem occurs in vagus paralysis?","c":"Inability to swallow due to cricopharyngeal paralysis","w":["Hyperactive swallowing","Isolated taste loss","Jaw clenching"],"e":"Vagus paralysis causes cricopharyngeal muscle paralysis and inability to swallow.","d":"Vagus paralysis causes cricopharyngeal muscle paralysis and inability to swallow. Saliva then pools in the piriform fossa.##Swallowing is impaired."},{"g":"8-47 · Craniosynostosis","q":"How does the neurocranium grow as the brain grows?","c":"By bone deposition along suture lines","w":["By cartilage replacement","By bone resorption","By fusion of sutures"],"e":"The neurocranium grows by bone deposition along suture lines.","d":"The neurocranium grows by bone deposition along suture lines. Interruption causes compensation elsewhere.##Cranial sutures drive growth."},{"g":"8-47 · Craniosynostosis","q":"What is craniosynostosis?","c":"Premature closure of cranial sutures","w":["Delayed suture closure","A fracture along a suture","A tumor of the skull"],"e":"The process is interrupted, and the cranium compensates by depositing bone along other sutures.","d":"The process is interrupted, and the cranium compensates by depositing bone along other sutures. Closure of one suture alters the skull shape.##It is premature suture fusion."},{"g":"8-47 · Craniosynostosis","q":"What shape follows premature sagittal suture closure?","c":"Long, narrow cranium","w":["Short, wide cranium","Tall, round cranium","Flat, small cranium"],"e":"Premature sagittal closure causes growth lengthwise, producing a long narrow cranium.","d":"Premature sagittal closure causes growth lengthwise, producing a long narrow cranium. This is scaphocephaly.##Sagittal closure gives scaphocephaly."},{"g":"8-47 · Craniosynostosis","q":"What is scaphocephaly caused by?","c":"Sagittal craniosynostosis","w":["Coronal craniosynostosis","Lambdoid craniosynostosis","Metopic fracture"],"e":"Scaphocephaly is due to sagittal craniosynostosis.","d":"Scaphocephaly is due to sagittal craniosynostosis. A sagittal ridge may be seen.##Scaphocephaly results from sagittal synostosis."},{"g":"8-47 · Craniosynostosis","q":"What shape follows coronal suture closure?","c":"Short, wide cranium","w":["Long, narrow cranium","Pointed cranium only","Normal shape"],"e":"Coronal and lambdoid closure results in a short, wide cranium.","d":"Coronal and lambdoid closure results in a short, wide cranium. This is brachycephaly.##Coronal closure gives brachycephaly."},{"g":"8-47 · Craniosynostosis","q":"What is brachycephaly caused by?","c":"Coronal craniosynostosis","w":["Sagittal craniosynostosis","Squamous fracture","Hydrocephalus only"],"e":"Brachycephaly is due to coronal craniosynostosis.","d":"Brachycephaly is due to coronal craniosynostosis. Growth is limited at the coronal sutures.##Brachycephaly results from coronal synostosis."},{"g":"8-47 · Craniosynostosis","q":"Which suture closure also gives a short, wide cranium?","c":"Lambdoid","w":["Sagittal","Metopic only","Squamous"],"e":"Coronal and lambdoid suture closure results in a short, wide cranium.","d":"Coronal and lambdoid suture closure results in a short, wide cranium. Both limit anteroposterior growth.##Lambdoid closure shortens the skull."},{"g":"8-47 · Craniosynostosis","q":"Which growth dimension is altered by sagittal closure?","c":"Width","w":["Height only","Facial depth","Mandibular length"],"e":"If the sagittal suture closes prematurely, growth in width is altered.","d":"If the sagittal suture closes prematurely, growth in width is altered. Growth then occurs lengthwise.##Sagittal closure restricts width."},{"g":"8-47 · Craniosynostosis","q":"How common is craniosynostosis?","c":"About 1 in 2000 births","w":["About 1 in 20","About 1 in 200","About 1 in 200,000"],"e":"The disorder occurs in about 1 in 2000 births.","d":"The disorder occurs in about 1 in 2000 births. It is more common in men than in women.##Incidence is about 1 in 2000."},{"g":"8-47 · Craniosynostosis","q":"Which sex is more affected by craniosynostosis?","c":"Men","w":["Women","Equal","Only women"],"e":"It is more common in men than in women.","d":"It is more common in men than in women. Genetic factors may play a role.##It is more common in men."},{"g":"8-48 · Congenital anomalies of the oral cavity","q":"How do clefts of the lip and palate arise?","c":"Incomplete or failed fusion of prominences","w":["Excess bone deposition","Premature suture closure","Infection of the tongue"],"e":"The face and oral cavity develop by midline fusion, so incomplete fusion causes clefts.","d":"The face and oral cavity develop by midline fusion, so incomplete fusion causes clefts. Anomalous features such as ankyloglossia can also arise.##Clefts result from failed fusion."},{"g":"8-48 · Congenital anomalies of the oral cavity","q":"What is the etiology of these anomalies?","c":"Multifactorial, with some genetic role","w":["Purely traumatic","Purely infectious","Always autosomal dominant"],"e":"The etiology is multifactorial, but genetics appears to play some role.","d":"The etiology is multifactorial, but genetics appears to play some role. Environmental factors also contribute.##The etiology is multifactorial."},{"g":"8-48 · Congenital anomalies of the oral cavity","q":"What is ankyloglossia?","c":"Restricted tongue movement from a short lingual frenulum","w":["A yperacusis?","c":"Below the stylomastoid foramen","w":["Facial canal","Geniculate ganglion","Internal auditory meatus"],"e":"It lies distal to the chorda tympani and stapedius branches."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Taste is lost from which area?","c":"Anterior tongue","w":["Posterior tongue","Soft palate","Epiglottis"],"e":"Chorda tympani carries anterior tongue taste."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Which nerve branch is responsible for the taste loss?","c":"Chorda tympani","w":["Greater petrosal","Posterior auricular","Cervical branch"],"e":"Chorda tympani."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Decreased salivation reflects loss of secretion from?","c":"Submandibular and sublingual glands","w":["Parotid gland","Lacrimal gland","Minor palatal glands only"],"e":"Chorda tympani fibres relay via the submandibular ganglion."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Which early symptom is illustrated with a telephone?","c":"Holding the phone away because sound is painful","w":["Dropping the phone","Not hearing the ring","Slurred speech"],"e":"That is hyperacusis."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Hyperacusis is due to paralysis of?","c":"Stapedius","w":["Tensor tympani","Buccinator","Masseter"],"e":"The stapedius normally dampens loud sound."},{"g":"8-18 · Bell’s palsy (extended set)","q":"What happens on attempted eye closure in peripheral palsy?","c":"Eyeball rolls up, sclera exposed","w":["Lid closes tightly","Pupil dilates","Eye adducts"],"e":"This is Bell’s phenomenon."},{"g":"8-18 · Bell’s palsy (extended set)","q":"Can the patient wrinkle the forehead in peripheral palsy?","c":"No, it is lost on the affected side","w":["Yes, fully preserved","Only when smiling","Only on the opposite side"],"e":"Forehead wrinkling is lost."},{"g":"8-18 · Bell’s palsy (extended set)","q":"What happens when the patient tries to smile in peripheral palsy?","c":"Cannot show teeth on the affected side","w":["Smile is const $=id=>document.getElementById(id),E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const G=[];D.forEach(x=>{if(!G.includes(x.g))G.push(x.g)});
const cnt=G.map(g=>D.filter(x=>x.g===g).length);
let shufQ=false,sel=new Set(G.map((_,k)=>k)),size=0,Q=[],n=0,last=null,t0=0,tick=null,live=false;
const L='ABCD';
function clock(){const s=Math.floor((Date.now()-t0)/1000);$('tm').textContent='Time '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function pool(){return D.filter(x=>sel.has(G.indexOf(x.g)))}
function setup(){
 live=false;clearInterval(tick);$('h2').textContent='';$('tm').textContent='';$('mk').hidden=true;$('ft').innerHTML='<span>Tutor mode: answers and explanations show immediately</span>';
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">Create block</h2><p>Questions per block</p><div class="sg">${[0,10,25,40,100].map(v=>`<button data-v="${v}" class="${size===v?'on':''}">${v||'All'}</button>`).join('')}</div>
 <p><label><input type="checkbox" id="sq" ${shufQ?'checked':''}> Shuffle question order</label></p>
 <p><span id="cnt"></span> <button class="sg" style="border:0;background:none;color:#16365c;text-decoration:underline;cursor:pointer" id="all">Select all</button> <button style="border:0;background:none;color:#16365c;text-decoration:underline;cursor:pointer" id="none">Clear</button></p>
 <div class="chips">${G.map((g,k)=>`<label><input type="checkbox" data-k="${k}" ${sel.has(k)?'checked':''}><span>${E(g)} (${cnt[k]})</span></label>`).join('')}</div><p><button class="bt" id="go">Start block</button></p></div>`;
 const u=()=>{const m=pool().length;$('cnt').textContent=sel.size+' of '+G.length+' focuses, '+m+' questions.';$('go').disabled=!m};
 document.querySelectorAll('.sg button[data-v]').forEach(b=>b.onclick=()=>{size=+b.dataset.v;document.querySelectorAll('.sg button[data-v]').forEach(c=>c.classList.toggle('on',c===b))});
 document.querySelectorAll('.chips input').forEach(c=>c.onchange=()=>{c.checked?sel.add(+c.dataset.k):sel.delete(+c.dataset.k);u()});
 const all=v=>{sel=v?new Set(G.map((_,k)=>k)):new Set();document.querySelectorAll('.chips input').forEach(c=>c.checked=v);u()};
 $('all').onclick=()=>all(1);$('none').onclick=()=>all(0);$('sq').onchange=e=>{shufQ=e.target.checked};$('go').onclick=()=>start(pool(),size);u();
}
function start(p,lim,re){
 if(!re)last={p,lim};
 let a=p.map(x=>({...x,o:sh([x.c,...x.w]),a:null,m:false}));if(shufQ)sh(a);if(lim&&a.length>lim)a=a.slice(0,lim);
 Q=a;n=0;t0=Date.now();clearInterval(tick);tick=setInterval(clock,1000);clock();live=true;$('mk').hidden=false;show();
}
function show(){
 const x=Q[n];$('h2').textContent='Item '+(n+1)+' of '+Q.length;
 $('mk').textContent=x.m?'Unmark':'Mark';
 $('app').innerHTML=`<div class="nav">${Q.map((y,i)=>`<button data-i="${i}" class="${i===n?'cur ':''}${y.a===null?'':y.o[y.a]===y.c?'ok ':'bad '}${y.m?'mk':''}">${i+1}</button>`).join('')}</div>
 <div class="main"><span class="ctx">Clinical Focus ${E(x.g)}</span><p class="q">${E(x.q)}</p>${x.o.map((o,k)=>`<button class="c" data-k="${k}"><i>${L[k]}</i><span>${E(o)}</span></button>`).join('')}<div id="ex"></div></div>`;
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{n=+b.dataset.i;show()});
 document.querySelectorAll('.c').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 $('ft').innerHTML=`<button class="bt g" id="pv" ${n?'':'disabled'}>Previous</button><button class="bt g" id="eb">End block</button><button class="bt" id="nx" ${n<Q.length-1?'':'disabled'}>Next</button>`;
 $('pv').onclick=()=>{n--;show()};$('nx').onclick=()=>{n++;show()};$('eb').onclick=end;
 if(x.a!==null)reveal();
}
function pick(k){const x=Q[n];if(x.a!==null)return;x.a=k;show()}
function reveal(){
 const x=Q[n],r=x.o[x.a]===x.c;
 document.querySelectorAll('.c').forEach((b,j)=>{b.disabled=true;if(x.o[j]===x.c)b.classList.add('ok');else if(j===x.a)b.classList.add('bad')});
 const [a,b]=(x.d||x.e).split('##'),oc=b||'Focus: '+x.g;
 $('ex').innerHTML=`<div class="ex"><h3>${r?'Correct':'Incorrect'}. Correct answer: ${L[x.o.indexOf(x.c)]}. ${E(x.c)}</h3><p class="t">Explanation</p><p style="margin:0">${E(a)}</p><div class="o"><b>Educational objective:</b> ${E(oc.replace(/^Educational objective:\s*/,''))}</div></div>`;
}
function end(){
 live=false;clearInterval(tick);const done=Q.filter(x=>x.a!==null),ok=done.filter(x=>x.o[x.a]===x.c),miss=Q.filter(x=>x.a!==null&&x.o[x.a]!==x.c),by={};miss.forEach(x=>by[x.g]=(by[x.g]||0)+1);
 $('mk').hidden=true;$('h2').textContent='Block summary';$('ft').innerHTML='<span></span>';
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">Score: ${ok.length} / ${Q.length} (${Math.round(100*ok.length/Q.length)}%)</h2><p>${done.length} answered, ${Q.length-done.length} unanswered. ${$('tm').textContent}</p>${miss.length?'<p><b>Review these focuses</b></p>'+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([g,c])=>`<p style="margin:3px 0">${c} missed: ${E(g)}</p>`).join(''):''}
 <p>${miss.length?'<button class="bt" id="rm">Retry '+miss.length+' missed</button> ':''}<button class="bt" id="ag">New block</button> <button class="bt" id="rv">Review items</button> <button class="bt" id="bk">Change focuses</button></p></div>`;
 if(miss.length)$('rm').onclick=()=>start(miss.slice(),0,true);
 $('ag').onclick=()=>start(last.p,last.lim);$('bk').onclick=setup;$('rv').onclick=()=>{live=true;$('mk').hidden=false;n=0;show()};
}
$('mk').onclick=()=>{Q[n].m=!Q[n].m;show()};
document.addEventListener('keydown',e=>{if(!live||!Q.length)return;const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0)pick(k%4);else if(e.key==='ArrowRight'&&n<Q.length-1){n++;show()}else if(e.key==='ArrowLeft'&&n>0){n--;show()}});
setup();
</script></body></html>
