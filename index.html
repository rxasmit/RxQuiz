<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf1;color:#1b1f23;font:16px/1.5 Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hd,.ft{background:#16365c;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;font-size:14px}

.main{flex:1;padding:18px;max-width:900px}
.ctx{display:inline-block;background:#dbe6f2;border:1px solid #b5c6da;color:#16365c;font-size:13px;font-weight:bold;padding:2px 9px;margin-bottom:10px}
.q{font-size:18px;margin:0 0 16px}
.c{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid #b7c1cb;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.c:disabled{cursor:default}.c i{font-style:normal;font-weight:bold;min-width:20px;height:20px;border:2px solid #5a6b7c;border-radius:50%;font-size:11px;text-align:center;line-height:16px;flex:none}
.c.ok{background:#d9f2e1;border-color:#2e8b57}.c.ok i{background:#2e8b57;border-color:#2e8b57;color:#fff}
.c.bad{background:#fbdad7;border-color:#c0392b}.c.bad i{background:#c0392b;border-color:#c0392b;color:#fff}
.ex{scroll-margin-bottom:70px;background:#fff;border:1px solid #b7c1cb;border-left:5px solid #16365c;margin-top:14px;padding:14px 16px}

.bt:disabled{opacity:.4}.bt.g{background:transparent;color:#fff;border-color:#8fa6c1}
.card{background:#fff;border:1px solid #b7c1cb;padding:18px;margin:18px;max-width:760px}
.chips label{display:inline-block;margin:3px 6px 3px 0}.chips span{display:inline-block;border:1px solid #9aa7b4;padding:3px 10px;font-size:14px;cursor:pointer;background:#fff}
.chips input{position:absolute;opacity:0}.chips input:checked+span{background:#16365c;color:#fff;border-color:#16365c}.chips input:focus-visible+span{outline:2px solid #d4a000}
.card .bt{background:#16365c;color:#fff;border-color:#16365c}.sg button{font:inherit;margin:0 6px 10px 0;padding:4px 14px;border:1px solid #9aa7b4;background:#fff;cursor:pointer}.sg .on{background:#16365c;color:#fff}
button:focus-visible{outline:2px solid #d4a000}
@media(max-width:640px){.nav{display:none}.main{padding:12px}}
#usr{display:flex;align-items:center;gap:8px}#usr img{width:24px;height:24px;border-radius:50%}#usr[hidden],#login[hidden]{display:none}body.inq #un,body.inq #av{display:none}
#login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(circle at 18% 22%,rgba(22,54,92,.55),transparent 34%),radial-gradient(circle at 82% 18%,rgba(36,78,128,.42),transparent 36%),radial-gradient(circle at 52% 88%,rgba(22,54,92,.5),transparent 38%),linear-gradient(135deg,#eef3f8 0%,#dbe6f2 45%,#f6f8fa 100%);background-size:180% 180%;animation:rxBg 4s ease-in-out infinite alternate}
@keyframes rxBg{0%{background-position:0% 20%,100% 10%,50% 100%,0% 50%}50%{background-position:35% 35%,70% 30%,45% 70%,50% 50%}100%{background-position:70% 10%,30% 45%,60% 35%,100% 50%}}
.ac{width:min(430px,100%);display:grid;gap:18px;border:1px solid #c9d6e4;border-radius:8px;padding:24px;background:rgba(255,255,255,.92);box-shadow:0 18px 48px rgba(22,54,92,.18);text-align:left}
.ab{display:flex;align-items:flex-start;gap:12px}.am{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid #c9d6e4;border-radius:8px;background:#fff;box-shadow:0 18px 48px rgba(22,54,92,.18);color:#16365c}
.am svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ab h1{margin:0;font-size:1.7rem;line-height:1.05}.ab p{margin:5px 0 0;color:#5a6b7c;font-size:.95rem}
.lb{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:42px;padding:10px 13px;border:0;border-radius:8px;background:#eef3f8;color:#1b1f23;font:inherit;font-weight:700;cursor:pointer}
.lb[hidden]{display:none}.lb.pr{background:#16365c;color:#fff}.lb.pr:hover{background:#24508a}.lb:hover{filter:brightness(.98)}
.lb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#ef{display:grid;gap:12px}#ef[hidden]{display:none}#ef p{margin:0}.oc{text-align:center;color:#5a6b7c;font-size:14px}
#ef input{width:100%;min-height:42px;font:inherit;padding:9px 12px;border:1px solid #c9d6e4;border-radius:8px;background:#fff}#ef input:focus{outline:2px solid #24508a}
#ef a{color:#16365c;font-size:14px}#lm{min-height:22px;margin:0;font-size:.9rem;line-height:1.4;color:#a02218}#lm.ok{color:#1e6b3f}
</style></head><body>

<script>
/*QUIZ_DATA_START*/
const QUIZZES={
"heartfailure":{"name":"Heart Failure (Pathology)","D":[
{"g":"1 · Ventricular function and loads","q":"A patient's echocardiogram shows an end-diastolic volume of 140 mL and an end-systolic volume of 90 mL. What is the approximate ejection fraction?","c":"About 36%","w":["About 64%","About 50%","About 22%"],"e":"SV = 140 − 90 = 50 mL, so EF = 50 ÷ 140 ≈ 36%, which is reduced.","ob":"EF = (EDV − ESV) ÷ EDV × 100."},
{"g":"1 · Ventricular function and loads","q":"A healthy ventricle with unchanged contractility suddenly faces markedly higher systemic vascular resistance. Which immediate change is expected?","c":"Lower stroke volume with higher end-systolic volume","w":["Higher stroke volume with lower end-systolic volume","Unchanged stroke volume with lower end-diastolic volume","Higher ejection fraction with lower end-systolic volume"],"e":"Greater afterload reduces ejection, so more blood remains at end-systole.","ob":"Acute afterload rise lowers SV and raises ESV."},
{"g":"1 · Ventricular function and loads","q":"Which measurement is the most useful estimate of ventricular preload?","c":"End-diastolic volume","w":["End-systolic volume","Mean arterial pressure","Ejection fraction"],"e":"Preload is the stretch of fibers at end-diastole, estimated by EDV.","ob":"EDV is the practical estimate of preload."},
{"g":"1 · Ventricular function and loads","q":"A 70-year-old has severe aortic stenosis and normal systemic blood pressure. Which statement about LV load is correct?","c":"Afterload is increased despite normal arterial BP","w":["Afterload is normal because arterial BP is normal","Preload is the only load increased by the valve","Afterload falls because ejection velocity is higher"],"e":"Aortic stenosis raises LV afterload even without systemic hypertension.","ob":"Aortic stenosis increases afterload independent of arterial BP."},
{"g":"1 · Ventricular function and loads","q":"Within physiological limits, why does a greater end-diastolic volume increase stroke volume?","c":"Stretched sarcomeres generate greater active tension","w":["New sarcomeres are assembled in series within hours","Aortic pressure falls during early ventricular ejection","Sympathetic outflow to the sinoatrial node declines"],"e":"This is the Frank-Starling mechanism: longer sarcomeres develop more tension without new muscle growth.","ob":"Frank-Starling is an immediate stretch-dependent response."},
{"g":"1 · Ventricular function and loads","q":"Which statement correctly contrasts the Frank-Starling mechanism with hypertrophy?","c":"Frank-Starling is immediate; hypertrophy is slower and structural","w":["Both are immediate responses that need no protein synthesis","Frank-Starling is structural; hypertrophy is an acute stretch effect","Both depend on adult myocyte division in response to load"],"e":"Frank-Starling is a functional filling response; hypertrophy requires protein synthesis and sarcomere formation over time.","ob":"Frank-Starling = immediate; hypertrophy = slower structural adaptation."},
{"g":"1 · Ventricular function and loads","q":"A patient has chronic mitral regurgitation and an enlarged left ventricle. Which load is primarily increased?","c":"Preload from regurgitant filling volume","w":["Afterload from raised systemic resistance","Contractility from sympathetic stimulation","Afterload from aortic valve narrowing"],"e":"Regurgitant flow adds to venous return, raising end-diastolic volume and preload.","ob":"Regurgitant lesions raise preload."},
{"g":"1 · Ventricular function and loads","q":"A 66-year-old with exertional dyspnea has LVEF 60% and elevated filling pressures. Why does a normal EF not exclude heart failure?","c":"EF is a ratio and does not measure ventricular stiffness","w":["EF falls only when the right ventricle is the failing chamber","EF is calculated from the end-systolic volume alone, not EDV","EF rises in direct proportion to the left atrial pressure"],"e":"EF describes the fraction ejected; a stiff ventricle can eject normally yet need high pressure to fill.","ob":"Preserved EF does not exclude diastolic dysfunction."},
{"g":"1 · Ventricular function and loads","q":"If EDV is 120 mL and ESV is 50 mL, what is the ejection fraction?","c":"About 58%","w":["About 42%","About 70%","About 30%"],"e":"SV = 70 mL; 70 ÷ 120 ≈ 58%.","ob":"SV = EDV − ESV; EF = SV ÷ EDV."},
{"g":"1 · Ventricular function and loads","q":"A healthy heart receives increased venous return during exercise. What happens through the Frank-Starling mechanism?","c":"Stroke volume rises without chronic congestion","w":["Stroke volume falls with immediate pulmonary edema","Ejection fraction falls as filling pressure climbs","Afterload rises because sarcomeres are overstretched"],"e":"A healthy ventricle matches greater filling with greater forward output.","ob":"In a healthy heart, more filling means more output, not congestion."},
{"g":"1 · Ventricular function and loads","q":"In a failing, weakened ventricle, further increases in filling produce what effect?","c":"Little added stroke volume and rising filling pressure","w":["Proportionally greater stroke volume with falling pressure","A fall in end-diastolic volume with greater ejection","Stable pressure with a higher ejection fraction at once"],"e":"The failing curve is flat: extra filling raises pressure that is transmitted backward into the veins.","ob":"The failing ventricle has little Frank-Starling reserve."},
{"g":"1 · Ventricular function and loads","q":"A patient has a heart rate of 80/min and a stroke volume of 60 mL. What is the cardiac output?","c":"4.8 L/min","w":["6.0 L/min","3.2 L/min","7.5 L/min"],"e":"CO = HR × SV = 80 × 60 mL = 4800 mL/min.","ob":"Cardiac output = heart rate × stroke volume."},
{"g":"1 · Ventricular function and loads","q":"Which ventricular property is essential for normal diastolic filling?","c":"A compliant, relaxing chamber","w":["A thickened, noncompliant wall","A high resting afterload state","A reduced end-diastolic volume"],"e":"Normal filling requires a chamber that relaxes and expands easily.","ob":"Normal diastole needs a compliant ventricle."},
{"g":"1 · Ventricular function and loads","q":"Which two factors mainly determine systolic performance of the ventricle?","c":"Myocardial contractility and afterload","w":["Ventricular compliance and the heart rate","Atrial kick timing and the venous pressure","Valve closure speed and the pericardial tone"],"e":"Systolic performance depends on contractility and the load the ventricle pumps against.","ob":"Systole = contractility versus afterload."},
{"g":"1 · Ventricular function and loads","q":"Which drug effect would most directly reduce LV afterload?","c":"Arteriolar vasodilation lowering vascular resistance","w":["Venous constriction that raises venous return to the heart","Increased renal sodium retention that expands blood volume","A faster heart rate that raises myocardial oxygen work"],"e":"Afterload follows systemic vascular resistance; venous return and volume affect preload.","ob":"Arteriolar resistance determines afterload."},

{"g":"2 · Definition and compensation","q":"Which statement best defines heart failure?","c":"Inability to meet tissue needs, or only at raised filling pressures","w":["The heart stops contracting entirely because of acute coronary occlusion","Cardiac output is always reduced while filling pressures stay normal","A single disease of the myocardium caused by chronic hypertension only"],"e":"Heart failure is a syndrome: output is inadequate or maintained only at abnormally high filling pressures.","ob":"Heart failure is a syndrome, not a single disease."},
{"g":"2 · Definition and compensation","q":"A patient with severe low-output failure develops rising creatinine and confusion. Which mechanism explains these findings?","c":"Forward failure with reduced renal and cerebral perfusion","w":["Backward failure causing pulmonary venous congestion alone","Isolated right atrial distension producing portal hypertension","Excess natriuretic peptide causing excessive renal salt wasting"],"e":"Forward failure reduces perfusion, and the kidney and brain are especially affected.","ob":"Forward failure hypoperfuses kidney and brain."},
{"g":"2 · Definition and compensation","q":"Blood pooling behind a failing left ventricle chiefly produces which finding?","c":"Pulmonary congestion","w":["Systemic venous congestion","Hepatic engorgement first","Peripheral pitting edema first"],"e":"Backward failure of the left side raises pulmonary venous pressure.","ob":"Left-sided backward failure causes pulmonary congestion."},
{"g":"2 · Definition and compensation","q":"Sympathetic activation in heart failure raises afterload through which action?","c":"Arteriolar vasoconstriction","w":["Venous dilation","Natriuresis","Bradycardia"],"e":"Arteriolar constriction raises systemic vascular resistance and thus afterload.","ob":"SNS raises afterload by arteriolar vasoconstriction."},
{"g":"2 · Definition and compensation","q":"Which effect of aldosterone increases preload in heart failure?","c":"Sodium and water retention expanding circulating volume","w":["Arteriolar vasodilation that reduces systemic resistance","Renal sodium loss producing a fall in circulating volume","Reduced venous return through widespread venous pooling"],"e":"Aldosterone-mediated retention raises circulating volume, venous return and preload.","ob":"Aldosterone increases preload via salt and water retention."},
{"g":"2 · Definition and compensation","q":"Angiotensin II contributes to the failing heart's workload mainly by increasing which load?","c":"Afterload via vasoconstriction","w":["Preload via venodilation","Contractility via myocyte loss","Compliance via fibrosis loss"],"e":"Angiotensin II is a potent vasoconstrictor, raising afterload.","ob":"Angiotensin II raises afterload."},
{"g":"2 · Definition and compensation","q":"Which describes the long-term consequence of neurohumoral compensation in heart failure?","c":"More cardiac stress and congestion","w":["Restored normal wall stress permanently","Lower afterload and lower preload","Reversal of ventricular remodeling"],"e":"Short term, SNS and RAAS maintain BP and perfusion; long term they add stress and congestion.","ob":"Compensation helps short term and harms long term."},
{"g":"2 · Definition and compensation","q":"BNP is released mainly from which cells, and in response to what?","c":"Ventricular myocytes, in response to wall stress","w":["Atrial myocytes, in response to hypoxemia","Renal tubular cells, in response to hypovolemia","Adrenal cortical cells, in response to angiotensin II"],"e":"BNP comes from ventricular myocytes when wall stress rises.","ob":"BNP reflects ventricular wall stress."},
{"g":"2 · Definition and compensation","q":"ANP is released predominantly from which structure?","c":"Atrial myocytes","w":["Ventricular endocardium","Juxtaglomerular cells","Adrenal medulla"],"e":"ANP is released mainly from stretched atrial myocytes.","ob":"ANP comes mainly from atrial myocytes."},
{"g":"2 · Definition and compensation","q":"Which pair of actions characterizes natriuretic peptides?","c":"Vasodilation and renal salt and water excretion","w":["Vasoconstriction and renal salt and water retention","Vasodilation and renal salt and water retention","Vasoconstriction and renal salt and water excretion"],"e":"They oppose RAAS and sympathetic vasoconstriction.","ob":"Natriuretic peptides vasodilate and promote natriuresis."},
{"g":"2 · Definition and compensation","q":"A dyspneic patient has a very low BNP. How does this alter the likelihood of CHF?","c":"Makes significant CHF less likely","w":["Confirms severe systolic dysfunction","Proves the dyspnea is purely cardiac","Indicates isolated right-sided failure"],"e":"A low BNP has strong negative predictive value.","ob":"Low BNP makes significant CHF less likely."},
{"g":"2 · Definition and compensation","q":"Why is natriuretic peptide release usually insufficient in established heart failure?","c":"It is overwhelmed by RAAS, sympathetic drive and remodeling","w":["Atrial and ventricular myocytes stop responding to stretch","Renal tubules become unable to excrete any sodium at all","Wall stress is too low to stimulate hormone release at all"],"e":"The peptides are released but cannot overcome the combined opposing forces.","ob":"Natriuretic peptides are outweighed in established failure."},
{"g":"2 · Definition and compensation","q":"Which event most typically precipitates acute heart failure in a previously healthy patient?","c":"Large acute myocardial infarction","w":["Slowly progressive systemic hypertension","Chronic mild aortic regurgitation","Gradual loss of pulmonary capacity"],"e":"Acute MI, sudden valve dysfunction or abrupt volume overload can precipitate acute failure.","ob":"Acute MI is a classic cause of acute failure."},
{"g":"2 · Definition and compensation","q":"Which statement best describes the self-reinforcing cycle of compensation?","c":"Low output activates SNS and RAAS, raising pre- and afterload","w":["High output activates ANP release, lowering both loads further","Low output suppresses SNS and RAAS, reducing cardiac stress","Raised afterload improves ejection and removes the stimulus"],"e":"Higher loads further stress the failing heart, lowering output again.","ob":"Lower output → SNS/RAAS → higher loads → more stress."},
{"g":"2 · Definition and compensation","q":"Early sympathetic stimulation in a patient with falling cardiac output primarily does what?","c":"Raises heart rate and contractility to support output","w":["Lowers heart rate and contractility to conserve oxygen","Raises natriuresis and diuresis to lower blood volume","Lowers vascular resistance to reduce the ventricular load"],"e":"This temporarily supports output and perfusion.","ob":"Sympathetic drive raises heart rate and contractility."},

{"g":"3 · Cardiac hypertrophy","q":"Why do adult cardiac myocytes respond to a sustained increase in workload by enlarging rather than multiplying?","c":"They have very limited capacity to proliferate","w":["They lack sarcomeres until a stimulus triggers division","They are continuously replaced by circulating stem cells","They cannot synthesize new protein under hemodynamic load"],"e":"Adult myocytes have limited proliferative capacity, so mass increases by cell enlargement.","ob":"Hypertrophy is myocyte enlargement, not hyperplasia."},
{"g":"3 · Cardiac hypertrophy","q":"A 58-year-old has long-standing hypertension. How are new sarcomeres arranged in his hypertrophied myocytes?","c":"Predominantly in parallel, thickening the wall","w":["Predominantly in series, lengthening the cells","Randomly arranged, leaving the wall thickness unchanged","Only within the atrial myocytes, sparing the ventricles"],"e":"Pressure overload adds sarcomeres in parallel, increasing cross-sectional area.","ob":"Pressure overload → parallel sarcomeres → thick wall."},
{"g":"3 · Cardiac hypertrophy","q":"A patient has chronic severe aortic regurgitation. Which ventricular adaptation is expected?","c":"Sarcomeres added in series with chamber dilation","w":["Sarcomeres added in parallel with a small cavity","Loss of sarcomeres with wall thinning and fibrosis","No structural change because preload is unchanged"],"e":"Volume overload lengthens myocytes and dilates the chamber.","ob":"Volume overload → series sarcomeres → dilation."},
{"g":"3 · Cardiac hypertrophy","q":"Gross examination shows a thick left ventricular wall and a small cavity. This pattern is called?","c":"Concentric hypertrophy","w":["Eccentric hypertrophy","Dilated cardiomyopathy","Restrictive remodeling"],"e":"Concentric hypertrophy is increased wall thickness with a small or preserved cavity.","ob":"Concentric = thick wall, small cavity."},
{"g":"3 · Cardiac hypertrophy","q":"At autopsy a dilated heart has normal wall thickness. Which is the best way to confirm hypertrophy?","c":"Measure total heart weight","w":["Measure wall thickness alone","Count myocyte nuclei per field","Estimate the cavity diameter"],"e":"In dilated hearts, wall thickness can look normal despite increased mass; heart weight is better.","ob":"Heart weight is the better measure of hypertrophy."},
{"g":"3 · Cardiac hypertrophy","q":"Which feature distinguishes the heart of a long-distance runner from that of a patient with chronic hypertension?","c":"Preserved capillary supply without interstitial fibrosis","w":["Greater myocardial mass with entirely unchanged cardiac function","A thicker wall together with a larger ventricular cavity","Fetal gene reprogramming with enlarged hyperchromatic nuclei"],"e":"Physiological hypertrophy keeps microvascular adaptation and function; pathological hypertrophy does not.","ob":"Look beyond heart size: cause, fibrosis, capillaries, function."},
{"g":"3 · Cardiac hypertrophy","q":"Why does a hypertrophied myocardium become vulnerable to ischemia?","c":"Muscle mass outgrows its capillary supply","w":["Coronary arteries become dilated by enlarged myocytes","Myocyte oxygen consumption falls as cells get larger","Collagen deposition improves diffusion distance to cells"],"e":"Mass increases without proportional capillary growth, so demand outstrips supply.","ob":"Hypertrophy raises oxygen demand without matching supply."},
{"g":"3 · Cardiac hypertrophy","q":"Interstitial fibrosis in hypertrophied myocardium most directly causes which two problems?","c":"Reduced compliance and a risk of arrhythmia","w":["Increased compliance and a risk of ventricular rupture","Reduced afterload and improved electrical conduction","Increased contractility and shortened diastolic filling time"],"e":"Collagen stiffens the ventricle and disrupts electrical propagation.","ob":"Fibrosis causes stiffness and arrhythmia."},
{"g":"3 · Cardiac hypertrophy","q":"Persistent mechanical stress in hypertrophy reactivates which type of program?","c":"Fetal gene expression","w":["Apoptotic cascades only","Cell cycle division","Embryonic stem cell renewal"],"e":"Growth signaling and fetal gene programs alter myosin and natriuretic peptide expression.","ob":"Pathological hypertrophy reactivates fetal genes."},
{"g":"3 · Cardiac hypertrophy","q":"A 64-year-old with compensated concentric LV hypertrophy develops acute heart failure after an ischemic episode. Why?","c":"High oxygen demand with a tenuous supply","w":["Low oxygen demand from an enlarged chamber","Excess capillary density causing steal syndrome","Loss of interstitial collagen weakening the wall"],"e":"Ischemia can tip a demand-heavy, supply-limited heart into decompensation.","ob":"Ischemia can precipitate decompensation of hypertrophy."},
{"g":"3 · Cardiac hypertrophy","q":"Which condition most typically produces concentric left ventricular hypertrophy?","c":"Aortic stenosis","w":["Mitral regurgitation","Aortic regurgitation","Ventricular septal defect"],"e":"Aortic stenosis is a pressure overload; the others are volume overloads.","ob":"Pressure overload: hypertension and aortic stenosis."},
{"g":"3 · Cardiac hypertrophy","q":"Which term describes an increase in chamber size, regardless of wall thickness?","c":"Dilation","w":["Hypertrophy","Hyperplasia","Metaplasia"],"e":"Hypertrophy is increased myocardial mass; dilation is increased chamber size.","ob":"Dilation = increased chamber size."},
{"g":"3 · Cardiac hypertrophy","q":"Which histologic change is typical of hypertrophied cardiomyocytes?","c":"Enlarged hyperchromatic nuclei","w":["Shrunken pyknotic nuclei with loss of striations","Neutrophilic infiltrate around necrotic fibers","Fatty replacement with absence of nuclei"],"e":"Enlarged, hyperchromatic nuclei are seen as DNA replicates without cell division.","ob":"Hypertrophied myocytes show enlarged hyperchromatic nuclei."},
{"g":"3 · Cardiac hypertrophy","q":"Which statement about cardiomegaly is correct?","c":"It may result from hypertrophy, dilation, or both","w":["It always indicates true myocyte hyperplasia in the heart","It implies hypertrophy and therefore excludes any dilation","It occurs only in states of chronic pressure overload"],"e":"Cardiomegaly is a gross description with several possible mechanisms.","ob":"Cardiomegaly = hypertrophy, dilation, or both."},
{"g":"3 · Cardiac hypertrophy","q":"Why can volume-overload dilation progress to systolic failure?","c":"Greater wall stress raises work and oxygen demand","w":["Thinner sarcomeres reduce the wall stress and work","Larger chambers lower oxygen demand through hypertrophy","Series sarcomeres increase myocardial thickness greatly"],"e":"An enlarged chamber has higher wall stress, promoting remodeling and eventual pump failure.","ob":"Dilation raises wall stress and demand."},
{"g":"3 · Cardiac hypertrophy","q":"Which sequence best summarizes the progression to heart failure?","c":"Increased load, remodeling, functional decline, failure","w":["Increased load, fibrosis regression, recovery, failure","Remodeling, increased load, hypertrophy regression, failure","Failure, remodeling, increased load, functional decline"],"e":"Compensation → remodeling → decompensation, with several mechanisms operating at once.","ob":"Compensation → remodeling → decompensation."},

{"g":"4 · Systolic vs diastolic failure","q":"A 63-year-old man had an MI two years ago and now has orthopnea and fatigue. Echo shows a dilated LV with LVEF 30%. Which best describes the primary defect?","c":"Impaired ejection from reduced contractility","w":["Impaired filling from reduced compliance","Impaired filling from pericardial constriction","Impaired ejection from fixed valvular obstruction"],"e":"Loss of contracting myocardium reduces SV and EF: systolic failure.","ob":"Systolic failure = impaired ejection."},

function start(p,lim,re){
 if(!re)last={p,lim};

/* ===== END SETTINGS ===== */
const g=id=>document.getElementById(id),msg=(t,ok)=>{g('lm').textContent=t;g('lm').className=ok?'ok':''};
let started=false;
const enter=()=>{g('login').hidden=true;if(!started){started=true;startQuiz()}};
if(firebaseConfig.apiKey.startsWith('YOUR_')){
 msg('Firebase is not set up yet. Add your config in the settings block of this file.');g('sk').hidden=false;g('sk').onclick=enter;
}else try{
 const B='https://www.gstatic.com/firebasejs/10.14.1/';
 const {initializeApp}=await import(B+'firebase-app.js');
 const {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink}=await import(B+'firebase-auth.js');
 const auth=getAuth(initializeApp(firebaseConfig)),prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
 g('lg').onclick=async()=>{msg('');try{await signInWithPopup(auth,prov)}catch(e){
  if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return signInWithRedirect(auth,prov);
  if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')msg(e.code==='auth/unauthorized-domain'?'This website address is not in Firebase "Authorized domains".':'Sign-in failed ('+(e.code||e.message)+').')}};
 g('so').onclick=()=>{if(hasProgress()&&!confirm('Sign out? Your progress in this block will be lost.'))return;signOut(auth)};
 const val=()=>[g('ei').value.trim(),g('pw').value];
 const ERR={'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'That email address is not valid.','auth/missing-password':'Enter your password.','auth/email-already-in-use':'An account with this email already exists. Try Sign in, or Forgot password.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Please wait a few minutes.','auth/unauthorized-continue-uri':'This website address is not in Firebase "Authorized domains".','auth/missing-email':'Enter your email first.'};
 const fail=e=>msg(ERR[e.code]||'Something went wrong ('+(e.code||e.message)+').');
 let mode='in';
 const setMode=m=>{mode=m;const c=m==='up';g('eh').textContent=c?'Create an account with your email':'or sign in with your email';g('si').textContent=c?'Create account':'Sign in';g('sw').textContent=c?'Already have an account? Sign in':'New here? Create an account';g('xl').hidden=c;g('pw').placeholder=c?'Password (at least 6 characters)':'Password';g('pw').autocomplete=c?'new-password':'current-password';msg('')};
 g('sw').onclick=ev=>{ev.preventDefault();setMode(mode==='in'?'up':'in')};
 g('si').onclick=async()=>{msg('');const[e,p]=val();if(!e)return msg('Type your email address first.');if(!p)return msg('Type your password.');try{if(mode==='up')await createUserWithEmailAndPassword(auth,e,p);else await signInWithEmailAndPassword(auth,e,p)}catch(x){fail(x)}};
 g('fp').onclick=async ev=>{ev.preventDefault();msg('');const[e]=val();if(!e)return msg('Enter your email first.');try{await sendPasswordResetEmail(auth,e)}catch(x){if(x.code!=='auth/user-not-found')return fail(x)}msg('If an account exists for that email, a reset link has been sent (check spam).',true)};
 g('ml').onclick=async ev=>{ev.preventDefault();msg('');const[e]=val();if(!e)return msg('Enter your email first.');try{await sendSignInLinkToEmail(auth,e,{url:location.origin+location.pathname,handleCodeInApp:true});try{localStorage.setItem('rxq_email',e)}catch(_){}msg('Sign-in link sent to '+e+'. Open it on this device (check spam).',true)}catch(x){fail(x)}};
 g('pw').onkeydown=ev=>{if(ev.key==='Enter')g('si').click()};
 const okEmail=u=>!ALLOWED_EMAILS.length||ALLOWED_EMAILS.map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase());
 onAuthStateChanged(auth,async u=>{
  if(u&&!u.emailVerified){await sendEmailVerification(u).catch(()=>{});setMode('in');msg('Verify your email first: we sent a link to '+u.email+' (check spam). Open it, then come back here and sign in.',true);await signOut(auth);return}
  if(u&&okEmail(u)){
   g('un').textContent=u.displayName||u.email||'';g('av').src=u.photoURL||'';g('av').hidden=!u.photoURL;g('usr').hidden=false;enter();
  }else{
   if(u){msg('This account ('+u.email+') is not allowed.');signOut(auth)}
   started=false;stopQuiz();g('usr').hidden=true;g('login').hidden=false;g('lg').hidden=false;g('ef').hidden=false;
  }});
 if(isSignInWithEmailLink(auth,location.href)){let e='';try{e=localStorage.getItem('rxq_email')||''}catch(_){}e=e||prompt('Confirm your email address to finish signing in');
  if(e)try{await signInWithEmailLink(auth,e.trim(),location.href);try{localStorage.removeItem('rxq_email')}catch(_){}}catch(x){fail(x)}history.replaceState(null,'',location.pathname)}
}catch(e){msg('Could not load Firebase. Check your internet connection, then reload.')}
</script></body></html>
