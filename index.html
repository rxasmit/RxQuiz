<script>
const QUIZZES={thorax:{name:'Thorax Clinical Focuses',D:[{"g":"3-1 · Thoracic cage injuries","q":"Thoracic injuries cause roughly what share of trauma deaths?","c":"About 25%","w":["About 5%","About 10%","Nearly 50%"],"e":"About 25% of trauma deaths are thoracic; the heart, great vessels, airway or cage may be involved.","ob":"Thoracic trauma accounts for about a quarter of trauma deaths."},{"g":"3-1 · Thoracic cage injuries","q":"Which rib groups are more protected and often escape fracture?","c":"Ribs 1–2 and 11–12","w":["Ribs 5–6 and 7–8 together","Ribs 3–4 and 9–10 together","Ribs 4–6 and 8–10 together"],"e":"The first two and last two ribs are better protected, so they fracture less often.","ob":"Ribs 1–2 and 11–12 are the best protected and least often fractured."},{"g":"3-1 · Thoracic cage injuries","q":"Why is pain from rib fractures so intense?","c":"Breathing keeps moving the fractured ribs","w":["Fragments always compress the spinal nerve roots","Periosteal swelling spreads to the diaphragm","Bone marrow release inflames the pleural lining"],"e":"The rib cage expands and contracts with every breath, so the fracture never rests.","ob":"Rib fracture pain is severe because every breath moves the injury."},{"g":"3-1 · Thoracic cage injuries","q":"Which procedure can palliate severe fractured-rib pain?","c":"Intercostal nerve block","w":["Phrenic nerve block","Thoracic epidural injection","Interscalene brachial block"],"e":"Anesthetizing the intercostal nerve relieves the pain of rib fractures.","ob":"An intercostal nerve block palliates fractured-rib pain."},{"g":"3-1 · Thoracic cage injuries","q":"Which injection site is preferred for an intercostal nerve block?","c":"Angle of the rib","w":["Posterior axillary line","Anterior axillary line","Parasternal region"],"e":"The angle of the rib is preferred; axillary lines, the fracture site and parasternal sites are alternatives.","ob":"The angle of the rib is the preferred intercostal block site."},{"g":"3-1 · Thoracic cage injuries","q":"After contacting the lower border of the rib, how is the needle advanced?","c":"Caudad, advanced about 1/8 inch","w":["Cephalad, advanced about 1/8 inch","Caudad, advanced about 1 inch deep","Cephalad, advanced about 1 inch deep"],"e":"The needle is withdrawn slightly, aimed caudad and advanced 1/8 inch to slip under the rib.","ob":"Pass under the rib's lower border, aim caudad and advance about 1/8 inch."},{"g":"3-1 · Thoracic cage injuries","q":"Why should you aspirate before injecting the anesthetic?","c":"To avoid causing a pneumothorax","w":["To confirm the needle reached the spinal canal","To measure the volume of pleural fluid present","To warm the anesthetic before it is injected"],"e":"Aspirating first helps avoid pneumothorax when the needle lies near the pleura.","ob":"Aspirate before injecting to avoid pneumothorax during an intercostal block."},{"g":"3-1 · Thoracic cage injuries","q":"Which finding makes a rib injury 'complicated'?","c":"Hemothorax from a torn vessel","w":["A single transverse rib fracture","Costochondral separation alone","Chondrosternal separation only"],"e":"Complicated injuries involve pleura, lung, vessels or heart; simple ones are isolated cage injuries.","ob":"Complicated cage injuries involve pleura, lung, great vessels or the heart."},{"g":"3-1 · Thoracic cage injuries","q":"Which injury belongs to the 'simple' group?","c":"Costochondral separation","w":["Pneumothorax with subcutaneous emphysema","Hemothorax from a torn vessel","Missile wound with heart injury"],"e":"Simple: transverse, oblique, overriding and chondral fractures, costochondral or chondrosternal separation, sternal fracture.","ob":"Simple cage injuries are isolated fractures, dislocations and separations."},{"g":"3-1 · Thoracic cage injuries","q":"Which is a pleural or lung complication of chest injury?","c":"Subcutaneous emphysema","w":["Costovertebral dislocation","Overriding rib fracture","Chondrosternal separation"],"e":"Pneumothorax, lung contusion and subcutaneous emphysema mark pleural or lung trauma.","ob":"Pneumothorax, contusion and subcutaneous emphysema signal pleural or lung injury."},{"g":"3-2 · Fibrocystic breast disease","q":"Fibrocystic change occurs in about what share of women?","c":"About 80%","w":["About 20%","About 50%","Nearly 95%"],"e":"It is a nonspecific term for benign conditions seen in about 80% of women.","ob":"Fibrocystic change is a benign condition affecting about 80% of women."},{"g":"3-2 · Fibrocystic breast disease","q":"Fibrocystic change is linked mainly to which process?","c":"Cyclic changes in glandular tissue","w":["Chronic bacterial infection of ducts","Autoimmune destruction of lobules","Malignant transformation of ducts"],"e":"It relates to cyclic changes in maturation and involution of glandular tissue.","ob":"Fibrocystic change reflects cyclic changes in glandular tissue."},{"g":"3-2 · Fibrocystic breast disease","q":"Which description fits fibrocystic disease?","c":"Tender, granular swelling","w":["Painless, firm, mobile solitary mass","Hard fixed mass with peau d'orange skin","Bloody discharge from a single duct"],"e":"The syndrome is tender, granular swelling; the other options describe fibroadenoma, cancer and papilloma.","ob":"Tender, granular swelling characterizes fibrocystic disease."},{"g":"3-2 · Fibrocystic breast disease","q":"What is the most common breast mass?","c":"Fibroadenoma","w":["Benign papilloma","Ductal carcinoma","Fibrocystic cyst"],"e":"Fibroadenoma is the second most common breast disease and the most common breast mass.","ob":"Fibroadenoma is the most common breast mass."},{"g":"3-2 · Fibrocystic breast disease","q":"What is the peak age for fibroadenoma?","c":"20 to 25 years","w":["35 to 45 years","50 to 60 years","Over 65 years of age"],"e":"Peak incidence is 20 to 25 years, with most cases below 30.","ob":"Fibroadenoma peaks at 20–25 years and mostly occurs below 30."},{"g":"3-2 · Fibrocystic breast disease","q":"How does a fibroadenoma usually present?","c":"Firm, painless, mobile, solitary mass","w":["Hard, painful, fixed, irregular mass","Soft, tender, fixed, multiple lumps","Hard, fixed mass with peau d'orange skin"],"e":"Fibroadenomas are firm, painless, mobile, solitary palpable masses.","ob":"Fibroadenoma is firm, painless, mobile and solitary."},{"g":"3-2 · Fibrocystic breast disease","q":"What is a fibroadenoma, histologically?","c":"Benign neoplasm of glandular epithelium","w":["Malignant tumor of the mammary stroma","Inflammatory change of lactiferous ducts","Cystic dilation of the nipple ducts"],"e":"It is a benign glandular epithelial neoplasm with increased periductal connective tissue.","ob":"Fibroadenoma is a benign glandular epithelial neoplasm with periductal connective tissue."},{"g":"3-2 · Fibrocystic breast disease","q":"What is true of fibroadenomas in adolescence?","c":"They may grow rapidly and need follow-up","w":["They typically shrink by puberty without review","They become cystic and then disappear fully","They stay static and never need re-examination"],"e":"They may grow rapidly in adolescence and warrant follow-up evaluation.","ob":"Rapidly growing adolescent breast masses warrant follow-up evaluation."},{"g":"3-2 · Fibrocystic breast disease","q":"Which feature points to a benign intracystic papilloma?","c":"Discharge from the nipple","w":["Peau d'orange skin change","Nipple inversion from duct shortening","Cyclic tender granular swelling"],"e":"Papilloma presents with nipple discharge; peau d'orange and inversion suggest cancer.","ob":"Nipple discharge is the clue to an intracystic papilloma."},{"g":"3-2 · Fibrocystic breast disease","q":"Which structure is seen in a benign intracystic papilloma?","c":"A papilloma on a fibrous stalk","w":["A stellate irregular mass with margins","A cluster of tender granular cysts","A firm mobile mass with a capsule"],"e":"The papilloma sits within breast tissue attached by a fibrous stalk.","ob":"An intracystic papilloma hangs on a fibrous stalk inside a cyst."},{"g":"3-3 · Breast cancer","q":"Which is the most common type of breast cancer?","c":"Infiltrating ductal carcinoma","w":["Inflammatory lobular carcinoma","Medullary papillary carcinoma","Intraductal papilloma variant"],"e":"Infiltrating ductal carcinoma accounts for about 75% of cases.","ob":"Infiltrating ductal carcinoma is the dominant breast cancer type."},{"g":"3-3 · Breast cancer","q":"About what share of breast cancers are infiltrating ductal?","c":"About 75%","w":["About 25%","About 50%","Nearly 95%"],"e":"Roughly three quarters of breast cancers are infiltrating ductal carcinoma.","ob":"About three quarters of breast cancers are infiltrating ductal."},{"g":"3-3 · Breast cancer","q":"In which group do more than two thirds of cases occur?","c":"Postmenopausal women","w":["Women under 30 years","Adolescent girls","Women in first pregnancy"],"e":"Over two thirds of breast cancers occur in postmenopausal women.","ob":"Most breast cancers occur in postmenopausal women."},{"g":"3-3 · Breast cancer","q":"Which breast quadrant holds about 60% of palpable tumors?","c":"Upper outer quadrant","w":["Upper inner quadrant","Lower outer quadrant","Central subareolar region only"],"e":"The upper outer quadrant is closest to the axilla and includes the axillary tail.","ob":"The upper outer quadrant, nearest the axilla, hosts most palpable tumors."},{"g":"3-3 · Breast cancer","q":"What causes skin dimpling over a breast carcinoma?","c":"Retracted suspensory ligaments","w":["Obstruction of subcutaneous lymphatics","Shortening of the mammary ducts","Fixation of the tumor to pectoralis major"],"e":"Tumor involvement retracts the suspensory (Cooper's) ligaments and dimples the skin.","ob":"Cooper's ligament retraction produces skin dimpling."},{"g":"3-3 · Breast cancer","q":"What produces the 'orange peel' (peau d'orange) skin?","c":"Lymphatic obstruction with skin edema","w":["Retraction of Cooper's ligaments by tumor","Shortening of the mammary ducts to skin","Venous thrombosis of superficial breast veins"],"e":"Obstructed subcutaneous lymphatics dilate and cause edema, making skin gland orifices prominent.","ob":"Lymphatic obstruction and edema produce peau d'orange."},{"g":"3-3 · Breast cancer","q":"What causes nipple retraction in breast cancer?","c":"Carcinoma shortening the mammary ducts","w":["Edema from obstructed subcutaneous lymphatics","Fibrous retraction of Cooper's ligaments only","Hormonal atrophy of the areolar glands"],"e":"Carcinoma involving mammary ducts shortens them and retracts or inverts the nipple.","ob":"Duct shortening by carcinoma retracts or inverts the nipple."},{"g":"3-3 · Breast cancer","q":"What share of breast cancers have a familial or genetic link?","c":"About 5–10%","w":["About 25–30%","About 40–50%","About 70–80%"],"e":"Only about 5–10% have a familial or genetic link.","ob":"Only 5–10% of breast cancers are familial or genetic."},{"g":"3-3 · Breast cancer","q":"Which genes are linked to familial breast cancer?","c":"BRCA1 and BRCA2","w":["RB1 and APC genes","MYC and RAS genes","CFTR and HFE genes"],"e":"BRCA1 and BRCA2 are tumor suppressor genes tied to inherited breast cancer.","ob":"BRCA1 and BRCA2 mutations underlie familial breast cancer."},{"g":"3-3 · Breast cancer","q":"Which set lists typical distant metastasis sites?","c":"Lungs and pleura, liver, bones, brain","w":["Kidneys, spleen, thyroid and ovaries only","Skin, spleen, adrenal glands and eyes","Thyroid, kidneys, stomach and pancreas"],"e":"Distant spread goes to lungs and pleura, liver, bones and brain.","ob":"Breast cancer spreads to lungs and pleura, liver, bones and brain."},{"g":"3-4 · Partial mastectomy","q":"Which names also describe a partial mastectomy?","c":"Lumpectomy or quadrantectomy","w":["Radical (Halsted) mastectomy","Total (simple) mastectomy","Axillary node dissection alone"],"e":"Partial mastectomy is breast-conserving, also called lumpectomy or quadrantectomy.","ob":"Partial mastectomy is breast-conserving surgery (lumpectomy or quadrantectomy)."},{"g":"3-4 · Partial mastectomy","q":"What does a partial mastectomy remove?","c":"Tumor plus a halo of normal tissue","w":["The entire breast with axillary nodes","Only the nipple and areola complex","Tumor alone with no margin of tissue"],"e":"The tumor is removed with a surrounding halo of normal breast tissue.","ob":"Partial mastectomy removes the tumor with a margin of normal tissue."},{"g":"3-4 · Partial mastectomy","q":"Why is a sentinel node biopsy done?","c":"To examine the first axillary node","w":["To remove all the parasternal nodes","To shrink the tumor before surgery","To locate the stellate mass early"],"e":"The first axillary node is the one most likely invaded by metastatic cells.","ob":"Sentinel node biopsy tests the first axillary node draining the tumor."},{"g":"3-4 · Partial mastectomy","q":"How does infiltrating carcinoma look in a breast cross section?","c":"A stellate, irregular mass","w":["A smooth rounded mobile mass","A thin-walled fluid-filled cyst","A uniform fatty nodule"],"e":"Infiltrating carcinoma appears as a stellate, irregular mass.","ob":"Infiltrating carcinoma appears as a stellate, irregular mass."},{"g":"3-4 · Partial mastectomy","q":"Which pair are 'local' approaches to breast cancer?","c":"Radiation therapy and surgery","w":["Chemotherapy and hormonal therapy","Immunotherapy and hormonal therapy","Chemotherapy and immunotherapy only"],"e":"Systemic: chemotherapy, hormonal, immunotherapy. Local: radiation and surgery.","ob":"Radiation and surgery are local therapies; chemotherapy, hormonal and immunotherapy are systemic."},{"g":"3-4 · Partial mastectomy","q":"Which incision parallels Langer's lines in the upper breast?","c":"Curvilinear incisions","w":["Radial incisions","Circumareolar incisions","Vertical midline incisions"],"e":"Curvilinear incisions follow Langer's lines in the upper half for a better aesthetic result.","ob":"Curvilinear incisions follow Langer's lines in the upper breast."},{"g":"3-4 · Partial mastectomy","q":"Where are radial incisions used?","c":"Inferior half of the breast","w":["Superior half of the breast","Over the axillary tail only","Along the inframammary crease"],"e":"Radial incisions are used in the inferior half; curvilinear ones in the upper half.","ob":"Radial incisions are used in the lower half of the breast."},{"g":"3-4 · Partial mastectomy","q":"Which eponym names the interpectoral lymph nodes?","c":"Rotter's nodes","w":["Virchow's nodes","Cloquet's nodes","Delphian nodes"],"e":"Rotter's nodes lie between pectoralis major and minor.","ob":"Rotter's nodes are the interpectoral lymph nodes."},{"g":"3-4 · Partial mastectomy","q":"Which axillary node group is also called subclavian?","c":"Apical axillary nodes","w":["Central axillary nodes","Posterior axillary nodes","Lateral axillary nodes"],"e":"Apical = subclavian, posterior = subscapular, lateral = humeral, anterior = pectoral.","ob":"Apical axillary nodes are the subclavian group."},{"g":"3-4 · Partial mastectomy","q":"How is the removed specimen handled?","c":"Oriented with a suture","w":["Sent unmarked to pathology","Frozen on the operating table","Divided into equal quarters"],"e":"A suture orients the specimen so margins can be identified.","ob":"A suture orients the specimen for margin assessment."},{"g":"3-5 · Modified radical mastectomy","q":"What does a total (simple) mastectomy remove?","c":"The whole breast, nodes if indicated","w":["The whole breast with pectoral muscles","The tumor with a halo of normal tissue","Breast tissue and chest wall muscles only"],"e":"The whole breast is removed, with axillary nodes only if indicated, down to the retromammary space.","ob":"Total mastectomy removes the whole breast, with nodes only if indicated."},{"g":"3-5 · Modified radical mastectomy","q":"Which muscles are preserved in a modified radical mastectomy?","c":"Pectoralis, serratus anterior, latissimus dorsi","w":["Pectoralis minor, rhomboid major and trapezius","Subscapularis, teres major and supraspinatus group","Deltoid, biceps brachii and coracobrachialis group"],"e":"Pectoralis, serratus anterior and latissimus dorsi are preserved, with the long thoracic and thoracodorsal nerves.","ob":"Modified radical mastectomy preserves pectoralis, serratus anterior and latissimus dorsi."},{"g":"3-5 · Modified radical mastectomy","q":"What does a radical mastectomy remove?","c":"Breast, nodes, fat and both pectoralis muscles","w":["Breast, nodes, fat and the serratus anterior","Breast, nodes, fat and the latissimus dorsi","Breast, nodes, fat but preserving both pectorals"],"e":"It takes breast, axillary nodes, fat and pectoralis major and minor.","ob":"Radical mastectomy also removes pectoralis major and minor."},{"g":"3-5 · Modified radical mastectomy","q":"What follows damage to the long thoracic nerve?","c":"Winging of the scapula","w":["Weak extension at the shoulder","Loss of sensation over the axilla","Weak elbow flexion on lifting"],"e":"The long thoracic nerve supplies serratus anterior; injury wings the scapula.","ob":"Long thoracic nerve injury wings the scapula."},{"g":"3-5 · Modified radical mastectomy","q":"Which nerve supplies the serratus anterior?","c":"Long thoracic nerve","w":["Thoracodorsal nerve","Medial pectoral nerve","Intercostobrachial nerve"],"e":"Long thoracic nerve to serratus anterior; thoracodorsal nerve to latissimus dorsi.","ob":"The long thoracic nerve supplies serratus anterior."},{"g":"3-5 · Modified radical mastectomy","q":"What follows damage to the thoracodorsal nerve?","c":"Weakened extension at the shoulder","w":["Winging of the scapula on pushing","Loss of sensation over the inner arm","Weak flexion at the elbow joint"],"e":"It supplies latissimus dorsi, so extension at the shoulder weakens.","ob":"Thoracodorsal nerve injury weakens shoulder extension."},{"g":"3-5 · Modified radical mastectomy","q":"Which muscle does the thoracodorsal nerve supply?","c":"Latissimus dorsi","w":["Serratus anterior","Pectoralis major","Teres major muscle"],"e":"The thoracodorsal nerve innervates latissimus dorsi.","ob":"The thoracodorsal nerve innervates latissimus dorsi."},{"g":"3-5 · Modified radical mastectomy","q":"How are the superior and inferior skin flaps held?","c":"Retracted perpendicular to the chest wall","w":["Folded flat against the chest wall surface","Sutured to the pectoral fascia at the edge","Retracted laterally into the axillary fossa"],"e":"Flaps are retracted perpendicular to the chest wall while breast tissue is retracted downward.","ob":"Skin flaps are raised and held perpendicular to the chest wall."},{"g":"3-5 · Modified radical mastectomy","q":"Between which muscles do Rotter's nodes lie?","c":"Pectoralis major and minor","w":["Serratus anterior and latissimus","Pectoralis minor and serratus anterior","Latissimus dorsi and subscapularis"],"e":"Rotter's (interpectoral) nodes lie between the two pectoral muscles.","ob":"Rotter's nodes lie between pectoralis major and minor."},{"g":"3-5 · Modified radical mastectomy","q":"Which approach is much less common now?","c":"Radical mastectomy","w":["Total (simple) mastectomy","Partial mastectomy (lumpectomy)","Modified radical mastectomy"],"e":"Radical mastectomy is far less used now than the modified approach.","ob":"Radical mastectomy has largely been replaced by modified approaches."},{"g":"3-6 · Chest tube thoracostomy","q":"How is the patient positioned for chest tube insertion?","c":"Supine, arm abducted, hand above head","w":["Seated upright, arm resting at the side","Lateral decubitus, arm adducted at the side","Prone, arm abducted beside the head"],"e":"Supine, arm abducted, elbow flexed, hand over the head.","ob":"Position supine with the arm abducted and the hand over the head."},{"g":"3-6 · Chest tube thoracostomy","q":"Where is the tube inserted?","c":"4th–5th space, anterior axillary line","w":["2nd–3rd space, midclavicular line","6th–7th space, posterior axillary line","8th–9th space, midscapular line"],"e":"The 4th–5th intercostal spaces in the anterior axillary line, at nipple level.","ob":"Insert in the 4th–5th intercostal space, anterior axillary line."},{"g":"3-6 · Chest tube thoracostomy","q":"Which imaging tool helps locate the intercostal spaces?","c":"Ultrasonography","w":["Barium swallow study","Lumbar myelography","Bone scintigraphy"],"e":"Ultrasonography is used to locate the 4th and 5th intercostal spaces.","ob":"Ultrasonography helps locate the correct intercostal space."},{"g":"3-6 · Chest tube thoracostomy","q":"Which rib is identified for periosteal anesthesia?","c":"The rib just below the space","w":["The rib just above the space","The nearest floating rib margin","Both ribs bordering the space"],"e":"The rib inferior to the chosen space is identified and its periosteum anesthetized.","ob":"Anesthetize the periosteum of the rib below the chosen space."},{"g":"3-6 · Chest tube thoracostomy","q":"What confirms entry into the pleural space?","c":"Flash of fluid or air in the syringe","w":["Return of bright red arterial blood only","A sudden pop felt at the skin surface","Loss of all resistance at the skin edge"],"e":"A flash of pleural fluid or air in the syringe confirms entry.","ob":"A flash of pleural fluid or air confirms pleural entry."},{"g":"3-6 · Chest tube thoracostomy","q":"What is the skin incision like?","c":"1–2 cm, parallel to the rib","w":["5–6 cm, perpendicular to the rib","1–2 cm, perpendicular to the rib","3–4 cm, across two adjacent ribs"],"e":"A 1- to 2-cm incision is made parallel to the rib.","ob":"Make a 1–2 cm incision parallel to the rib."},{"g":"3-6 · Chest tube thoracostomy","q":"Why is a finger rotated 360° in the pleural space?","c":"To feel for pleural adhesions","w":["To break the visceral pleura open","To find the intercostal artery path","To stretch the diaphragm downward"],"e":"The finger sweep checks for adhesions before the tube is placed.","ob":"A finger sweep checks for adhesions before tube placement."},{"g":"3-6 · Chest tube thoracostomy","q":"Which part of the tube is grabbed with the Kelly clamp?","c":"The fenestrated portion","w":["The proximal connector end","The sealed stylet handle","The drainage device hub"],"e":"The fenestrated portion is grabbed and introduced through the insertion site.","ob":"The fenestrated end of the tube is the part introduced into the chest."},{"g":"3-6 · Chest tube thoracostomy","q":"What is wrapped around the tube at the site?","c":"Petroleum-based gauze","w":["Dry sterile cotton packing","Silver-impregnated foam dressing","Iodine-soaked adhesive film"],"e":"Petroleum-based gauze goes around the tube, covered by regular gauze and tape.","ob":"Petroleum-based gauze seals the tube site."},{"g":"3-6 · Chest tube thoracostomy","q":"How is correct tube placement confirmed?","c":"Chest radiograph","w":["Pulse oximetry only","Bronchoscopy","Echocardiography"],"e":"A chest radiograph confirms proper placement after connecting the drainage device.","ob":"Chest radiography confirms chest tube position."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"How is idiopathic pulmonary fibrosis classified?","c":"Chronic restrictive lung disease","w":["Chronic obstructive lung disease","Acute infectious pneumonia","Vascular lung disease with emboli"],"e":"IPF is a chronic restrictive disease with reduced compliance.","ob":"IPF is a chronic restrictive lung disease."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"IPF mainly affects people of what age?","c":"Over 50 years of age","w":["Under 20 years of age","20 to 30 years of age","30 to 40 years of age"],"e":"IPF mainly affects people over 50.","ob":"IPF mainly affects people over 50."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which is a major risk factor for IPF?","c":"Cigarette smoking","w":["Chronic alcohol intake","High dietary salt intake","Recurrent urinary infections"],"e":"Cigarette smoking is a major risk factor.","ob":"Cigarette smoking is a major risk factor for IPF."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Chronic restrictive diseases make up what share of noninfectious lung disease?","c":"About 15%","w":["About 5%","About 40%","Nearly 65%"],"e":"They account for about 15% of noninfectious lung diseases.","ob":"Chronic restrictive diseases are about 15% of noninfectious lung disease."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Why does a fibrotic lung need more pressure to inflate?","c":"It is stiffened and less compliant","w":["Its airways collapse during expiration","Its alveolar walls are destroyed","Mucus plugs obstruct the bronchi"],"e":"Fibrosis stiffens the lung, lowering compliance.","ob":"Fibrosis stiffens the lung, so inflation needs more pressure."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which auscultation finding is typical of IPF?","c":"Basilar inspiratory (Velcro) crackles","w":["Bilateral expiratory wheezes at the apices","Biphasic stridor over the trachea","Pleural friction rub over the apices"],"e":"Basilar inspiratory 'Velcro' crackles are classic.","ob":"Basilar inspiratory Velcro crackles are the classic IPF sign."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which finger change is seen in IPF?","c":"Clubbing of the fingers","w":["Splinter hemorrhages of nails","Raynaud pallor of fingertips","Spooning of the nails"],"e":"Clubbing accompanies dyspnea, cyanosis and weight loss.","ob":"Clubbing, cyanosis and dyspnea accompany IPF."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"What kind of cough is typical?","c":"Nonproductive hacking cough","w":["Productive cough with purulent sputum","Barking cough with stridor","Paroxysmal whooping cough"],"e":"The cough is nonproductive and hacking.","ob":"IPF causes a nonproductive hacking cough."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"How does the gross lung specimen look?","c":"Multiple small cysts, honeycomb pattern","w":["Single large apical cavity with fluid level","Hilar mass projecting into a bronchus","Barrel-shaped hyperinflated upper lobes"],"e":"Diffuse bilateral fibrosis with small cysts gives a honeycomb appearance.","ob":"The fibrotic lung has small cysts in a honeycomb pattern."},{"g":"3-7 · Idiopathic pulmonary fibrosis","q":"Which late complication occurs?","c":"Cor pulmonale","w":["Left atrial myxoma","Aortic coarctation","Pericardial effusion"],"e":"Late disease can cause cor pulmonale.","ob":"Cor pulmonale is a late complication of IPF."},{"g":"3-8 · Pulmonary embolism","q":"PE causes death in what share of hospitalized patients?","c":"About 10–15%","w":["About 30–40%","About 50–60%","Roughly 2 to 3%"],"e":"PE causes death in 10–15% of hospitalized patients.","ob":"PE causes death in 10–15% of hospitalized patients."},{"g":"3-8 · Pulmonary embolism","q":"Where do about 90% of thromboemboli originate?","c":"Deep veins of the legs","w":["Pelvic venous plexus","Superficial veins of the arm","Right side of the heart"],"e":"About 90% come from deep leg veins.","ob":"Most pulmonary emboli come from deep leg veins."},{"g":"3-8 · Pulmonary embolism","q":"Which trio makes up Virchow's triad?","c":"Stasis, vessel trauma, hypercoagulability","w":["Stasis, infection, hypocoagulability","Hypertension, trauma, hypocoagulability","Hypertension, vessel trauma, hypercoagulability"],"e":"Virchow's triad: venous stasis, trauma and coagulation disorders.","ob":"Virchow's triad is stasis, vessel injury and hypercoagulability."},{"g":"3-8 · Pulmonary embolism","q":"Which situation raises PE risk?","c":"Postoperative immobility","w":["Regular aerobic exercise training","High daily fluid intake","Long-term vitamin supplements"],"e":"Postoperative and postpartum immobility, and some hormone medications, raise risk.","ob":"Immobility after surgery or childbirth raises PE risk."},{"g":"3-8 · Pulmonary embolism","q":"Why are most PEs 'silent'?","c":"Most emboli are small and filtered","w":["Most emboli lodge in the bronchial tree","Clots dissolve before leaving the leg veins","Pulmonary vessels have no sensory innervation"],"e":"Most emboli are small, so the lungs filter them silently.","ob":"Most PEs are small and clinically silent."},{"g":"3-8 · Pulmonary embolism","q":"Where does a saddle embolus lodge?","c":"Bifurcation of the pulmonary trunk","w":["Origin of the aorta above the valve","Bifurcation of the trachea at the carina","Junction of the venae cavae at the atrium"],"e":"A saddle embolus can block the pulmonary trunk and both arteries.","ob":"A saddle embolus sits astride the pulmonary trunk bifurcation."},{"g":"3-8 · Pulmonary embolism","q":"What can a saddle embolus precipitate?","c":"Acute cor pulmonale and collapse","w":["Chronic left heart failure with edema","Isolated pleural effusion without shock","Pulmonary infarction without any change"],"e":"It is an emergency causing acute right heart failure and circulatory collapse.","ob":"Saddle embolus can cause acute cor pulmonale and collapse."},{"g":"3-8 · Pulmonary embolism","q":"What is the cardinal clue to PE?","c":"Sudden dyspnea and tachycardia","w":["Gradual weight loss with night sweats","Hacking cough with basilar crackles","Fever, productive cough and consolidation"],"e":"Sudden dyspnea and tachycardia in a predisposed person is the cardinal clue.","ob":"Sudden dyspnea and tachycardia in a predisposed person suggest PE."},{"g":"3-8 · Pulmonary embolism","q":"What may auscultation show in PE?","c":"Normal, or few rales with diminished sounds","w":["Loud bilateral expiratory wheezing throughout","Diffuse inspiratory Velcro crackles at the bases","Bronchial breathing over a whole lobe"],"e":"Lung sounds may be normal, or show few rales and diminished breath sounds.","ob":"Lung sounds in PE may be normal or only mildly abnormal."},{"g":"3-8 · Pulmonary embolism","q":"Which veins are the most common emboli sources?","c":"Femoral and popliteal veins","w":["Great and small saphenous veins","Gonadal and uterine veins","Right atrium and ventricle"],"e":"Femoral, popliteal, external iliac and calf veins are most common; saphenous and pelvic less so.","ob":"Femoral and popliteal veins are leading embolic sources."},{"g":"3-9 · Lung cancer","q":"Lung cancer is the leading cause of what?","c":"Cancer deaths worldwide","w":["New breast cancer diagnoses","Deaths from infectious disease","Surgical complications in smokers"],"e":"It is the leading cause of cancer-related deaths worldwide.","ob":"Lung cancer is the leading cause of cancer death worldwide."},{"g":"3-9 · Lung cancer","q":"Smoking causes what share of lung cancers?","c":"About 85–90%","w":["About 30–40%","About 50–60%","Approximately 65–70%"],"e":"Cigarette smoking causes about 85–90% of cases.","ob":"Smoking causes the large majority of lung cancers."},{"g":"3-9 · Lung cancer","q":"Which is the most common lung cancer type in the US?","c":"Adenocarcinoma","w":["Squamous carcinoma","Bronchial carcinoid","Pleural mesothelioma"],"e":"Adenocarcinoma (about 37%) is the most common US type.","ob":"Adenocarcinoma is the most common US lung cancer."},{"g":"3-9 · Lung cancer","q":"What share of US lung cancers are squamous cell?","c":"About 20%","w":["About 5%","About 37%","Nearly 60%"],"e":"Squamous cell carcinoma is about 20% of US lung cancers.","ob":"Squamous cell carcinoma makes up about 20% of US lung cancers."},{"g":"3-9 · Lung cancer","q":"Where does squamous cell carcinoma typically sit?","c":"Near the hilum, projecting into bronchi","w":["At the apex, invading the brachial plexus","At the periphery, sparing the bronchi","Along the pleural surface diffusely"],"e":"The tumor is typically near the hilum, projecting into bronchi.","ob":"Squamous cell carcinoma arises centrally near the hilum."},{"g":"3-9 · Lung cancer","q":"Where is a Pancoast tumor located?","c":"Apex of the lung","w":["Costophrenic angle","Base of the lung","Right middle lobe hilum"],"e":"A Pancoast tumor is an apical bronchogenic carcinoma.","ob":"Pancoast tumors arise at the lung apex."},{"g":"3-9 · Lung cancer","q":"Which brachial plexus levels are compromised?","c":"C8, T1 and T2","w":["C5, C6 and C7","C3, C4 and C5","C5, C6, C7 and C8"],"e":"The lower brachial plexus (C8, T1, T2) is compromised.","ob":"Pancoast tumors involve the lower brachial plexus (C8–T2)."},{"g":"3-9 · Lung cancer","q":"Which findings make up Horner's syndrome?","c":"Miosis, ptosis, anhidrosis","w":["Mydriasis, ptosis, hyperhidrosis","Miosis, lid retraction, sweating","Mydriasis, proptosis, anhidrosis"],"e":"Miosis, ptosis, anhidrosis and flushing on the affected side.","ob":"Horner's syndrome: miosis, ptosis, anhidrosis, flushing."},{"g":"3-9 · Lung cancer","q":"What causes Horner's syndrome in a Pancoast tumor?","c":"Sympathetic trunk involvement","w":["Compression of the oculomotor nerve","Facial nerve branch injury","Optic nerve stretching injury"],"e":"Spread to the sympathetic trunk compromises sympathetic tone to the head.","ob":"Sympathetic trunk involvement causes Horner's syndrome in Pancoast tumors."},{"g":"3-9 · Lung cancer","q":"Involvement of brachial plexus trunks causes what?","c":"Arm pain, paresthesia, paresis","w":["Facial droop with loss of taste","Hoarseness with weak cough reflex","Diaphragm paralysis with hiccups"],"e":"Neurovascular involvement causes pain and paresthesia of neck, shoulder and limb, and arm paresis.","ob":"Brachial plexus involvement causes arm pain, paresthesia and paresis."},{"g":"3-10 · COPD","q":"Which diseases are grouped under COPD?","c":"Chronic bronchitis, asthma and emphysema","w":["Chronic bronchitis, bronchiectasis and fibrosis","Pneumonia, asthma and sarcoidosis","Emphysema, fibrosis and pleural effusion"],"e":"COPD covers chronic bronchitis, asthma and emphysema.","ob":"COPD includes chronic bronchitis, asthma and emphysema."},{"g":"3-10 · COPD","q":"How is emphysema defined?","c":"Permanent enlargement of distal air spaces","w":["Fibrotic stiffening of the alveolar septa","Reversible narrowing of the bronchi with mucus plugs","Mucus gland hypertrophy in large bronchi"],"e":"Permanent enlargement of air spaces at and beyond the respiratory bronchioles, with wall destruction.","ob":"Emphysema is permanent distal air space enlargement with wall destruction."},{"g":"3-10 · COPD","q":"How does emphysema change lung compliance?","c":"Compliance rises as recoil falls","w":["Compliance falls as recoil rises","Compliance falls from alveolar fibrosis","Compliance stays normal; resistance rises"],"e":"Lost elastic recoil raises compliance.","ob":"Emphysema raises compliance because elastic recoil is lost."},{"g":"3-10 · COPD","q":"Why do airways collapse during expiration in emphysema?","c":"Loss of elastic recoil","w":["Excess surfactant production","Thickened alveolar septa","Spasm of the diaphragm"],"e":"Without recoil, the diseased airways collapse on expiration, increasing the work of breathing.","ob":"Lost recoil lets airways collapse on expiration."},{"g":"3-10 · COPD","q":"What causes the barrel-chested appearance?","c":"Intercostal muscle hypertrophy","w":["Pleural thickening over both apices","Air trapped in the pleural cavity","Fibrosis of the chest wall tissues"],"e":"Forcing air out hypertrophies the intercostal muscles.","ob":"Intercostal muscle hypertrophy produces a barrel chest."},{"g":"3-10 · COPD","q":"Which presentation fits a typical COPD patient?","c":"Chronic cough and sputum production","w":["Dry cough with Velcro crackles","Sudden pleuritic pain with hemoptysis","Stridor with a barking cough"],"e":"Typical patients have chronic cough, sputum, accessory muscle use and pursed-lip breathing.","ob":"COPD patients have chronic cough, sputum and pursed-lip breathing."},{"g":"3-10 · COPD","q":"What do arterial blood gases show in COPD?","c":"Decreased PO2 and increased PCO2","w":["Increased PO2 and decreased PCO2","Increased PO2 with increased PCO2","Decreased PO2 with decreased PCO2"],"e":"Variable decreases in PO2 and increases in PCO2.","ob":"COPD lowers PO2 and raises PCO2."},{"g":"3-10 · COPD","q":"What do pulmonary function tests show?","c":"Airflow limitation with hyperinflation","w":["Restricted volumes with raised compliance","Normal flows with reduced lung volumes","Raised diffusing capacity with high flows"],"e":"Airflow limitation, hyperinflation and reduced diffusing capacity.","ob":"COPD shows airflow limitation, hyperinflation and low diffusing capacity."},{"g":"3-10 · COPD","q":"Which is a major risk factor for COPD?","c":"Cigarette smoking","w":["Chronic alcohol use","High-salt diet intake","Recurrent sinus infections"],"e":"Smoking is a major risk factor.","ob":"Smoking is the major COPD risk factor."},{"g":"3-10 · COPD","q":"Where is involvement most marked in the gross lung?","c":"Most marked in the upper lung","w":["Most marked at the lung bases","Confined to the hilar region only","Limited to the pleural surface"],"e":"Involvement tends to be most marked in the upper part of the lung.","ob":"Emphysematous damage is worst in the upper lung."},{"g":"3-11 · Cardiac tamponade","q":"What is cardiac tamponade?","c":"Fluid or blood in the pericardial sac","w":["Fluid or blood in the pleural cavity","Blood clotting inside the right ventricle","Air trapped between lung and chest wall"],"e":"Fluid or blood accumulates in the pericardial sac, compressing the heart.","ob":"Tamponade is fluid or blood in the pericardial sac."},{"g":"3-11 · Cardiac tamponade","q":"What is the most common cause of tamponade?","c":"Penetrating injury","w":["Ruptured aortic aneurysm","Ruptured myocardial infarct","Pericardial infection"],"e":"Penetrating injury is the most common cause.","ob":"Penetrating injury is the most common cause of tamponade."},{"g":"3-11 · Cardiac tamponade","q":"Which condition can also cause tamponade?","c":"Ruptured aortic aneurysm","w":["Ruptured esophageal varices","Ruptured pulmonary abscess","Torn great saphenous vein"],"e":"Ruptured aortic aneurysm or myocardial infarct can bleed into the pericardium.","ob":"Aortic aneurysm rupture and ruptured infarct can also cause tamponade."},{"g":"3-11 · Cardiac tamponade","q":"What does tamponade do to hemodynamics?","c":"Reduces venous return and cardiac output","w":["Increases preload with raised cardiac output","Lowers afterload with raised stroke volume","Raises venous return and lowers heart rate"],"e":"It compromises the beating heart, decreasing venous return and cardiac output.","ob":"Tamponade lowers venous return and cardiac output."},{"g":"3-11 · Cardiac tamponade","q":"How can the pericardial fluid be removed?","c":"Pericardial tap","w":["Needle thoracentesis","Lumbar puncture","Paracentesis"],"e":"A pericardial tap withdraws the fluid by needle and syringe.","ob":"A pericardial tap removes the fluid."},{"g":"3-11 · Cardiac tamponade","q":"Where is the pericardial tap performed?","c":"Larrey's point","w":["Erb's point","McBurney's point","Kocher's point"],"e":"Larrey's point is the site, diagnostic and decompressive.","ob":"The pericardial tap is done at Larrey's point."},{"g":"3-11 · Cardiac tamponade","q":"What happens to the neck veins?","c":"They become distended","w":["They collapse completely","They stay completely normal","They pulse only on inspiration"],"e":"Distended neck veins reflect elevated venous pressure.","ob":"Distended neck veins accompany tamponade."},{"g":"3-11 · Cardiac tamponade","q":"How are the heart sounds described?","c":"Distant or muffled","w":["Loud with a murmur","Widely split with a click","Normal with a third sound"],"e":"Heart sounds are distant.","ob":"Heart sounds are distant in tamponade."},{"g":"3-11 · Cardiac tamponade","q":"Which finding is pathognomonic?","c":"Elevated venous pressure","w":["Decreased pulse pressure","Decreased arterial pressure","Variable degrees of shock"],"e":"Elevated venous pressure is pathognomonic; low arterial and pulse pressures are not.","ob":"Elevated venous pressure is pathognomonic for tamponade."},{"g":"3-11 · Cardiac tamponade","q":"What is the pericardial tap used for?","c":"Diagnosis and decompression","w":["Diagnosis only, never for relief","Decompression only, not diagnosis","Staging of aortic aneurysms"],"e":"It is both diagnostic and decompressive.","ob":"A pericardial tap is both diagnostic and decompressive."}]},headneck:{name:'Head and Neck Clinical Focuses',D:[{"g":"8-1 · Skull fractures","q":"Which description fits a linear skull fracture?","c":"A distinct fracture line","w":["Multiple bone fragments","A break along a suture","A break in the skull base"],"e":"A linear fracture shows a single distinct fracture line. Multiple fragments describe a comminuted fracture."},{"g":"8-1 · Skull fractures","q":"What defines a comminuted skull fracture?","c":"Multiple bone fragments","w":["One clean fracture line","Separation of a suture","A break limited to the base"],"e":"Comminuted fractures present with multiple fragments, and may be depressed if driven inward."},{"g":"8-1 · Skull fractures","q":"What is the danger of a depressed comminuted fracture?","c":"It can compress or tear the dura","w":["It always causes a CSF leak","It only injures the scalp","It heals without any treatment"],"e":"Fragments driven inward can compress or tear the underlying dura mater."},{"g":"8-1 · Skull fractures","q":"What is a diastasis fracture?","c":"A fracture along a suture line","w":["A fracture through the scalp","A fracture of the skull base","A fracture with many fragments"],"e":"Diastasis is a fracture along a suture line."},{"g":"8-1 · Skull fractures","q":"What is a basilar skull fracture?","c":"A fracture of the skull base","w":["A fracture along a suture","A fracture of the frontal bone","A fracture of the zygomatic arch"],"e":"Basilar fractures involve the base of the skull."},{"g":"8-1 · Skull fractures","q":"Which feature makes a skull fracture compound?","c":"It communicates with the outside","w":["It has several bone fragments","It lies along a suture line","It is limited to the skull base"],"e":"Any fracture communicating with a lacerated scalp, paranasal sinus or middle ear is compound."},{"g":"8-1 · Skull fractures","q":"Which communication makes a fracture compound?","c":"A paranasal sinus","w":["The subdural space","The temporalis muscle","The orbital fat pad"],"e":"Communication with a paranasal sinus, the middle ear or a scalp laceration makes it compound."},{"g":"8-1 · Skull fractures","q":"How must compound depressed fractures be treated?","c":"Surgically","w":["By observation only","With bed rest alone","With antibiotics alone"],"e":"Compound depressed fractures must be treated surgically."},{"g":"8-1 · Skull fractures","q":"Which fracture is a compound fracture?","c":"A basilar fracture into the middle ear","w":["A linear fracture under intact scalp","A suture diastasis with intact skin","A closed comminuted fracture"],"e":"A basilar fracture entering the middle ear communicates with the outside, so it is compound."},{"g":"8-1 · Skull fractures","q":"Which finding is shown in a compound depressed fracture?","c":"Hair impacted into the wound","w":["Blood in the anterior chamber","A flattened cheekbone","Subconjunctival hemorrhage"],"e":"The illustration notes hair impacted into the wound."},{"g":"8-2 · Zygomatic fractures","q":"Which bone is the cheekbone?","c":"Zygomatic bone","w":["Maxillary bone","Temporal bone","Sphenoid bone"],"e":"Trauma to the zygomatic bone disrupts the zygomatic complex."},{"g":"8-2 · Zygomatic fractures","q":"Which sutures are often involved in zygomatic fractures?","c":"Frontal and maxillary","w":["Parietal and occipital","Nasal and lacrimal","Mandibular and hyoid"],"e":"Fractures often involve the suture lines with the frontal and maxillary bones."},{"g":"8-2 · Zygomatic fractures","q":"In which directions is the bone displaced?","c":"Inferiorly, medially, posteriorly","w":["Superiorly, laterally, anteriorly","Only laterally","Only anteriorly"],"e":"Displacement is inferior, medial and posterior."},{"g":"8-2 · Zygomatic fractures","q":"Which gaze is associated with the diplopia?","c":"Upper outer gaze","w":["Lower inner gaze","Straight ahead only","Downward gaze only"],"e":"Diplopia is described as occurring in the upper outer gaze."},{"g":"8-2 · Zygomatic fractures","q":"What is hyphema?","c":"Blood in the anterior chamber","w":["Blood under the conjunctiva","Blood in the vitreous","Blood in the orbit fat"],"e":"It requires immediate clinical attention."},{"g":"8-2 · Zygomatic fractures","q":"What happens to the palpebral fissure?","c":"Lateral portion is lowered","w":["Lateral portion is raised","Fissure is fully closed","Fissure is unaffected"],"e":"The lateral canthal ligament is pulled downward with the bone."},{"g":"8-2 · Zygomatic fractures","q":"What is the cheek contour after the injury?","c":"Flattened","w":["Prominent","Swollen only","Normal"],"e":"A flattened cheekbone is part of the typical presentation."},{"g":"8-2 · Zygomatic fractures","q":"What happens to the lateral canthal ligament?","c":"Displaced downward","w":["Displaced upward","Torn off the orbit","Unchanged"],"e":"It is displaced downward with the dislocated zygomatic bone."},{"g":"8-2 · Zygomatic fractures","q":"Which is not listed as an articulation of the zygomatic bone?","c":"Mandible","w":["Frontal bone","Temporal bone","Palatine bone"],"e":"Listed: frontal, maxillary, temporal, sphenoid and palatine bones."},{"g":"8-2 · Zygomatic fractures","q":"Which sign is illustrated with a zygomatic fracture?","c":"Subconjunctival hemorrhage","w":["Papilledema","Miosis","Ptosis"],"e":"The figure shows ecchymosis and subconjunctival hemorrhage."},{"g":"8-3 · Midface fractures","q":"Who classified midface fractures?","c":"Le Fort","w":["Colles","Pott","Monteggia"],"e":"Midface fractures are classified by Le Fort."},{"g":"8-3 · Midface fractures","q":"What is a Le Fort I fracture?","c":"Horizontal maxillary detachment","w":["Pyramidal midface fracture","Fracture through the zygomata","Fracture of the cranial vault"],"e":"Le Fort I detaches the maxilla horizontally at the level of the nasal floor."},{"g":"8-3 · Midface fractures","q":"What is the shape of a Le Fort II fracture?","c":"Pyramidal","w":["Horizontal","Vertical","Circular"],"e":"Le Fort II is a pyramidal fracture."},{"g":"8-3 · Midface fractures","q":"Which bones does Le Fort II include?","c":"Both maxillae and nasal bones","w":["Both zygomatic arches only","The mandible and hyoid","The frontal bone only"],"e":"It includes both maxillae and the nasal bones."},{"g":"8-3 · Midface fractures","q":"Which structures does Le Fort II also include?","c":"Infraorbital rims and orbital floors","w":["Zygomatic arches and mandible","Sphenoid wings and clivus","Temporal bone and mastoid"],"e":"It includes the infraorbital rims, orbits and orbital floors."},{"g":"8-3 · Midface fractures","q":"What does Le Fort III add to Le Fort II?","c":"Fracture of both zygomatic bones","w":["Fracture of the mandible","Fracture of the nasal septum only","Fracture of the hyoid"],"e":"Le Fort III includes Le Fort II plus both zygomatic bones."},{"g":"8-3 · Midface fractures","q":"Which are complications of Le Fort III?","c":"Airway problems and CSF leakage","w":["Hearing loss and vertigo","Dysphagia and hoarseness","Ptosis and miosis"],"e":"Also nasolacrimal apparatus obstruction."},{"g":"8-3 · Midface fractures","q":"Which fracture separates facial bones from the cranial vault?","c":"Le Fort III","w":["Le Fort I","Le Fort II","Zygomatic fracture"],"e":"Le Fort III separates the facial bones from the cranial vault."},{"g":"8-3 · Midface fractures","q":"Which bones does the midface classification cover?","c":"Maxilla, nasoorbital complex, zygomatic","w":["Mandible, hyoid, vomer","Parietal, occipital, temporal","Sphenoid, ethmoid, atlas"],"e":"Midface fractures involve the maxilla, nasoorbital complex and zygomatic bones."},{"g":"8-3 · Midface fractures","q":"Which finding is not part of Le Fort II?","c":"Fracture through both zygomatic bones","w":["Fracture of both maxillae","Fracture of nasal bones","Fracture of infraorbital rims"],"e":"Zygomatic fractures are the added feature of Le Fort III."},{"g":"8-4 · Hydrocephalus","q":"What is hydrocephalus?","c":"Excess CSF within the ventricles","w":["Excess blood in the ventricles","Loss of brain tissue","Swelling of the scalp"],"e":"It is the accumulation of excess CSF in the ventricular system."},{"g":"8-4 · Hydrocephalus","q":"Which can cause hydrocephalus?","c":"Blockage of CSF passageways","w":["Excess production of bile","Loss of CSF production","Increased CSF absorption"],"e":"Causes: overproduction, decreased absorption or blockage of CSF flow."},{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Monro?","c":"Interventricular foramen","w":["Cerebral aqueduct","Lateral aperture","Median aperture"],"e":"The interventricular foramina are the foramina of Monro."},{"g":"8-4 · Hydrocephalus","q":"What is the aqueduct of Sylvius?","c":"Cerebral aqueduct","w":["Interventricular foramen","Lateral aperture","Median aperture"],"e":"The cerebral aqueduct is the aqueduct of Sylvius."},{"g":"8-4 · Hydrocephalus","q":"What are the foramina of Luschka?","c":"Lateral apertures","w":["Median aperture","Interventricular foramina","Cerebral aqueduct"],"e":"The lateral apertures are the foramina of Luschka."},{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Magendie?","c":"Median aperture","w":["Lateral apertures","Interventricular foramina","Cerebral aqueduct"],"e":"The median aperture is the foramen of Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which ventricles are dilated in the section shown?","c":"Lateral and third","w":["Fourth only","Third only","None"],"e":"The section shows marked dilatation of the lateral and third ventricles."},{"g":"8-4 · Hydrocephalus","q":"Which is not a listed obstruction site?","c":"Foramen magnum","w":["Interventricular foramina","Cerebral aqueduct","Median aperture"],"e":"Listed: Monro, Sylvius, Luschka, Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which structures drain the 4th ventricle into the subarachnoid space? (beyond the page)","c":"Lateral and median apertures","w":["Interventricular foramina","Cerebral aqueduct","Central canal"],"e":"Standard knowledge: the apertures of Luschka and Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which foramina link the lateral and third ventricles? (beyond the page)","c":"Interventricular foramina","w":["Cerebral aqueduct","Median aperture","Lateral apertures"],"e":"Standard knowledge: the foramina of Monro."},{"g":"8-5 · Meningitis","q":"What is meningitis?","c":"Inflammation of arachnoid and pia","w":["Inflammation of the dura only","Inflammation of the brain tissue","Inflammation of the scalp"],"e":"It is inflammation of the arachnoid mater and pia mater."},{"g":"8-5 · Meningitis","q":"Which are aseptic causes?","c":"Viral infections and drug reactions","w":["Bacterial abscess only","Fungal sinusitis only","Parasitic cysts only"],"e":"Aseptic causes include viral infections, drug reactions and systemic diseases."},{"g":"8-5 · Meningitis","q":"Which symptom is listed for meningitis?","c":"Painful stiff neck","w":["Hearing loss","Ptosis","Hoarseness"],"e":"Headache, fever, seizures and a painful stiff neck."},{"g":"8-5 · Meningitis","q":"How is the diagnosis made?","c":"Lumbar puncture and CSF exam","w":["Skull radiograph alone","Blood culture alone","Otoscopic exam"],"e":"Diagnosis is by lumbar puncture and CSF examination."},{"g":"8-5 · Meningitis","q":"How does bacterial infection usually reach the leptomeninges?","c":"Hematogenous spread","w":["Direct nerve spread","Lymphatic spread","Swallowed organisms"],"e":"Usually hematogenous, but it may be direct."},{"g":"8-5 · Meningitis","q":"Which sites may spread infection directly?","c":"Sinuses, middle ear, mastoid cells","w":["Kidneys and bladder","Liver and gallbladder","Knee and hip joints"],"e":"Direct spread from paranasal sinuses, middle ear and mastoid cells."},{"g":"8-5 · Meningitis","q":"What can a cribriform plate defect cause?","c":"CSF leak and infection route","w":["Optic nerve damage only","Hearing loss only","Dry nasal mucosa"],"e":"A cribriform defect lets CSF leak and gives infection a route."},{"g":"8-5 · Meningitis","q":"Which injury can be a source of meningitis?","c":"Basal skull fracture","w":["Wrist fracture","Rib fracture","Tibial fracture"],"e":"A basal skull fracture can open a path for infection."},{"g":"8-5 · Meningitis","q":"Which is a listed source of infection?","c":"Mastoiditis","w":["Pyelonephritis","Cholecystitis","Appendicitis"],"e":"Listed sources include otitis media, sinusitis, mastoiditis, nasopharyngitis, pneumonia."},{"g":"8-5 · Meningitis","q":"Which is not a listed symptom?","c":"Hearing loss","w":["Headache","Fever","Seizures"],"e":"Listed: headache, fever, seizures and a painful stiff neck."},{"g":"8-16 · Trigeminal neuralgia","q":"What is the pain character in trigeminal neuralgia?","c":"Brief, lancinating, burning","w":["Dull, constant ache","Throbbing with visual aura","Pain only at night"],"e":"Recurrent, lancinating, burning pain in short intense episodes.","d":"Trigeminal neuralgia presents with recurrent, brief, lancinating or burning paroxysms of intense unilateral facial pain. The patient winces, which produces the facial tic that gives tic douloureux its name. A constant dull ache, migraine-type throbbing with aura, and pain only at night describe other headache or facial pain syndromes.##Brief electric-shock facial pain in the V2/V3 territory is trigeminal neuralgia."},{"g":"8-16 · Trigeminal neuralgia","q":"Which divisions does it usually affect?","c":"V2 or V3, unilaterally","w":["V1 only","All three, bilaterally","The motor root of V"],"e":"Usually V2 or V3 on one side.","d":"Pain follows the sensory territory of CN V, most often V2 (maxillary) or V3 (mandibular) on one side. V1 is involved in fewer than 6% of cases. Pain in all three divisions bilaterally is atypical, and the motor root of V carries no pain fibers.##Usually unilateral V2 or V3; V1 is rare (under 6%)."},{"g":"8-16 · Trigeminal neuralgia","q":"What fraction of cases involve V1?","c":"Less than 6%","w":["About 25%","About 50%","Over 75%"],"e":"V1 is involved in fewer than 6%.","d":"Only about 6% of cases involve the ophthalmic division (V1); the large majority affect V2 or V3. Figures of 25%, 50% or over 75% would greatly overstate V1 involvement.##V1 involvement is under 6%."},{"g":"8-16 · Trigeminal neuralgia","q":"Typical age at presentation?","c":"Older than 50","w":["Under 10","20 to 30","Neonatal"],"e":"Usually people older than 50.","d":"Trigeminal neuralgia usually begins after age 50, when vascular compression of the nerve becomes more likely. It is uncommon in children, young adults and neonates, in whom other causes of facial pain should be sought.##The typical patient is older than 50."},{"g":"8-16 · Trigeminal neuralgia","q":"Why does the patient develop a facial tic?","c":"Wincing from the intense pain","w":["Motor nucleus lesion","Facial nerve irritation","Focal seizure"],"e":"The pain makes the patient wince, producing a facial muscle tic.","d":"The tic is a reflex wince from the severe pain, not a motor lesion. A motor nucleus lesion, facial nerve irritation (as in hemifacial spasm) and focal seizures are not the mechanism.##Wincing from pain produces the facial muscle tic."},{"g":"8-16 · Trigeminal neuralgia","q":"Proposed etiology?","c":"Vascular compression of the trigeminal ganglion","w":["VZV reactivation","Orbital floor fracture","Geniculate ganglion infection"],"e":"Etiology is uncertain, but vascular compression is suspected.","d":"The favored mechanism is vascular compression of the trigeminal sensory ganglion or root by the superior cerebellar artery, although the cause is officially uncertain. VZV reactivation causes herpes zoster, orbital floor fracture causes a blow-out injury, and geniculate ganglion infection involves CN VII.##Suspect vascular compression by the superior cerebellar artery."},{"g":"8-16 · Trigeminal neuralgia","q":"Which are the classic triggers?","c":"Touch and a draft of cool air","w":["Bright light","Loud noise","Lying flat"],"e":"Trigger points on the face respond to touch and cool air.","d":"Attacks are triggered by light touch (shaving, brushing teeth, washing) and by a draft of cool air at trigger points on the face. Bright light, loud noise and lying flat do not trigger attacks.##Touch and cool air trigger the pain."},{"g":"8-16 · Trigeminal neuralgia","q":"Which artery is implicated?","c":"Superior cerebellar","w":["Anterior cerebral","Middle meningeal","Facial"],"e":"The superior cerebellar artery compresses the sensory ganglion.","d":"The superior cerebellar artery is the vessel most often found compressing the trigeminal root or ganglion. The anterior cerebral, middle meningeal and facial arteries do not lie against the trigeminal ganglion.##Superior cerebellar artery compression."},{"g":"8-16 · Trigeminal neuralgia","q":"Which zone-to-division pairing is correct?","c":"Maxillary zone = V2","w":["Ophthalmic zone = V3","Mandibular zone = V2","Maxillary zone = V1"],"e":"Ophthalmic V1, maxillary V2, mandibular V3.","d":"The ophthalmic zone is V1, the maxillary zone is V2 and the mandibular zone is V3. Pain over the cheek and upper lip is therefore V2, and pain over the chin and lower jaw is V3.##V1 ophthalmic, V2 maxillary, V3 mandibular."},{"g":"8-16 · Trigeminal neuralgia","q":"Another name for trigeminal neuralgia?","c":"Tic douloureux","w":["Bell’s palsy","Shingles","Hyperacusis"],"e":"Tic douloureux means painful tic.","d":"Tic douloureux literally means painful tic and is another name for trigeminal neuralgia. Bell palsy is a facial nerve palsy, shingles is herpes zoster, and hyperacusis is sound sensitivity from stapedius paralysis.##Tic douloureux equals trigeminal neuralgia."},{"g":"8-17 · Herpes zoster","q":"Herpes zoster is the most common infection of which system?","c":"Peripheral nervous system","w":["Central nervous system","Respiratory tract","Urinary tract"],"e":"It is the most common PNS infection.","d":"Herpes zoster is the most common infection of the peripheral nervous system. It is not primarily a CNS, respiratory or urinary tract infection.##Shingles is the commonest PNS infection."},{"g":"8-17 · Herpes zoster","q":"What causes it?","c":"Reactivation of varicella-zoster virus","w":["Primary HSV-1 infection","EBV","Bacterial toxin"],"e":"Reactivation of the chickenpox virus.","d":"Shingles results from reactivation of latent varicella-zoster virus, the chickenpox virus. Primary HSV-1 infection, EBV and bacterial toxins do not reactivate in sensory ganglia to cause a dermatomal rash.##VZV reactivation causes zoster."},{"g":"8-17 · Herpes zoster","q":"Where does the virus lie dormant?","c":"Posterior root or sensory ganglion","w":["Anterior horn","Motor end plate","Sympathetic chain only"],"e":"Dormant in sensory ganglia.","d":"After chickenpox, VZV stays latent in posterior (dorsal) root and cranial sensory ganglia, not in the anterior horn, motor end plate or sympathetic chain. Reactivation then travels along that nerve to its dermatome.##Latent virus sits in sensory ganglia."},{"g":"8-17 · Herpes zoster","q":"How long after the initial pain do vesicles appear?","c":"72 to 96 hours","w":["About 6 hours","1 to 2 weeks","One month"],"e":"Pain first, vesicles at 72 to 96 hours.","d":"Intense burning, localized pain comes first, and vesicles appear about 72 to 96 hours (3 to 4 days) later, which is why early zoster can be misdiagnosed. Six hours is too short, and one to four weeks is too long.##Pain precedes the rash by 3 to 4 days."},{"g":"8-17 · Herpes zoster","q":"Approximate prevalence?","c":"0.5% of the population","w":["5%","25%","50%"],"e":"About 0.5%.","d":"About 0.5% of the population is affected. Rates of 5%, 25% or 50% are far too high.##Prevalence is about 0.5%."},{"g":"8-17 · Herpes zoster","q":"Which dermatomes are usually involved?","c":"T5 to L2","w":["C1 to C4","L3 to S5","T1 only"],"e":"One or several contiguous unilateral dermatomes, T5 to L2.","d":"Thoracic and upper lumbar dermatomes (T5 to L2) are most often involved, usually one or a few contiguous dermatomes on one side. C1 to C4, L3 to S5 and T1 alone are not the typical sites.##Usual dermatomes are T5 to L2, unilateral."},{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN V is affected?","c":"Semilunar","w":["Geniculate","Ciliary","Otic"],"e":"The semilunar (trigeminal) ganglion.","d":"Zoster of CN V arises from the semilunar (trigeminal, Gasserian) ganglion. The geniculate ganglion belongs to CN VII, and the ciliary and otic ganglia are parasympathetic.##Semilunar ganglion equals CN V."},{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN VII is affected?","c":"Geniculate","w":["Semilunar","Superior cervical","Spiral"],"e":"The geniculate ganglion.","d":"Zoster of CN VII arises from the geniculate ganglion, as in Ramsay Hunt syndrome. The semilunar ganglion belongs to CN V, the superior cervical ganglion is sympathetic, and the spiral ganglion belongs to CN VIII.##Geniculate ganglion equals CN VII."},{"g":"8-17 · Herpes zoster","q":"What is the rash distribution?","c":"Unilateral, confined to a dermatome","w":["Bilateral across the midline","Generalized","Palms and soles only"],"e":"Confined to one radicular or cranial nerve distribution.","d":"The rash is unilateral and confined to a single dermatome or cranial nerve distribution. It does not cross the midline, spread diffusely, or localize only to the palms and soles.##Unilateral dermatomal rash."},{"g":"8-17 · Herpes zoster","q":"What is the initial symptom?","c":"Intense burning, localized pain","w":["Painless rash","Hearing loss","Diplopia"],"e":"Burning pain precedes the vesicles.","d":"The prodrome is intense burning, localized pain before the vesicles appear. A painless rash, hearing loss and diplopia are not the initial symptoms.##Pain first, then vesicles."},{"g":"8-18 · Bell’s palsy","q":"Most common cause of facial muscle weakness and cranial neuropathy?","c":"Acute unilateral idiopathic facial palsy","w":["Stroke","Acoustic neuroma","Parotid tumor"],"e":"That is Bell’s palsy.","d":"Acute unilateral idiopathic facial palsy (Bell palsy) is the commonest cause of facial muscle weakness and cranial neuropathy. Stroke, acoustic neuroma and parotid tumor are less common causes.##Bell palsy is the most common facial palsy."},{"g":"8-18 · Bell’s palsy","q":"Which virus can cause facial nerve palsy?","c":"Herpes simplex virus","w":["Hepatitis B virus","Rabies virus","HIV only"],"e":"HSV is a recognized cause.","d":"Herpes simplex virus is a recognized cause of facial nerve palsy. Hepatitis B, rabies and HIV alone are not classically linked to Bell palsy.##HSV can cause facial palsy."},{"g":"8-18 · Bell’s palsy","q":"A lesion at the internal acoustic meatus adds which feature?","c":"Deafness from CN VIII","w":["Pain behind the ear","Taste loss only","Nothing extra"],"e":"CN VIII runs with CN VII there.","d":"A lesion at the internal acoustic meatus also involves CN VIII, which runs beside CN VII, so deafness is added to all features of the lower sites. Ear pain belongs to the geniculate site and taste loss to the facial canal.##Deafness points to the most proximal lesion."},{"g":"8-18 · Bell’s palsy","q":"A lesion at the geniculate ganglion adds which feature?","c":"Pain behind the ear","w":["Deafness","Parotid swelling","Nothing extra"],"e":"Ear pain, with possible herpes of tympanum and meatus.","d":"Geniculate ganglion lesions add pain behind the ear (and possible herpetic lesions of the tympanum and external meatus) to all lower-site features. Deafness arises only at the meatus, and parotid swelling is not a feature.##A geniculate lesion adds ear pain."},{"g":"8-18 · Bell’s palsy","q":"Chorda tympani involvement causes?","c":"Loss of anterior tongue taste and less salivation","w":["Hyperacusis","Deafness","Inability to close the eye only"],"e":"Taste from the anterior tongue and salivation.","d":"The chorda tympani carries taste from the anterior two thirds of the tongue and secretomotor fibers to the submandibular and sublingual glands, so injury causes taste loss and reduced salivation. Hyperacusis is a stapedius effect and deafness a CN VIII effect.##Chorda tympani carries anterior taste and salivation."},{"g":"8-18 · Bell’s palsy","q":"Hyperacusis results from loss of which muscle’s function?","c":"Stapedius","w":["Tensor tympani","Buccinator","Masseter"],"e":"The nerve to stapedius is affected in the facial canal.","d":"The nerve to stapedius dampens loud sounds; when it is paralyzed, sound becomes painfully loud (hyperacusis). The tensor tympani is supplied by CN V, the buccinator moves the cheek, and the masseter closes the jaw.##Stapedius paralysis causes hyperacusis."},{"g":"8-18 · Bell’s palsy","q":"Facial paralysis, anterior taste loss, hyperacusis, normal hearing, no ear pain. Lesion site?","c":"Facial canal","w":["Internal acoustic meatus","Geniculate ganglion","Below the stylomastoid foramen"],"e":"Site 3 has taste loss and hyperacusis but not ear pain or deafness.","d":"Facial paralysis with taste loss and hyperacusis but no deafness or ear pain places the lesion in the facial canal (site 3). Site 2 would add ear pain, site 1 would add deafness, and site 4 would spare taste and hearing.##Site 3 gives taste loss plus hyperacusis."},{"g":"8-18 · Bell’s palsy","q":"Why does food collect between teeth and cheek below the stylomastoid foramen?","c":"Buccinator paralysis","w":["Masseter paralysis","Tongue weakness","Loss of taste"],"e":"The buccinator is paralyzed.","d":"Buccinator paralysis lets food pool between the teeth and cheek on the affected side. The masseter and temporalis close the jaw, and taste loss does not cause food pooling.##Buccinator weakness traps food."},{"g":"8-18 · Bell’s palsy","q":"What is Bell’s phenomenon?","c":"Eye rolls upward on attempted closure, exposing sclera","w":["Tongue deviates to the lesion side","Uvula deviates","Pupil constricts"],"e":"Seen with peripheral facial weakness.","d":"Bell phenomenon is the upward rolling of the eyeball on attempted lid closure, exposing sclera because the lid does not close. Tongue deviation is hypoglossal, uvular deviation is vagal, and pupillary constriction is the light reflex.##The eye rolls up when the lid cannot close."},{"g":"8-18 · Bell’s palsy","q":"Incomplete smile, flat nasolabial fold, forehead preserved. Which lesion?","c":"Central (UMN)","w":["Peripheral (LMN)","Geniculate ganglion","Below stylomastoid foramen"],"e":"Brow and forehead are relatively spared in central weakness.","d":"Central (upper motor neuron) lesions weaken the lower face but relatively spare the brow and forehead, because the upper face has bilateral cortical input. A peripheral lesion paralyzes the whole half of the face.##A spared forehead means a central lesion."},{"g":"8-19 · Tetanus (title inferred)","q":"What posture appears in advanced disease?","c":"Rigid opisthotonos","w":["Flaccid paralysis","Resting tremor","Fetal curling only"],"e":"Rigid, moderate opisthotonos."},{"g":"8-19 · Tetanus (title inferred)","q":"How does the abdomen feel?","c":"Boardlike","w":["Soft and distended","Scaphoid and flaccid","Normal"],"e":"The abdomen is boardlike."},{"g":"8-19 · Tetanus (title inferred)","q":"What is the arm position?","c":"Extended","w":["Flexed on the chest","Flaccid","Raised above the head"],"e":"Arms are extended."},{"g":"8-19 · Tetanus (title inferred)","q":"What life-threatening complication may occur?","c":"Respiratory arrest","w":["Hyphema","Papilledema","Glaucoma"],"e":"Respiratory arrest may occur."},{"g":"8-19 · Tetanus (title inferred)","q":"What is opisthotonos?","c":"Arching with head and heels bent backward","w":["Forward flexion","Lateral deviation","Tongue deviation"],"e":"A backward arch of the body."},{"g":"8-19 · Tetanus (title inferred)","q":"Which organism causes tetanus? (beyond the page)","c":"Clostridium tetani","w":["Clostridium difficile","Staphylococcus aureus","Bacillus cereus"],"e":"Spore-forming C. tetani."},{"g":"8-19 · Tetanus (title inferred)","q":"What does tetanospasmin block? (beyond the page)","c":"Release of inhibitory GABA and glycine","w":["ACh release","Dopamine reuptake","Sodium channels"],"e":"Loss of inhibition causes spasm."},{"g":"8-19 · Tetanus (title inferred)","q":"What is a classic early sign? (beyond the page)","c":"Trismus (lockjaw)","w":["Ptosis","Papilledema","Hyperacusis"],"e":"Jaw stiffness often comes first."},{"g":"8-19 · Tetanus (title inferred)","q":"What is risus sardonicus? (beyond the page)","c":"Sustained grin from facial spasm","w":["Facial droop","Eye rolling","Tongue deviation"],"e":"Facial muscle spasm."},{"g":"8-19 · Tetanus (title inferred)","q":"Best prevention? (beyond the page)","c":"Tetanus toxoid vaccination","w":["Antivirals","Silver nitrate","Eye lubricants"],"e":"Vaccination plus boosters."},{"g":"8-20 · Orbital blow-out","q":"Which structure fractures in a blow-out fracture?","c":"Thin orbital floor","w":["Orbital roof","Lateral wall","Nasal bone only"],"e":"The thin orbital floor."},{"g":"8-20 · Orbital blow-out","q":"What mechanism causes it?","c":"Sudden rise in intraorbital pressure","w":["Slow tumor growth","Viral infection","Penetrating dart only"],"e":"A direct blow raises intraorbital pressure."},{"g":"8-20 · Orbital blow-out","q":"Where does orbital tissue herniate?","c":"Maxillary sinus","w":["Frontal sinus","Sphenoid sinus","Middle cranial fossa"],"e":"Into the maxillary paranasal sinus."},{"g":"8-20 · Orbital blow-out","q":"What causes cheek anesthesia?","c":"Infraorbital nerve damage","w":["Facial nerve damage","Mandibular nerve damage","Lacrimal nerve damage"],"e":"The infraorbital nerve."},{"g":"8-20 · Orbital blow-out","q":"Which term describes a sunken globe?","c":"Enophthalmos","w":["Exophthalmos","Ptosis","Miosis"],"e":"Enophthalmos."},{"g":"8-20 · Orbital blow-out","q":"Why is upward gaze limited?","c":"Tissue entrapped in the fracture defect","w":["CN VII palsy","Lens dislocation","Sympathetic lesion"],"e":"Entrapment in the defect."},{"g":"8-20 · Orbital blow-out","q":"Blood in the anterior chamber is called?","c":"Hyphema","w":["Ecchymosis","Epistaxis","Chalazion"],"e":"Hyphema."},{"g":"8-20 · Orbital blow-out","q":"Which is not a listed clinical sign?","c":"Ptosis with miosis","w":["Diplopia","Infraorbital paresthesia","Enophthalmos"],"e":"Listed: diplopia, paresthesia, enophthalmos, edema, ecchymosis."},{"g":"8-20 · Orbital blow-out","q":"Which serious ocular injury can occur?","c":"Retinal detachment","w":["Pterygium","Optic neuritis only","Chalazion"],"e":"Also hyphema, dislocated lens, globe rupture."},{"g":"8-20 · Orbital blow-out","q":"Which major fracture can also cause it?","c":"Zygomaticomaxillary complex","w":["Mandibular condyle","Occipital bone","Hyoid"],"e":"Massive ZMC fractures can blow out the floor."},{"g":"8-21 · Extraocular muscles","q":"Which pattern is used to test extraocular muscle movement?","c":"An H pattern","w":["A star pattern","A circle pattern","A zigzag pattern"],"e":"The examiner traces an H with a finger."},{"g":"8-21 · Extraocular muscles","q":"Which muscle alone produces pure abduction?","c":"Lateral rectus","w":["Superior rectus","Inferior oblique","Medial rectus"],"e":"Pure abduction is done by the lateral rectus."},{"g":"8-21 · Extraocular muscles","q":"Which muscle alone produces pure adduction?","c":"Medial rectus","w":["Lateral rectus","Superior oblique","Inferior rectus"],"e":"Pure adduction is done by the medial rectus."},{"g":"8-21 · Extraocular muscles","q":"Finger held up and to the right. Which muscles work mainly?","c":"Right superior rectus, left inferior oblique","w":["Right inferior oblique, left superior rectus","Right lateral rectus, left medial rectus","Right superior oblique, left inferior rectus"],"e":"SR of the right eye and IO of the left eye."},{"g":"8-21 ·  <p>${miss.length?'<button class="bt" id="rm">Retry '+miss.length+' missed</button> ':''}<button class="bt" id="ag">New block</button> <button class="bt" id="rv">Review items</button> <button class="bt" id="bk">Change focuses</button></p></div>`;
 if(miss.length)$('rm').onclick=()=>start(miss.slice(),0,true);
 $('ag').onclick=()=>start(last.p,last.lim);$('bk').onclick=setup;$('rv').onclick=()=>{live=true;$('mk').hidden=false;n=0;show()};
}
$('mk').onclick=()=>{Q[n].m=!Q[n].m;show()};$('hm').onclick=goHome;
document.addEventListener('keydown',e=>{if(!live||!Q.length)return;const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0)pick(k%4);else if(e.key==='ArrowRight'&&n<Q.length-1){n++;show()}else if(e.key==='ArrowLeft'&&n>0){n--;show()}});
home();
