<script>
const D=[{"g":"8-1 · Skull fractures","q":"Which description fits a linear skull fracture?","c":"A distinct fracture line","w":["Multiple bone fragments","A break along a suture","A break in the skull base"],"e":"A linear fracture shows a single distinct fracture line. Multiple fragments describe a comminuted fracture."},{"g":"8-1 · Skull fractures","q":"What defines a comminuted skull fracture?","c":"Multiple bone fragments","w":["One clean fracture line","Separation of a suture","A break limited to the base"],"e":"Comminuted fractures present with multiple fragments, and may be depressed if driven inward."},{"g":"8-1 · Skull fractures","q":"What is the danger of a depressed comminuted fracture?","c":"It can compress or tear the dura","w":["It always causes a CSF leak","It only injures the scalp","It heals without any treatment"],"e":"Fragments driven inward can compress or tear the underlying dura mater."},{"g":"8-1 · Skull fractures","q":"What is a diastasis fracture?","c":"A fracture along a suture line","w":["A fracture through the scalp","A fracture of the skull base","A fracture with many fragments"],"e":"Diastasis is a fracture along a suture line."},{"g":"8-1 · Skull fractures","q":"What is a basilar skull fracture?","c":"A fracture of the skull base","w":["A fracture along a suture","A fracture of the frontal bone","A fracture of the zygomatic arch"],"e":"Basilar fractures involve the base of the skull."},{"g":"8-1 · Skull fractures","q":"Which feature makes a skull fracture compound?","c":"It communicates with the outside","w":["It has several bone fragments","It lies along a suture line","It is limited to the skull base"],"e":"Any fracture communicating with a lacerated scalp, paranasal sinus or middle ear is compound."},{"g":"8-1 · Skull fractures","q":"Which communication makes a fracture compound?","c":"A paranasal sinus","w":["The subdural space","The temporalis muscle","The orbital fat pad"],"e":"Communication with a paranasal sinus, the middle ear or a scalp laceration makes it compound."},{"g":"8-1 · Skull fractures","q":"How must compound depressed fractures be treated?","c":"Surgically","w":["By observation only","With bed rest alone","With antibiotics alone"],"e":"Compound depressed fractures must be treated surgically."},{"g":"8-1 · Skull fractures","q":"Which fracture is a compound fracture?","c":"A basilar fracture into the middle ear","w":["A linear fracture under intact scalp","A suture diastasis with intact skin","A closed comminuted fracture"],"e":"A basilar fracture entering the middle ear communicates with the outside, so it is compound."},{"g":"8-1 · Skull fractures","q":"Which finding is shown in a compound depressed fracture?","c":"Hair impacted into the wound","w":["Blood in the anterior chamber","A flattened cheekbone","Subconjunctival hemorrhage"],"e":"The illustration notes hair impacted into the wound."},{"g":"8-2 · Zygomatic fractures","q":"Which bone is the cheekbone?","c":"Zygomatic bone","w":["Maxillary bone","Temporal bone","Sphenoid bone"],"e":"Trauma to the zygomatic bone disrupts the zygomatic complex."},{"g":"8-2 · Zygomatic fractures","q":"Which sutures are often involved in zygomatic fractures?","c":"Frontal and maxillary","w":["Parietal and occipital","Nasal and lacrimal","Mandibular and hyoid"],"e":"Fractures often involve the suture lines with the frontal and maxillary bones."},{"g":"8-2 · Zygomatic fractures","q":"In which directions is the bone displaced?","c":"Inferiorly, medially, posteriorly","w":["Superiorly, laterally, anteriorly","Only laterally","Only anteriorly"],"e":"Displacement is inferior, medial and posterior."},{"g":"8-2 · Zygomatic fractures","q":"Which gaze is associated with the diplopia?","c":"Upper outer gaze","w":["Lower inner gaze","Straight ahead only","Downward gaze only"],"e":"Diplopia is described as occurring in the upper outer gaze."},{"g":"8-2 · Zygomatic fractures","q":"What is hyphema?","c":"Blood in the anterior chamber","w":["Blood under the conjunctiva","Blood in the vitreous","Blood in the orbit fat"],"e":"It requires immediate clinical attention."},{"g":"8-2 · Zygomatic fractures","q":"What happens to the palpebral fissure?","c":"Lateral portion is lowered","w":["Lateral portion is raised","Fissure is fully closed","Fissure is unaffected"],"e":"The lateral canthal ligament is pulled downward with the bone."},{"g":"8-2 · Zygomatic fractures","q":"What is the cheek contour after the injury?","c":"Flattened","w":["Prominent","Swollen only","Normal"],"e":"A flattened cheekbone is part of the typical presentation."},{"g":"8-2 · Zygomatic fractures","q":"What happens to the lateral canthal ligament?","c":"Displaced downward","w":["Displaced upward","Torn off the orbit","Unchanged"],"e":"It is displaced downward with the dislocated zygomatic bone."},{"g":"8-2 · Zygomatic fractures","q":"Which is not listed as an articulation of the zygomatic bone?","c":"Mandible","w":["Frontal bone","Temporal bone","Palatine bone"],"e":"Listed: frontal, maxillary, temporal, sphenoid and palatine bones."},{"g":"8-2 · Zygomatic fractures","q":"Which sign is illustrated with a zygomatic fracture?","c":"Subconjunctival hemorrhage","w":["Papilledema","Miosis","Ptosis"],"e":"The figure shows ecchymosis and subconjunctival hemorrhage."},{"g":"8-3 · Midface fractures","q":"Who classified midface fractures?","c":"Le Fort","w":["Colles","Pott","Monteggia"],"e":"Midface fractures are classified by Le Fort."},{"g":"8-3 · Midface fractures","q":"What is a Le Fort I fracture?","c":"Horizontal maxillary detachment","w":["Pyramidal midface fracture","Fracture through the zygomata","Fracture of the cranial vault"],"e":"Le Fort I detaches the maxilla horizontally at the level of the nasal floor."},{"g":"8-3 · Midface fractures","q":"What is the shape of a Le Fort II fracture?","c":"Pyramidal","w":["Horizontal","Vertical","Circular"],"e":"Le Fort II is a pyramidal fracture."},{"g":"8-3 · Midface fractures","q":"Which bones does Le Fort II include?","c":"Both maxillae and nasal bones","w":["Both zygomatic arches only","The mandible and hyoid","The frontal bone only"],"e":"It includes both maxillae and the nasal bones."},{"g":"8-3 · Midface fractures","q":"Which structures does Le Fort II also include?","c":"Infraorbital rims and orbital floors","w":["Zygomatic arches and mandible","Sphenoid wings and clivus","Temporal bone and mastoid"],"e":"It includes the infraorbital rims, orbits and orbital floors."},{"g":"8-3 · Midface fractures","q":"What does Le Fort III add to Le Fort II?","c":"Fracture of both zygomatic bones","w":["Fracture of the mandible","Fracture of the nasal septum only","Fracture of the hyoid"],"e":"Le Fort III includes Le Fort II plus both zygomatic bones."},{"g":"8-3 · Midface fractures","q":"Which are complications of Le Fort III?","c":"Airway problems and CSF leakage","w":["Hearing loss and vertigo","Dysphagia and hoarseness","Ptosis and miosis"],"e":"Also nasolacrimal apparatus obstruction."},{"g":"8-3 · Midface fractures","q":"Which fracture separates facial bones from the cranial vault?","c":"Le Fort III","w":["Le Fort I","Le Fort II","Zygomatic fracture"],"e":"Le Fort III separates the facial bones from the cranial vault."},{"g":"8-3 · Midface fractures","q":"Which bones does the midface classification cover?","c":"Maxilla, nasoorbital complex, zygomatic","w":["Mandible, hyoid, vomer","Parietal, occipital, temporal","Sphenoid, ethmoid, atlas"],"e":"Midface fractures involve the maxilla, nasoorbital complex and zygomatic bones."},{"g":"8-3 · Midface fractures","q":"Which finding is not part of Le Fort II?","c":"Fracture through both zygomatic bones","w":["Fracture of both maxillae","Fracture of nasal bones","Fracture of infraorbital rims"],"e":"Zygomatic fractures are the added feature of Le Fort III."},{"g":"8-4 · Hydrocephalus","q":"What is hydrocephalus?","c":"Excess CSF within the ventricles","w":["Excess blood in the ventricles","Loss of brain tissue","Swelling of the scalp"],"e":"It is the accumulation of excess CSF in the ventricular system."},{"g":"8-4 · Hydrocephalus","q":"Which can cause hydrocephalus?","c":"Blockage of CSF passageways","w":["Excess production of bile","Loss of CSF production","Increased CSF absorption"],"e":"Causes: overproduction, decreased absorption or blockage of CSF flow."},{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Monro?","c":"Interventricular foramen","w":["Cerebral aqueduct","Lateral aperture","Median aperture"],"e":"The interventricular foramina are the foramina of Monro."},{"g":"8-4 · Hydrocephalus","q":"What is the aqueduct of Sylvius?","c":"Cerebral aqueduct","w":["Interventricular foramen","Lateral aperture","Median aperture"],"e":"The cerebral aqueduct is the aqueduct of Sylvius."},{"g":"8-4 · Hydrocephalus","q":"What are the foramina of Luschka?","c":"Lateral apertures","w":["Median aperture","Interventricular foramina","Cerebral aqueduct"],"e":"The lateral apertures are the foramina of Luschka."},{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Magendie?","c":"Median aperture","w":["Lateral apertures","Interventricular foramina","Cerebral aqueduct"],"e":"The median aperture is the foramen of Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which ventricles are dilated in the section shown?","c":"Lateral and third","w":["Fourth only","Third only","None"],"e":"The section shows marked dilatation of the lateral and third ventricles."},{"g":"8-4 · Hydrocephalus","q":"Which is not a listed obstruction site?","c":"Foramen magnum","w":["Interventricular foramina","Cerebral aqueduct","Median aperture"],"e":"Listed: Monro, Sylvius, Luschka, Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which structures drain the 4th ventricle into the subarachnoid space? (beyond the page)","c":"Lateral and median apertures","w":["Interventricular foramina","Cerebral aqueduct","Central canal"],"e":"Standard knowledge: the apertures of Luschka and Magendie."},{"g":"8-4 · Hydrocephalus","q":"Which foramina link the lateral and third ventricles? (beyond the page)","c":"Interventricular foramina","w":["Cerebral aqueduct","Median aperture","Lateral apertures"],"e":"Standard knowledge: the foramina of Monro."},{"g":"8-5 · Meningitis","q":"What is meningitis?","c":"Inflammation of arachnoid and pia","w":["Inflammation of the dura only","Inflammation of the brain tissue","Inflammation of the scalp"],"e":"It is inflammation of the arachnoid mater and pia mater."},{"g":"8-5 · Meningitis","q":"Which are aseptic causes?","c":"Viral infections and drug reactions","w":["Bacterial abscess only","Fungal sinusitis only","Parasitic cysts only"],"e":"Aseptic causes include viral infections, drug reactions and systemic diseases."},{"g":"8-5 · Meningitis","q":"Which symptom is listed for meningitis?","c":"Painful stiff neck","w":["Hearing loss","Ptosis","Hoarseness"],"e":"Headache, fever, seizures and a painful stiff neck."},{"g":"8-5 · Meningitis","q":"How is the diagnosis made?","c":"Lumbar puncture and CSF exam","w":["Skull radiograph alone","Blood culture alone","Otoscopic exam"],"e":"Diagnosis is by lumbar puncture and CSF examination."},{"g":"8-5 · Meningitis","q":"How does bacterial infection usually reach the leptomeninges?","c":"Hematogenous spread","w":["Direct nerve spread","Lymphatic spread","Swallowed organisms"],"e":"Usually hematogenous, but it may be direct."},{"g":"8-5 · Meningitis","q":"Which sites may spread infection directly?","c":"Sinuses, middle ear, mastoid cells","w":["Kidneys and bladder","Liver and gallbladder","Knee and hip joints"],"e":"Direct spread from paranasal sinuses, middle ear and mastoid cells."},{"g":"8-5 · Meningitis","q":"What can a cribriform plate defect cause?","c":"CSF leak and infection route","w":["Optic nerve damage only","Hearing loss only","Dry nasal mucosa"],"e":"A cribriform defect lets CSF leak and gives infection a route."},{"g":"8-5 · Meningitis","q":"Which injury can be a source of meningitis?","c":"Basal skull fracture","w":["Wrist fracture","Rib fracture","Tibial fracture"],"e":"A basal skull fracture can open a path for infection."},{"g":"8-5 · Meningitis","q":"Which is a listed source of infection?","c":"Mastoiditis","w":["Pyelonephritis","Cholecystitis","Appendicitis"],"e":"Listed sources include otitis media, sinusitis, mastoiditis, nasopharyngitis, pneumonia."},{"g":"8-5 · Meningitis","q":"Which is not a listed symptom?","c":"Hearing loss","w":["Headache","Fever","Seizures"],"e":"Listed: headache, fever, seizures and a painful stiff neck."},{"g":"8-6 · Subarachnoid hemorrhage","q":"Between which layers does blood collect in subarachnoid hemorrhage?","c":"Arachnoid mater and pia mater","w":["Dura mater and arachnoid mater","Periosteal dura and cranium","Pia mater and brain surface only"],"e":"Blood collects between the arachnoid mater and the pia mater.","d":"Blood collects between the arachnoid mater and the pia mater. The subarachnoid space normally holds CSF, so bleeding here mixes blood with CSF. Blood between the dura and cranium is epidural, and blood between the dura and arachnoid is subdural.##Subarachnoid blood lies between the arachnoid and pia mater."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What is the usual source of subarachnoid hemorrhage?","c":"An arterial source","w":["A cortical bridging vein","A dural venous sinus","The scalp veins"],"e":"It usually occurs from an arterial source.","d":"It usually occurs from an arterial source. Arterial bleeding enters the CSF-filled space under pressure. Bridging veins are the source of subdural hematomas.##Subarachnoid hemorrhage is usually arterial."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What is the most common cause of subarachnoid hemorrhage?","c":"Rupture of a saccular (berry) aneurysm","w":["Rupture of a bridging vein","A fracture of the temporal bone","Meningioma invasion of a sinus"],"e":"The most common cause is rupture of a saccular, or berry, aneurysm.","d":"The most common cause is rupture of a saccular, or berry, aneurysm. Berry aneurysms occur mostly on arteries of the cerebral arterial circle and its branches.##A ruptured berry aneurysm is the leading cause of subarachnoid hemorrhage."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What percentage of cerebral aneurysms arise in the anterior circulation?","c":"85%","w":["15%","50%","65%"],"e":"Anterior circulation aneurysms account for 85%.","d":"Anterior circulation aneurysms account for 85%. The posterior circulation accounts for the remaining 15%.##Most cerebral aneurysms (85%) arise in the anterior circulation."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What percentage of cerebral aneurysms arise in the posterior circulation?","c":"15%","w":["85%","30%","50%"],"e":"Posterior circulation aneurysms account for 15%.","d":"Posterior circulation aneurysms account for 15%. These include basilar, posterior cerebral, and vertebral (posterior inferior cerebellar) sites.##About 15% of cerebral aneurysms are in the posterior circulation."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What percentage of aneurysms arise at the anterior communicating artery?","c":"25%","w":["4%","18%","3%"],"e":"The anterior communicating artery accounts for 25% of aneurysms.","d":"The anterior communicating artery accounts for 25% of aneurysms. It is one of the commonest sites, alongside the internal carotid (30%) and middle cerebral (25%) arteries.##The anterior communicating artery is a major aneurysm site (25%)."},{"g":"8-6 · Subarachnoid hemorrhage","q":"Which internal carotid site has the most aneurysms?","c":"Posterior communicating","w":["Ophthalmic","Bifurcation","Anterior choroidal"],"e":"Posterior communicating aneurysms account for 18% of the total.","d":"Posterior communicating aneurysms account for 18% of the total. Ophthalmic, bifurcation, and anterior choroidal sites each account for only about 4%.##The posterior communicating artery is the commonest internal carotid aneurysm site."},{"g":"8-6 · Subarachnoid hemorrhage","q":"What percentage of aneurysms arise from the middle cerebral artery?","c":"25%","w":["2%","10%","30%"],"e":"Middle cerebral artery aneurysms account for 25%.","d":"Middle cerebral artery aneurysms account for 25%. The anterior cerebral and internal carotid arteries each account for about 30%.##The middle cerebral artery accounts for about a quarter of aneurysms."},{"g":"8-6 · Subarachnoid hemorrhage","q":"Which posterior circulation artery has the most aneurysms?","c":"Basilar","w":["Posterior cerebral","Posterior inferior cerebellar","Anterior spinal"],"e":"Basilar aneurysms account for 10% of the total, more than any other posterior site.","d":"Basilar aneurysms account for 10% of the total, more than any other posterior site. Posterior cerebral aneurysms are about 2% and posterior inferior cerebellar about 3%.##The basilar artery is the leading posterior circulation aneurysm site."},{"g":"8-6 · Subarachnoid hemorrhage","q":"Where do most basilar artery aneurysms occur?","c":"At the bifurcation","w":["At the basilar trunk","At the vertebral junction","At the pontine branches"],"e":"Basilar bifurcation aneurysms account for 7% of the 10% basilar total.","d":"Basilar bifurcation aneurysms account for 7% of the 10% basilar total. The basilar trunk accounts for only 3%.##Most basilar aneurysms are at the bifurcation."},{"g":"8-7 · Epidural hematomas","q":"Where does blood collect in an epidural hematoma?","c":"Between periosteal dura and cranium","w":["Between dura and arachnoid","Between arachnoid and pia","Within the brain parenchyma"],"e":"Blood collects between the periosteal dura mater and the bony cranium.","d":"Blood collects between the periosteal dura mater and the bony cranium. This potential space is created as the dura is stripped from the bone.##Epidural blood lies between the periosteal dura and the skull."},{"g":"8-7 · Epidural hematomas","q":"What is the usual source of an epidural hematoma?","c":"Arterial bleeding (85%)","w":["Cortical bridging veins","Berry aneurysm rupture","Venous sinus thrombosis"],"e":"The source is usually arterial, in about 85% of cases.","d":"The source is usually arterial, in about 85% of cases. Arterial pressure explains why these hematomas can expand quickly.##Epidural hematomas are usually arterial in origin."},{"g":"8-7 · Epidural hematomas","q":"Which artery is very susceptible to injury deep to the pterion?","c":"Middle meningeal artery","w":["Middle cerebral artery","Anterior cerebral artery","Basilar artery"],"e":"The middle meningeal artery is very susceptible where it lies deep to the pterion.","d":"The middle meningeal artery is very susceptible where it lies deep to the pterion. A temporal skull fracture crossing the artery can tear it.##Pterion fractures endanger the middle meningeal artery."},{"g":"8-7 · Epidural hematomas","q":"Which regions are common locations for epidural hematomas?","c":"Frontal, temporal, and occipital","w":["Only the parietal region","Only the sphenoid region","Only the posterior fossa"],"e":"Common locations include the frontal, temporal, and occipital regions.","d":"Common locations include the frontal, temporal, and occipital regions. Each location gives different signs, such as subfrontal, temporal fossa, or posterior fossa hematomas.##Epidural hematomas occur in frontal, temporal, and occipital regions."},{"g":"8-7 · Epidural hematomas","q":"Which nerve compression causes ipsilateral pupil dilation?","c":"Oculomotor (III) nerve","w":["Trochlear (IV) nerve","Abducens (VI) nerve","Optic (II) nerve"],"e":"Compression of the oculomotor nerve leads to ipsilateral pupil dilation and CN III palsy.","d":"Compression of the oculomotor nerve leads to ipsilateral pupil dilation and CN III palsy. The herniating temporal lobe presses on CN III as it passes beside the tentorium.##CN III compression causes a dilated ipsilateral pupil."},{"g":"8-7 · Epidural hematomas","q":"Under which structure does the temporal lobe herniate?","c":"Tentorium cerebelli","w":["Falx cerebri","Diaphragma sellae","Falx cerebelli"],"e":"The temporal lobe herniates under the tentorium cerebelli.","d":"The temporal lobe herniates under the tentorium cerebelli. This also compresses the posterior cerebral artery and the oculomotor nerve.##Uncal herniation passes under the tentorium cerebelli."},{"g":"8-7 · Epidural hematomas","q":"Which signs follow compression of corticospinal pathways?","c":"Contralateral hemiparesis, hyperreflexia, Babinski’s sign","w":["Ipsilateral flaccid paralysis","Bilateral anosmia","Loss of upward gaze only"],"e":"Compression produces contralateral hemiparesis, deep tendon hyperreflexia, and Babinski’s sign.","d":"Compression produces contralateral hemiparesis, deep tendon hyperreflexia, and Babinski’s sign. Corticospinal fibers cross below the brainstem, so deficits are on the opposite side.##Corticospinal compression gives contralateral upper motor neuron signs."},{"g":"8-7 · Epidural hematomas","q":"Which classic triad can accompany a posterior fossa hematoma?","c":"Cushing’s triad","w":["Charcot’s triad","Beck’s triad","Horner’s triad"],"e":"Posterior fossa hematoma can show headache, meningismus, cerebellar and cranial nerve signs, and Cushing’s triad.","d":"Posterior fossa hematoma can show headache, meningismus, cerebellar and cranial nerve signs, and Cushing’s triad. Cushing’s triad reflects raised intracranial pressure.##Posterior fossa hematoma may produce Cushing’s triad."},{"g":"8-7 · Epidural hematomas","q":"How can brainstem shift alter the neurologic signs?","c":"It may reverse lateralization of signs","w":["It abolishes all motor signs","It always spares the pupil","It converts the bleed to venous"],"e":"Shift of the brainstem to the opposite side may reverse lateralization of signs by tentorial pressure on contralateral pathways.","d":"Shift of the brainstem to the opposite side may reverse lateralization of signs by tentorial pressure on contralateral pathways. This is why signs may falsely localize the lesion.##Brainstem shift can reverse the lateralization of signs."},{"g":"8-7 · Epidural hematomas","q":"Which mechanism most often causes epidural hematomas?","c":"Motor vehicle crashes, falls, sports injuries","w":["Chronic alcohol use","Ruptured berry aneurysm","Embolic disease from the heart"],"e":"They result most often from motor vehicle crashes, falls, and sports injuries.","d":"They result most often from motor vehicle crashes, falls, and sports injuries. These are head traumas often associated with skull fractures.##Epidural hematomas are usually traumatic."},{"g":"8-8 · Subdural hematomas","q":"What is the usual cause of an acute subdural hematoma?","c":"Venous hemorrhage of cortical bridging veins","w":["Arterial rupture of the middle meningeal artery","Berry aneurysm rupture","Embolic infarction"],"e":"Subdural hematomas are usually caused by acute venous hemorrhage of the cortical bridging veins.","d":"Subdural hematomas are usually caused by acute venous hemorrhage of the cortical bridging veins. Arterial bleeding more typically causes epidural hematomas.##Subdural hematomas are usually venous from bridging veins."},{"g":"8-8 · Subdural hematomas","q":"Where does blood collect in a subdural hematoma?","c":"Between meningeal dura and arachnoid","w":["Between periosteal dura and cranium","Between arachnoid and pia","Inside the ventricles"],"e":"Blood collects between the meningeal dura mater and the arachnoid mater, a potential space.","d":"Blood collects between the meningeal dura mater and the arachnoid mater, a potential space. Subdural blood spreads along the brain surface and is not limited by sutures.##Subdural blood lies between the meningeal dura and the arachnoid."},{"g":"8-8 · Subdural hematomas","q":"Into which sinus do the bridging veins drain?","c":"Superior sagittal sinus","w":["Cavernous sinus","Sigmoid sinus","Straight sinus"],"e":"The bridging veins drain cortical blood into the superior sagittal sinus.","d":"The bridging veins drain cortical blood into the superior sagittal sinus. They cross the subdural space and are vulnerable to tearing.##Bridging veins drain into the superior sagittal sinus."},{"g":"8-8 · Subdural hematomas","q":"What proportion of subdural hematomas have skull fractures?","c":"Half","w":["None","All","Almost none"],"e":"Half are associated with skull fractures.","d":"Half are associated with skull fractures. The other half occur without a fracture, so an intact skull does not exclude the diagnosis.##About half of subdural hematomas are associated with skull fracture."},{"g":"8-8 · Subdural hematomas","q":"Which pupillary sign occurs in subdural hematoma?","c":"Ipsilateral dilation","w":["Contralateral dilation","Bilateral constriction","Light-near dissociation"],"e":"Clinical signs include ipsilateral pupillary dilation.","d":"Clinical signs include ipsilateral pupillary dilation. This reflects compression of the oculomotor nerve on the side of the lesion.##A subdural hematoma causes ipsilateral pupillary dilation."},{"g":"8-8 · Subdural hematomas","q":"Which motor sign occurs in subdural hematoma?","c":"Contralateral hemiparesis","w":["Ipsilateral hemiparesis","Bilateral facial paralysis","Isolated tongue weakness"],"e":"Contralateral hemiparesis is a clinical sign.","d":"Contralateral hemiparesis is a clinical sign. The corticospinal tract crosses below the lesion.##Subdural hematoma produces contralateral hemiparesis."},{"g":"8-8 · Subdural hematomas","q":"Which level of consciousness change occurs?","c":"Decreasing level of consciousness","w":["Sudden euphoria","Isolated memory gain","No change in consciousness"],"e":"A decreasing level of consciousness is a clinical sign, along with headache.","d":"A decreasing level of consciousness is a clinical sign, along with headache. Decline reflects rising intracranial pressure and brain compression.##A falling level of consciousness is typical."},{"g":"8-8 · Subdural hematomas","q":"In whom are chronic subdural hematomas most common?","c":"Elderly persons and alcoholic patients","w":["Young athletes","Infants only","Pregnant women"],"e":"Chronic subdural hematomas are most common in elderly persons and alcoholic patients.","d":"Chronic subdural hematomas are most common in elderly persons and alcoholic patients. These patients often have brain atrophy.##Chronic subdural hematomas favor elderly and alcoholic patients."},{"g":"8-8 · Subdural hematomas","q":"Why does brain atrophy predispose to subdural hematoma?","c":"It increases the space traversed by bridging veins","w":["It thickens the dura","It strengthens the veins","It narrows the subarachnoid space"],"e":"Atrophy increases the space traversed by the bridging veins and leaves the stretched vein susceptible to tearing.","d":"Atrophy increases the space traversed by the bridging veins and leaves the stretched vein susceptible to tearing. Even minor trauma can then tear a vein.##Atrophy stretches bridging veins and makes them tear easily."},{"g":"8-8 · Subdural hematomas","q":"When may subdural hematomas develop after injury?","c":"Within 1 week, often with signs within hours","w":["Only after 6 months","Only after 1 year","Never within days"],"e":"These hematomas may develop within 1 week after injury but often present with clinical signs within hours.","d":"These hematomas may develop within 1 week after injury but often present with clinical signs within hours. Chronic forms may appear much later in at-risk patients.##Acute subdural hematomas present within hours to a week."},{"g":"8-9 · Transient ischemic attack","q":"What is a transient ischemic attack?","c":"A temporary interruption of focal brain circulation","w":["A permanent infarct of the brainstem","A hemorrhage into the ventricles","A tumor-related seizure"],"e":"A TIA is a temporary interruption of focal brain circulation causing a neurologic deficit.","d":"A TIA is a temporary interruption of focal brain circulation causing a neurologic deficit. The deficit resolves, unlike in stroke.##TIA is a temporary focal ischemic episode."},{"g":"8-9 · Transient ischemic attack","q":"How long does the deficit of a TIA last?","c":"Less than 24 hours","w":["More than 24 hours","More than 1 week","Permanently"],"e":"The deficit lasts less than 24 hours, usually 15 minutes to 1 hour.","d":"The deficit lasts less than 24 hours, usually 15 minutes to 1 hour. Deficits lasting longer than 24 hours define a stroke.##A TIA lasts under 24 hours."},{"g":"8-9 · Transient ischemic attack","q":"What is the most common cause of a TIA?","c":"Embolic disease from heart, carotid, or cerebral vessels","w":["Ruptured berry aneurysm","Bridging vein tear","Venous sinus tumor"],"e":"The most common cause is embolic disease from the heart, carotid, or cerebral vessels, which may temporarily block a vessel.","d":"The most common cause is embolic disease from the heart, carotid, or cerebral vessels, which may temporarily block a vessel. Emboli may break up and allow flow to return.##Emboli temporarily blocking a vessel cause most TIAs."},{"g":"8-9 · Transient ischemic attack","q":"What is the usual pattern of onset and recovery in a TIA?","c":"Abrupt onset, gradual recovery","w":["Gradual onset, abrupt recovery","Gradual onset, no recovery","Abrupt onset, no recovery"],"e":"Onset of the deficit is abrupt and recovery is gradual.","d":"Onset of the deficit is abrupt and recovery is gradual. A sudden focal deficit that clears is typical.##TIA starts abruptly and recovers gradually."},{"g":"8-9 · Transient ischemic attack","q":"Which is the most common site of atheroma and clot in TIA?","c":"Bifurcation of the common carotid artery","w":["Origin of the common carotid artery","Basilar artery trunk","Anterior communicating artery"],"e":"Atheroma with or without clot at the bifurcation of the common carotid artery is the most common site.","d":"Atheroma with or without clot at the bifurcation of the common carotid artery is the most common site. The origin of the common carotid is an uncommon site.##The carotid bifurcation is the commonest embolic source."},{"g":"8-9 · Transient ischemic attack","q":"Which is an uncommon site of emboli in TIA?","c":"Origin of the common carotid artery","w":["Bifurcation of the common carotid","Bifurcation of the internal carotid","Siphon within the cavernous sinus"],"e":"The origin of the common carotid artery is an uncommon site.","d":"The origin of the common carotid artery is an uncommon site. Other sites include dissection of the internal carotid and the cavernous siphon.##The common carotid origin is an uncommon embolic site."},{"g":"8-9 · Transient ischemic attack","q":"Which deficit is a common TIA presentation?","c":"Hemianopia","w":["Anosmia","Complete deafness","Pupillary light-near dissociation"],"e":"Common deficits include hemiparesis, hemisensory loss, aphasia, confusion, hemianopia, ataxia, and vertigo.","d":"Common deficits include hemiparesis, hemisensory loss, aphasia, confusion, hemianopia, ataxia, and vertigo. Visual field loss follows ischemia of the visual pathway.##Hemianopia is a recognized TIA deficit."},{"g":"8-9 · Transient ischemic attack","q":"Which language deficit may occur in TIA?","c":"Aphasia","w":["Hyposmia","Anisocoria","Proptosis"],"e":"Aphasia is one of the common deficits.","d":"Aphasia is one of the common deficits. Aphasia reflects ischemia of the language cortex.##Aphasia can occur in a TIA."},{"g":"8-9 · Transient ischemic attack","q":"Into which arteries does the internal carotid bifurcate?","c":"Anterior and middle cerebral arteries","w":["Basilar and vertebral arteries","Facial and lingual arteries","Posterior cerebral and cerebellar arteries"],"e":"The internal carotid bifurcates into the anterior and middle cerebral arteries, a site for atheroma.","d":"The internal carotid bifurcates into the anterior and middle cerebral arteries, a site for atheroma. Emboli lodging here affect large cerebral territories.##The internal carotid bifurcates into anterior and middle cerebral arteries."},{"g":"8-9 · Transient ischemic attack","q":"How does a TIA differ from a stroke?","c":"The deficit resolves within 24 hours","w":["It is always hemorrhagic","It always causes infarction","It is always bilateral"],"e":"A TIA is a focal ischemic episode lasting less than 24 hours.","d":"A TIA is a focal ischemic episode lasting less than 24 hours. A stroke lasts longer than 24 hours.##Duration under 24 hours separates TIA from stroke."},{"g":"8-10 · Stroke","q":"How long does a stroke deficit last?","c":"More than 24 hours","w":["Less than 24 hours","Less than 15 minutes","Less than 1 hour"],"e":"A stroke is a localized brain injury from a vascular episode that lasts more than 24 hours.","d":"A stroke is a localized brain injury from a vascular episode that lasts more than 24 hours. A TIA lasts less than 24 hours.##Stroke lasts more than 24 hours."},{"g":"8-10 · Stroke","q":"Into which two types is stroke classified?","c":"Ischemic and hemorrhagic","w":["Venous and lymphatic","Embolic and traumatic","Epidural and subdural"],"e":"Stroke is classified as ischemic or hemorrhagic.","d":"Stroke is classified as ischemic or hemorrhagic. Ischemic stroke results from infarction, and hemorrhagic stroke from vessel rupture.##Strokes are ischemic or hemorrhagic."},{"g":"8-10 · Stroke","q":"What proportion of strokes are ischemic?","c":"70% to 80%","w":["10% to 20%","30% to 40%","95% to 100%"],"e":"Ischemic strokes account for 70% to 80%.","d":"Ischemic strokes account for 70% to 80%. Hemorrhagic stroke makes up the remainder.##Most strokes are ischemic."},{"g":"8-10 · Stroke","q":"What are the usual causes of ischemic stroke?","c":"Atherosclerosis of vessels or underlying heart disease","w":["Bridging vein tears","Leaking CSF","Skull fractures"],"e":"Ischemic stroke is thrombotic or embolic, from atherosclerosis of extracranial (usually carotid) and intracranial arteries or from heart disease.","d":"Ischemic stroke is thrombotic or embolic, from atherosclerosis of extracranial (usually carotid) and intracranial arteries or from heart disease. Thrombotic and embolic infarction are the two mechanisms.##Atherosclerosis and heart disease underlie ischemic stroke."},{"g":"8-10 · Stroke","q":"What happens in a hemorrhagic stroke?","c":"A weakened cerebral vessel ruptures","w":["A vessel is blocked by a clot","The venous sinus collapses","CSF absorption fails"],"e":"A cerebral vessel weakens and ruptures, causing intracranial bleeding.","d":"A cerebral vessel weakens and ruptures, causing intracranial bleeding. It usually affects a larger brain area than ischemic stroke.##Hemorrhagic stroke is vessel rupture."},{"g":"8-10 · Stroke","q":"Which are examples of hemorrhagic stroke?","c":"Subarachnoid or intracerebral hemorrhage","w":["Thrombosis and embolism","Border zone infarction","Lacunar infarction"],"e":"Hemorrhagic stroke includes subarachnoid and intracerebral hemorrhage.","d":"Hemorrhagic stroke includes subarachnoid and intracerebral hemorrhage. Hypertensive intracerebral hemorrhage and ruptured aneurysm are the illustrated examples.##Subarachnoid and intracerebral hemorrhage are hemorrhagic strokes."},{"g":"8-10 · Stroke","q":"What causes border zone infarcts?","c":"Hypotension and poor perfusion without occlusion","w":["A clot from the heart","Rupture of an aneurysm","A carotid dissection"],"e":"Hypotension and poor cerebral perfusion cause border zone infarcts with no vascular occlusion.","d":"Hypotension and poor cerebral perfusion cause border zone infarcts with no vascular occlusion. These lie between arterial territories.##Border zone infarcts result from hypoperfusion."},{"g":"8-10 · Stroke","q":"What is the source of an embolic infarct?","c":"A clot fragment from the heart or proximal artery","w":["A torn bridging vein","A ruptured berry aneurysm","A tumor of the pituitary"],"e":"A clot fragment is carried from the heart or a more proximal artery.","d":"A clot fragment is carried from the heart or a more proximal artery. The fragment lodges in a distal cerebral vessel.##Emboli arise from the heart or proximal arteries."},{"g":"8-10 · Stroke","q":"How can carotid thrombosis cause infarction?","c":"The clot extends directly to the middle cerebral artery","w":["It ruptures the dura","It compresses CN III","It closes the foramen magnum"],"e":"A clot in the carotid artery extends directly to the middle cerebral artery.","d":"A clot in the carotid artery extends directly to the middle cerebral artery. This produces a thrombotic infarct in the middle cerebral territory.##Carotid thrombus can extend into the middle cerebral artery."},{"g":"8-10 · Stroke","q":"Which stroke type usually affects a larger brain area?","c":"Hemorrhagic","w":["Ischemic","Border zone","Lacunar"],"e":"Hemorrhagic stroke usually affects a larger brain area.","d":"Hemorrhagic stroke usually affects a larger brain area. Bleeding spreads through tissue and raises pressure.##Hemorrhagic strokes tend to be larger."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"What often causes a carotid–cavernous sinus fistula?","c":"Trauma","w":["Infection of the middle ear","Vitamin deficiency","Meningioma growth"],"e":"These fistulas often result from trauma.","d":"These fistulas often result from trauma. Rupture of the internal carotid artery into the cavernous sinus creates the fistula.##Trauma is a common cause."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"In whom are carotid–cavernous fistulas more common?","c":"Men","w":["Women","Children only","Elderly women only"],"e":"They are more common in men.","d":"They are more common in men. This relates to the association with trauma.##They are more common in men."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"What is the hemodynamic nature of the lesion?","c":"High-pressure, low-flow","w":["Low-pressure, high-flow","Low-pressure, low-flow","High-pressure, high-flow"],"e":"These are high-pressure (arterial), low-flow lesions.","d":"These are high-pressure (arterial), low-flow lesions. Arterial blood enters the venous cavernous sinus.##The lesion is high-pressure and low-flow."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which sound is heard over the orbit?","c":"Orbital bruit","w":["Pericardial rub","Tracheal stridor","Carotid click"],"e":"An orbital bruit is characteristic.","d":"An orbital bruit is characteristic. It is obliterated by carotid compression.##An orbital bruit is characteristic."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which eye finding is characteristic?","c":"Pulsating exophthalmos","w":["Enophthalmos","Hyphema","Ptosis only"],"e":"Exophthalmos is a key sign, and it pulsates with the arterial flow.","d":"Exophthalmos is a key sign, and it pulsates with the arterial flow. Dilated ophthalmic veins push the eye forward.##Pulsating exophthalmos is typical."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which conjunctival sign occurs?","c":"Chemosis","w":["Hyphema","Pterygium","Cataract"],"e":"Chemosis, swelling of the conjunctiva, is a feature.","d":"Chemosis, swelling of the conjunctiva, is a feature. It reflects venous congestion of the orbit.##Chemosis accompanies the fistula."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which cranial nerves show palsy?","c":"III, IV, and VI","w":["I, II, and VII","V, IX, and X","VIII, XI, and XII"],"e":"Extraocular muscle palsy involves CN III, IV, and VI.","d":"Extraocular muscle palsy involves CN III, IV, and VI. These nerves run in or near the cavernous sinus.##CN III, IV, and VI are affected."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"What obliterates the bruit?","c":"Carotid compression","w":["Jugular compression","Eye closure","Neck extension"],"e":"The bruit is obliterated by carotid compression.","d":"The bruit is obliterated by carotid compression. Compression reduces arterial flow into the fistula.##Carotid compression stops the bruit."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which veins are greatly dilated?","c":"Superior and inferior ophthalmic veins","w":["Internal jugular veins","Vertebral veins","Great cerebral vein"],"e":"The superior and inferior ophthalmic veins are greatly dilated.","d":"The superior and inferior ophthalmic veins are greatly dilated. They connect to the cavernous sinus and the facial vein.##Ophthalmic veins dilate."},{"g":"8-11 · Carotid–cavernous sinus fistula","q":"Which venous plexus receives drainage from the cavernous sinus?","c":"Pterygoid plexus","w":["Pampiniform plexus","Pharyngeal plexus","Brachial plexus"],"e":"The sinus connects with the ophthalmic veins and the pterygoid plexus in the infratemporal region.","d":"The sinus connects with the ophthalmic veins and the pterygoid plexus in the infratemporal region. It also connects to other dural venous sinuses.##The cavernous sinus drains via several routes, including the pterygoid plexus."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"When are collateral routes more likely to develop?","c":"When occlusion is gradual","w":["When occlusion is acute","When occlusion is embolic","When occlusion is traumatic"],"e":"Collateral routes are more likely when occlusion is gradual, as in atherosclerosis.","d":"Collateral routes are more likely when occlusion is gradual, as in atherosclerosis. Acute embolic obstruction leaves little time for collaterals.##Gradual occlusion favors collateral flow."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which type of occlusion is least likely to allow collaterals?","c":"Acute embolic obstruction","w":["Gradual atherosclerosis","Slow stenosis","Progressive narrowing"],"e":"Collaterals are less likely with acute embolic obstruction.","d":"Collaterals are less likely with acute embolic obstruction. There is no time for vessels to enlarge.##Embolic blockage gives poor collateral development."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which vessel carries reversed flow in extracranial collaterals?","c":"Ophthalmic artery","w":["Basilar artery","Anterior spinal artery","Middle meningeal artery only"],"e":"Flow may reverse through the ophthalmic artery.","d":"Flow may reverse through the ophthalmic artery. External carotid branches feed it and supply the internal carotid territory.##The ophthalmic artery can reverse flow."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which flow source is anterior circulation collateral?","c":"Opposite internal carotid artery","w":["Vertebral artery","Basilar artery","External jugular vein"],"e":"Circulation can be maintained from the opposite internal carotid artery.","d":"Circulation can be maintained from the opposite internal carotid artery. It crosses via the anterior communicating artery.##The opposite ICA supplies collateral flow."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which vessel links the two anterior cerebral arteries?","c":"Anterior communicating artery","w":["Posterior communicating artery","Basilar artery","Ophthalmic artery"],"e":"The anterior communicating artery connects them within the circle of Willis.","d":"The anterior communicating artery connects them within the circle of Willis. This allows crossover from the opposite carotid.##The anterior communicating artery permits crossflow."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which system supplies posterior circulation collateral flow?","c":"Vertebrobasilar system","w":["External jugular system","Subclavian vein","Azygos system"],"e":"Circulation can be maintained from the vertebrobasilar system.","d":"Circulation can be maintained from the vertebrobasilar system. It reaches the carotid territory via the posterior communicating artery.##The vertebrobasilar system supplies collaterals."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which vessel connects the posterior cerebral and internal carotid arteries?","c":"Posterior communicating artery","w":["Anterior communicating artery","Ophthalmic artery","Lacrimal artery"],"e":"The posterior communicating artery joins them in the circle of Willis.","d":"The posterior communicating artery joins them in the circle of Willis. It allows basilar flow to reach the carotid territory.##The posterior communicating artery links posterior and anterior circulations."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which external carotid branch connects with the ophthalmic via the angular artery?","c":"Facial artery","w":["Occipital artery","Common carotid artery","Vertebral artery"],"e":"The angular artery arises from the facial artery.","d":"The angular artery arises from the facial artery. It anastomoses with ophthalmic branches near the medial eye.##The facial artery supplies an angular collateral route."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"What may reduce potential collateral flow?","c":"Anomalous insufficiency of circle of Willis segments","w":["Excess external carotid size","Increased venous drainage","Enlarged ophthalmic vein"],"e":"Potential collateral flow may be reduced by anomalous insufficiency of segments of the circle of Willis.","d":"Potential collateral flow may be reduced by anomalous insufficiency of segments of the circle of Willis. Hypoplastic communicating arteries limit crossflow.##Circle of Willis anomalies limit collaterals."},{"g":"8-12 · Collateral circulation after ICA occlusion","q":"Which artery is occluded in this focus?","c":"Internal carotid artery","w":["Basilar artery","Vertebral artery","Facial artery"],"e":"The focus concerns occlusion of the internal carotid artery.","d":"The focus concerns occlusion of the internal carotid artery. Extracranial and intracranial anastomoses offer alternate routes.##The focus is internal carotid occlusion."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"What causes vascular dementia?","c":"Anoxic damage from small infarcts","w":["Prion accumulation","HIV infection of neurons","Chronic alcohol toxicity"],"e":"Vascular dementias are caused by anoxic damage from small infarcts.","d":"Vascular dementias are caused by anoxic damage from small infarcts. Scattered cortical and subcortical infarcts accumulate.##Small infarcts cause vascular dementia."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"What share of dementia cases is vascular?","c":"About 15% to 20%","w":["About 1% to 2%","About 40% to 50%","About 80% to 90%"],"e":"Vascular dementia accounts for about 15% to 20% of cases.","d":"Vascular dementia accounts for about 15% to 20% of cases. Degenerative dementias account for most of the rest.##Vascular dementia is about 15% to 20%."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which condition is associated with multiinfarct dementia?","c":"Hypertension","w":["Hypothyroidism","Anemia only","Vitamin C excess"],"e":"It is associated with heart disease, diabetes, hypertension, and inflammatory diseases.","d":"It is associated with heart disease, diabetes, hypertension, and inflammatory diseases. Patients often have stroke risk factors.##Hypertension is a risk factor."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which feature defines dementia?","c":"Short-term memory impairment, behavioral disturbance, or functional difficulty","w":["Isolated hearing loss","Transient syncope","Isolated headache"],"e":"Dementia includes short-term memory impairment, behavioral disturbance, and difficulties with daily functioning and independence.","d":"Dementia includes short-term memory impairment, behavioral disturbance, and difficulties with daily functioning and independence. It is an acquired neurologic syndrome with multiple cognitive deficits.##Dementia is multiple acquired cognitive deficits."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which is a way to classify dementia?","c":"Degenerative, vascular, alcoholic, or HIV-related","w":["Bacterial, viral, or fungal","Cortical or peripheral","Acute or congenital"],"e":"Dementia can be degenerative, vascular, alcoholic, or HIV related.","d":"Dementia can be degenerative, vascular, alcoholic, or HIV related. Vascular dementia is one subtype.##Dementia types include degenerative, vascular, alcoholic, and HIV related."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"What is usually required for dementia to develop?","c":"Bilateral infarcts","w":["A single unilateral infarct","A pituitary tumor","A skull fracture"],"e":"Bilateral infarcts are usually required.","d":"Bilateral infarcts are usually required. A small unilateral infarct rarely causes dementia.##Bilateral infarcts are usually required."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which infarcts cause subcortical dementia?","c":"Subcortical (lacunar) infarcts","w":["Cortical infarcts","Border zone infarcts only","Cerebellar infarcts"],"e":"Subcortical (lacunar) infarcts cause signs and symptoms of subcortical dementia.","d":"Subcortical (lacunar) infarcts cause signs and symptoms of subcortical dementia. They result from arteriolar disease of deep small vessels.##Lacunar infarcts cause subcortical dementia."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"What do cortical infarcts produce?","c":"Focal signs related to the cortical area","w":["Only memory loss","Only urinary signs","No symptoms"],"e":"Cortical infarcts may cause focal signs and symptoms related to the area of cortex involved.","d":"Cortical infarcts may cause focal signs and symptoms related to the area of cortex involved. Their effects depend on location.##Cortical infarcts cause focal signs."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which findings may accompany vascular dementia?","c":"Hyperreflexia, hemiparesis, urinary urgency","w":["Hyporeflexia and anosmia","Ptosis and miosis","Hearing loss and tinnitus"],"e":"Findings include hyperreflexia, hemiparesis, and urinary frequency or urgency.","d":"Findings include hyperreflexia, hemiparesis, and urinary frequency or urgency. Focal neurologic signs support a vascular cause.##Focal signs and urinary symptoms suggest vascular dementia."},{"g":"8-13 · Vascular (multiinfarct) dementia","q":"Which vascular disease patterns cause multiple occlusions?","c":"Large-, medium-, and small-vessel cerebrovascular disease","w":["Venous sinus compression only","Lymphatic obstruction","Optic nerve compression"],"e":"Cerebrovascular disease causes multiple occlusions in the cerebral vascular tree, with scattered cortical and subcortical infarcts.","d":"Cerebrovascular disease causes multiple occlusions in the cerebral vascular tree, with scattered cortical and subcortical infarcts. Extracranial large-vessel, intracranial medium-vessel, and arteriolar disease all contribute.##Multiple vessel occlusions cause scattered infarcts."},{"g":"8-14 · Brain tumors","q":"What determines the signs of a brain tumor?","c":"Its location and the degree of ICP elevation","w":["Only patient age","Only the tumor color","Only skull thickness"],"e":"Signs depend on location and the degree to which ICP is elevated.","d":"Signs depend on location and the degree to which ICP is elevated. Small tumors in key areas cause deficits, whereas silent areas may hide large tumors.##Location and ICP determine symptoms."},{"g":"8-14 · Brain tumors","q":"Which area is relatively silent for slow-growing tumors?","c":"Frontal lobes","w":["Brainstem","Occipital pole only","Hypothalamus"],"e":"Slow-growing tumors in relatively silent areas such as the frontal lobes may go undetected and become large.","d":"Slow-growing tumors in relatively silent areas such as the frontal lobes may go undetected and become large. Symptoms appear only after considerable growth.##Frontal tumors can be silent for long."},{"g":"8-14 · Brain tumors","q":"Which is an early symptom of increased ICP?","c":"Papilledema","w":["Anosmia","Hearing loss","Facial flushing"],"e":"Early symptoms include malaise, headache, nausea, and papilledema.","d":"Early symptoms include malaise, headache, nausea, and papilledema. Abducens palsy and Parinaud’s syndrome occur less often.##Papilledema is an early sign of raised ICP."},{"g":"8-14 · Brain tumors","q":"Which are classic signs of hydrocephalus?","c":"Loss of upward gaze and the “setting sun” sign","w":["Loss of downward gaze only","Complete ptosis","Facial paralysis"],"e":"Classic signs include loss of upward gaze, downward ocular deviation, lid retraction, and light-near dissociation.","d":"Classic signs include loss of upward gaze, downward ocular deviation, lid retraction, and light-near dissociation. They reflect dorsal midbrain compression.##Loss of upward gaze and setting-sun sign are classic."},{"g":"8-14 · Brain tumors","q":"What is the most malignant glioma?","c":"Glioblastoma multiforme","w":["Meningioma","Acoustic neuroma","Pituitary adenoma"],"e":"Glioblastoma multiforme is the most malignant form in the astrocytic series.","d":"Glioblastoma multiforme is the most malignant form in the astrocytic series. Gliomas arise from astrocytes or oligodendrocytes.##Glioblastoma multiforme is the most malignant glioma."},{"g":"8-14 · Brain tumors","q":"From which cells do gliomas arise?","c":"Astrocytes or oligodendrocytes","w":["Arachnoid cells","Schwann cells","Pituitary cells"],"e":"Gliomas arise from astrocytes or oligodendrocytes.","d":"Gliomas arise from astrocytes or oligodendrocytes. They are primary intrinsic brain tumors.##Gliomas arise from glial cells."},{"g":"8-14 · Brain tumors","q":"From which layer do meningiomas arise?","c":"Arachnoid mater","w":["Pia mater","Periosteal dura","Ependyma"],"e":"Meningiomas arise from the arachnoid mater and can extend into the brain.","d":"Meningiomas arise from the arachnoid mater and can extend into the brain. They may invade dural sinuses such as the superior sagittal sinus.##Meningiomas arise from arachnoid."},{"g":"8-14 · Brain tumors","q":"Which nerves can pituitary tumors affect?","c":"CN II, III, IV, V1, V2, and VI","w":["CN VII, IX, and X","CN XI and XII","CN I only"],"e":"Pituitary tumors expand in the sella turcica and affect CN II, III, IV, V1, V2, and VI.","d":"Pituitary tumors expand in the sella turcica and affect CN II, III, IV, V1, V2, and VI. They account for about 15% of primary tumors.##Pituitary tumors affect nearby cranial nerves."},{"g":"8-14 · Brain tumors","q":"What is an acoustic neuroma?","c":"A benign tumor of CN VIII","w":["A malignant glioma","A tumor of CN VII only","A tumor of the pituitary"],"e":"An acoustic neuroma is a benign tumor of CN VIII, about 7% of primary tumors.","d":"An acoustic neuroma is a benign tumor of CN VIII, about 7% of primary tumors. It can fill the cerebellopontine angle and distort CN V, VII, VIII, IX, and X.##Acoustic neuroma is a benign CN VIII tumor."},{"g":"8-14 · Brain tumors","q":"Which pupillary finding occurs with hydrocephalus?","c":"Light-near dissociation","w":["Complete anisocoria with ptosis","Fixed constriction","Bilateral mydriasis only"],"e":"Light-near dissociation of the pupils is a classic sign.","d":"Light-near dissociation of the pupils is a classic sign. It accompanies loss of upward gaze and lid retraction.##Light-near dissociation is a hydrocephalus sign."},{"g":"8-15 · Metastatic brain tumors","q":"How common are metastatic brain tumors compared with primary tumors?","c":"More common","w":["Less common","Equally common","Extremely rare"],"e":"Metastatic brain tumors are more common than primary brain tumors.","d":"Metastatic brain tumors are more common than primary brain tumors. Many arise from lung, breast, kidney, colon, and skin.##Metastases outnumber primary tumors."},{"g":"8-15 · Metastatic brain tumors","q":"How do most metastases spread to the brain?","c":"Via the bloodstream","w":["Through CSF only","Through the optic nerve","By lymphatics to the pia"],"e":"Most spread via the bloodstream.","d":"Most spread via the bloodstream. Cells seed at the junction of white and gray matter.##Hematogenous spread is most common."},{"g":"8-15 · Metastatic brain tumors","q":"Where do metastatic cells commonly seed?","c":"Between white matter and gray matter","w":["Within the ventricles","Within the dura","In the pineal gland only"],"e":"Cells seed between the white matter fiber tracts and gray matter cortical neurons.","d":"Cells seed between the white matter fiber tracts and gray matter cortical neurons. The junction has narrow vessels that trap emboli.##Metastases lodge at the gray–white junction."},{"g":"8-15 · Metastatic brain tumors","q":"Which venous plexus can carry metastases from other regions?","c":"Batson’s vertebral venous plexus","w":["Pterygoid plexus","Pampiniform plexus","Pharyngeal plexus"],"e":"Some tumors metastasize through Batson’s vertebral venous plexus.","d":"Some tumors metastasize through Batson’s vertebral venous plexus. This valveless plexus allows flow to the skull.##Batson’s plexus is a metastatic pathway."},{"g":"8-15 · Metastatic brain tumors","q":"What is the frequency of headache in metastatic brain tumors?","c":"About 50%","w":["About 5%","About 25%","About 95%"],"e":"Headache occurs in about 50%.","d":"Headache occurs in about 50%. Seizures are less common.##Headache occurs in about half."},{"g":"8-15 · Metastatic brain tumors","q":"What is the frequency of seizures in metastatic brain tumors?","c":"About 25%","w":["About 50%","About 5%","About 90%"],"e":"Seizures occur in about 25%.","d":"Seizures occur in about 25%. Elevated ICP is also common.##Seizures occur in about a quarter."},{"g":"8-15 · Metastatic brain tumors","q":"Which is a common primary source of brain metastases?","c":"Melanoma","w":["Lipoma","Uterine leiomyoma","Benign osteoma"],"e":"Common primary sources include lung, breast, kidney, colon, and melanoma.","d":"Common primary sources include lung, breast, kidney, colon, and melanoma. Melanoma may arise from skin or mucous membranes.##Melanoma often metastasizes to the brain."},{"g":"8-15 · Metastatic brain tumors","q":"Which organ is a common primary source of brain metastases?","c":"Lung","w":["Spleen","Skeletal muscle","Cornea"],"e":"Lung is among the common primary sources.","d":"Lung is among the common primary sources. Others are breast, kidney, and colon.##Lung is a common source."},{"g":"8-15 · Metastatic brain tumors","q":"Which tumors can spread directly to the brain?","c":"Head and neck cancers","w":["Only gastric cancers","Only bone benign tumors","Only meningiomas"],"e":"Some tumors metastasize directly from head and neck cancers.","d":"Some tumors metastasize directly from head and neck cancers. Some also spread via Batson’s plexus.##Head and neck cancers can spread directly."},{"g":"8-15 · Metastatic brain tumors","q":"What does the illustrated cerebellar metastasis come from?","c":"Cutaneous melanoma","w":["Colon carcinoma","Kidney carcinoma","Breast carcinoma"],"e":"The illustration shows a cerebellar metastasis of cutaneous melanoma.","d":"The illustration shows a cerebellar metastasis of cutaneous melanoma. Melanoma can also arise from mucous membranes.##Cutaneous melanoma can metastasize to the cerebellum."},{"g":"8-16 · Trigeminal neuralgia","q":"What is the pain character in trigeminal neuralgia?","c":"Brief, lancinating, burning","w":["Dull, constant ache","Throbbing with visual aura","Pain only at night"],"e":"Recurrent, lancinating, burning pain in short intense episodes.","d":"Trigeminal neuralgia presents with recurrent, brief, lancinating or burning paroxysms of intense unilateral facial pain. The patient winces, which produces the facial tic that gives tic douloureux its name. A constant dull ache, migraine-type throbbing with aura, and pain only at night describe other headache or facial pain syndromes.##Brief electric-shock facial pain in the V2/V3 territory is trigeminal neuralgia."},{"g":"8-16 · Trigeminal neuralgia","q":"Which divisions does it usually affect?","c":"V2 or V3, unilaterally","w":["V1 only","All three, bilaterally","The motor root of V"],"e":"Usually V2 or V3 on one side.","d":"Pain follows the sensory territory of CN V, most often V2 (maxillary) or V3 (mandibular) on one side. V1 is involved in fewer than 6% of cases. Pain in all three divisions bilaterally is atypical, and the motor root of V carries no pain fibers.##Usually unilateral V2 or V3; V1 is rare (under 6%)."},{"g":"8-16 · Trigeminal neuralgia","q":"What fraction of cases involve V1?","c":"Less than 6%","w":["About 25%","About 50%","Over 75%"],"e":"V1 is involved in fewer than 6%.","d":"Only about 6% of cases involve the ophthalmic division (V1); the large majority affect V2 or V3. Figures of 25%, 50% or over 75% would greatly overstate V1 involvement.##V1 involvement is under 6%."},{"g":"8-16 · Trigeminal neuralgia","q":"Typical age at presentation?","c":"Older than 50","w":["Under 10","20 to 30","Neonatal"],"e":"Usually people older than 50.","d":"Trigeminal neuralgia usually begins after age 50, when vascular compression of the nerve becomes more likely. It is uncommon in children, young adults and neonates, in whom other causes of facial pain should be sought.##The typical patient is older than 50."},{"g":"8-16 · Trigeminal neuralgia","q":"Why does the patient develop a facial tic?","c":"Wincing from the intense pain","w":["Motor nucleus lesion","Facial nerve irritation","Focal seizure"],"e":"The pain makes the patient wince, producing a facial muscle tic.","d":"The tic is a reflex wince from the severe pain, not a motor lesion. A motor nucleus lesion, facial nerve irritation (as in hemifacial spasm) and focal seizures are not the mechanism.##Wincing from pain produces the facial muscle tic."},{"g":"8-16 · Trigeminal neuralgia","q":"Proposed etiology?","c":"Vascular compression of the trigeminal ganglion","w":["VZV reactivation","Orbital floor fracture","Geniculate ganglion infection"],"e":"Etiology is uncertain, but vascular compression is suspected.","d":"The favored mechanism is vascular compression of the trigeminal sensory ganglion or root by the superior cerebellar artery, although the cause is officially uncertain. VZV reactivation causes herpes zoster, orbital floor fracture causes a blow-out injury, and geniculate ganglion infection involves CN VII.##Suspect vascular compression by the superior cerebellar artery."},{"g":"8-16 · Trigeminal neuralgia","q":"Which are the classic triggers?","c":"Touch and a draft of cool air","w":["Bright light","Loud noise","Lying flat"],"e":"Trigger points on the face respond to touch and cool air.","d":"Attacks are triggered by light touch (shaving, brushing teeth, washing) and by a draft of cool air at trigger points on the face. Bright light, loud noise and lying flat do not trigger attacks.##Touch and cool air trigger the pain."},{"g":"8-16 · Trigeminal neuralgia","q":"Which artery is implicated?","c":"Superior cerebellar","w":["Anterior cerebral","Middle meningeal","Facial"],"e":"The superior cerebellar artery compresses the sensory ganglion.","d":"The superior cerebellar artery is the vessel most often found compressing the trigeminal root or ganglion. The anterior cerebral, middle meningeal and facial arteries do not lie against the trigeminal ganglion.##Superior cerebellar artery compression."},{"g":"8-16 · Trigeminal neuralgia","q":"Which zone-to-division pairing is correct?","c":"Maxillary zone = V2","w":["Ophthalmic zone = V3","Mandibular zone = V2","Maxillary zone = V1"],"e":"Ophthalmic V1, maxillary V2, mandibular V3.","d":"The ophthalmic zone is V1, the maxillary zone is V2 and the mandibular zone is V3. Pain over the cheek and upper lip is therefore V2, and pain over the chin and lower jaw is V3.##V1 ophthalmic, V2 maxillary, V3 mandibular."},{"g":"8-16 · Trigeminal neuralgia","q":"Another name for trigeminal neuralgia?","c":"Tic douloureux","w":["Bell’s palsy","Shingles","Hyperacusis"],"e":"Tic douloureux means painful tic.","d":"Tic douloureux literally means painful tic and is another name for trigeminal neuralgia. Bell palsy is a facial nerve palsy, shingles is herpes zoster, and hyperacusis is sound sensitivity from stapedius paralysis.##Tic douloureux equals trigeminal neuralgia."},{"g":"8-17 · Herpes zoster","q":"Herpes zoster is the most common infection of which system?","c":"Peripheral nervous system","w":["Central nervous system","Respiratory tract","Urinary tract"],"e":"It is the most common PNS infection.","d":"Herpes zoster is the most common infection of the peripheral nervous system. It is not primarily a CNS, respiratory or urinary tract infection.##Shingles is the commonest PNS infection."},{"g":"8-17 · Herpes zoster","q":"What causes it?","c":"Reactivation of varicella-zoster virus","w":["Primary HSV-1 infection","EBV","Bacterial toxin"],"e":"Reactivation of the chickenpox virus.","d":"Shingles results from reactivation of latent varicella-zoster virus, the chickenpox virus. Primary HSV-1 infection, EBV and bacterial toxins do not reactivate in sensory ganglia to cause a dermatomal rash.##VZV reactivation causes zoster."},{"g":"8-17 · Herpes zoster","q":"Where does the virus lie dormant?","c":"Posterior root or sensory ganglion","w":["Anterior horn","Motor end plate","Sympathetic chain only"],"e":"Dormant in sensory ganglia.","d":"After chickenpox, VZV stays latent in posterior (dorsal) root and cranial sensory ganglia, not in the anterior horn, motor end plate or sympathetic chain. Reactivation then travels along that nerve to its dermatome.##Latent virus sits in sensory ganglia."},{"g":"8-17 · Herpes zoster","q":"How long after the initial pain do vesicles appear?","c":"72 to 96 hours","w":["About 6 hours","1 to 2 weeks","One month"],"e":"Pain first, vesicles at 72 to 96 hours.","d":"Intense burning, localized pain comes first, and vesicles appear about 72 to 96 hours (3 to 4 days) later, which is why early zoster can be misdiagnosed. Six hours is too short, and one to four weeks is too long.##Pain precedes the rash by 3 to 4 days."},{"g":"8-17 · Herpes zoster","q":"Approximate prevalence?","c":"0.5% of the population","w":["5%","25%","50%"],"e":"About 0.5%.","d":"About 0.5% of the population is affected. Rates of 5%, 25% or 50% are far too high.##Prevalence is about 0.5%."},{"g":"8-17 · Herpes zoster","q":"Which dermatomes are usually involved?","c":"T5 to L2","w":["C1 to C4","L3 to S5","T1 only"],"e":"One or several contiguous unilateral dermatomes, T5 to L2.","d":"Thoracic and upper lumbar dermatomes (T5 to L2) are most often involved, usually one or a few contiguous dermatomes on one side. C1 to C4, L3 to S5 and T1 alone are not the typical sites.##Usual dermatomes are T5 to L2, unilateral."},{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN V is affected?","c":"Semilunar","w":["Geniculate","Ciliary","Otic"],"e":"The semilunar (trigeminal) ganglion.","d":"Zoster of CN V arises from the semilunar (trigeminal, Gasserian) ganglion. The geniculate ganglion belongs to CN VII, and the ciliary and otic ganglia are parasympathetic.##Semilunar ganglion equals CN V."},{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN VII is affected?","c":"Geniculate","w":["Semilunar","Superior cervical","Spiral"],"e":"The geniculate ganglion.","d":"Zoster of CN VII arises from the geniculate ganglion, as in Ramsay Hunt syndrome. The semilunar ganglion belongs to CN V, the superior cervical ganglion is sympathetic, and the spiral ganglion belongs to CN VIII.##Geniculate ganglion equals CN VII."},{"g":"8-17 · Herpes zoster","q":"What is the rash distribution?","c":"Unilateral, confined to a dermatome","w":["Bilateral across the midline","Generalized","Palms and soles only"],"e":"Confined to one radicular or cranial nerve distribution.","d":"The rash is unilateral and confined to a single dermatome or cranial nerve distribution. It does not cross the midline, spread diffusely, or localize only to the palms and soles.##Unilateral dermatomal rash."},{"g":"8-17 · Herpes zoster","q":"What is the initial symptom?","c":"Intense burning, localized pain","w":["Painless rash","Hearing loss","Diplopia"],"e":"Burning pain precedes the vesicles.","d":"The prodrome is intense burning, localized pain before the vesicles appear. A painless rash, hearing loss and diplopia are not the initial symptoms.##Pain first, then vesicles."},{"g":"8-18 · Bell’s palsy","q":"Most common cause of facial muscle weakness and cranial neuropathy?","c":"Acute unilateral idiopathic facial palsy","w":["Stroke","Acoustic neuroma","Parotid tumor"],"e":"That is Bell’s palsy.","d":"Acute unilateral idiopathic facial palsy (Bell palsy) is the commonest cause of facial muscle weakness and cranial neuropathy. Stroke, acoustic neuroma and parotid tumor are less common causes.##Bell palsy is the most common facial palsy."},{"g":"8-18 · Bell’s palsy","q":"Which virus can cause facial nerve palsy?","c":"Herpes simplex virus","w":["Hepatitis B virus","Rabies virus","HIV only"],"e":"HSV is a recognized cause.","d":"Herpes simplex virus is a recognized cause of facial nerve palsy. Hepatitis B, rabies and HIV alone are not classically linked to Bell palsy.##HSV can cause facial palsy."},{"g":"8-18 · Bell’s palsy","q":"A lesion at the internal acoustic meatus adds which feature?","c":"Deafness from CN VIII","w":["Pain behind the ear","Taste loss only","Nothing extra"],"e":"CN VIII runs with CN VII there.","d":"A lesion at the internal acoustic meatus also involves CN VIII, which runs beside CN VII, so deafness is added to all features of the lower sites. Ear pain belongs to the geniculate site and taste loss to the facial canal.##Deafness points to the most proximal lesion."},{"g":"8-18 · Bell’s palsy","q":"A lesion at the geniculate ganglion adds which feature?","c":"Pain behind the ear","w":["Deafness","Parotid swelling","Nothing extra"],"e":"Ear pain, with possible herpes of tympanum and meatus.","d":"Geniculate ganglion lesions add pain behind the ear (and possible herpetic lesions of the tympanum and external meatus) to all lower-site features. Deafness arises only at the meatus, and parotid swelling is not a feature.##A geniculate lesion adds ear pain."},{"g":"8-18 · Bell’s palsy","q":"Chorda tympani involvement causes?","c":"Loss of anterior tongue taste and less salivation","w":["Hyperacusis","Deafness","Inability to close the eye only"],"e":"Taste from the anterior tongue and salivation.","d":"The chorda tympani carries taste from the anterior two thirds of the tongue and secretomotor fibers to the submandibular and sublingual glands, so injury causes taste loss and reduced salivation. Hyperacusis is a stapedius effect and deafness a CN VIII effect.##Chorda tympani carries anterior taste and salivation."},{"g":"8-18 · Bell’s palsy","q":"Hyperacusis results from loss of which muscle’s function?","c":"Stapedius","w":["Tensor tympani","Buccinator","Masseter"],"e":"The nerve to stapedius is affected in the facial canal.","d":"The nerve to stapedius dampens loud sounds; when it is paralyzed, sound becomes painfully loud (hyperacusis). The tensor tympani is supplied by CN V, the buccinator moves the cheek, and the masseter closes the jaw.##Stapedius paralysis causes hyperacusis."},{"g":"8-18 · Bell’s palsy","q":"Facial paralysis, anterior taste loss, hyperacusis, normal hearing, no ear pain. Lesion site?","c":"Facial canal","w":["Internal acoustic meatus","Geniculate ganglion","Below the stylomastoid foramen"],"e":"Site 3 has taste loss and hyperacusis but not ear pain or deafness.","d":"Facial paralysis with taste loss and hyperacusis but no deafness or ear pain places the lesion in the facial canal (site 3). Site 2 would add ear pain, site 1 would add deafness, and site 4 would spare taste and hearing.##Site 3 gives taste loss plus hyperacusis."},{"g":"8-18 · Bell’s palsy","q":"Why does food collect between teeth and cheek below the stylomastoid foramen?","c":"Buccinator paralysis","w":["Masseter paralysis","Tongue weakness","Loss of taste"],"e":"The buccinator is paralyzed.","d":"Buccinator paralysis lets food pool between the teeth and cheek on the affected side. The masseter and temporalis close the jaw, and taste loss does not cause food pooling.##Buccinator weakness traps food."},{"g":"8-18 · Bell’s palsy","q":"What is Bell’s phenomenon?","c":"Eye rolls upward on attempted closure, exposing sclera","w":["Tongue deviates to the lesion side","Uvula deviates","Pupil constricts"],"e":"Seen with peripheral facial weakness.","d":"Bell phenomenon is the upward rolling of the eyeball on attempted lid closure, exposing sclera because the lid does not close. Tongue deviation is hypoglossal, uvular deviation is vagal, and pupillary constriction is the light reflex.##The eye rolls up when the lid cannot close."},{"g":"8-18 · Bell’s palsy","q":"Incomplete smile, flat nasolabial fold, forehead preserved. Which lesion?","c":"Central (UMN)","w":["Peripheral (LMN)","Geniculate ganglion","Below stylomastoid foramen"],"e":"Brow and forehead are relatively spared in central weakness.","d":"Central (upper motor neuron) lesions weaken the lower face but relatively spare the brow and forehead, because the upper face has bilateral cortical input. A peripheral lesion paralyzes the whole half of the face.##A spared forehead means a central lesion."},{"g":"8-19 · Tetanus (title inferred)","q":"What posture appears in advanced disease?","c":"Rigid opisthotonos","w":["Flaccid paralysis","Resting tremor","Fetal curling only"],"e":"Rigid, moderate opisthotonos."},{"g":"8-19 · Tetanus (title inferred)","q":"How does the abdomen feel?","c":"Boardlike","w":["Soft and distended","Scaphoid and flaccid","Normal"],"e":"The abdomen is boardlike."},{"g":"8-19 · Tetanus (title inferred)","q":"What is the arm position?","c":"Extended","w":["Flexed on the chest","Flaccid","Raised above the head"],"e":"Arms are extended."},{"g":"8-19 · Tetanus (title inferred)","q":"What life-threatening complication may occur?","c":"Respiratory arrest","w":["Hyphema","Papilledema","Glaucoma"],"e":"Respiratory arrest may occur."},{"g":"8-19 · Tetanus (title inferred)","q":"What is opisthotonos?","c":"Arching with head and heels bent backward","w":["Forward flexion","Lateral deviation","Tongue deviation"],"e":"A backward arch of the body."},{"g":"8-19 · Tetanus (title inferred)","q":"Which organism causes tetanus? (beyond the page)","c":"Clostridium tetani","w":["Clostridium difficile","Staphylococcus aureus","Bacillus cereus"],"e":"Spore-forming C. tetani."},{"g":"8-19 · Tetanus (title inferred)","q":"What does tetanospasmin block? (beyond the page)","c":"Release of inhibitory GABA and glycine","w":["ACh release","Dopamine reuptake","Sodium channels"],"e":"Loss of inhibition causes spasm."},{"g":"8-19 · Tetanus (title inferred)","q":"What is a classic early sign? (beyond the page)","c":"Trismus (lockjaw)","w":["Ptosis","Papilledema","Hyperacusis"],"e":"Jaw stiffness often comes first."},{"g":"8-19 · Tetanus (title inferred)","q":"What is risus sardonicus? (beyond the page)","c":"Sustained grin from facial spasm","w":["Facial droop","Eye rolling","Tongue deviation"],"e":"Facial muscle spasm."},{"g":"8-19 · Tetanus (title inferred)","q":"Best prevention? (beyond the page)","c":"Tetanus toxoid vaccination","w":["Antivirals","Silver nitrate","Eye lubricants"],"e":"Vaccination plus boosters."},{"g":"8-20 · Orbital blow-out","q":"Which structure fractures in a blow-out fracture?","c":"Thin orbital floor","w":["Orbital roof","Lateral wall","Nasal bone only"],"e":"The thin orbital floor."},{"g":"8-20 · Orbital blow-out","q":"What mechanism causes it?","c":"Sudden rise in intraorbital pressure","w":["Slow tumor growth","Viral infection","Penetrating dart only"],"e":"A direct blow raises intraorbital pressure."},{"g":"8-20 · Orbital blow-out","q":"Where does orbital tissue herniate?","c":"Maxillary sinus","w":["Frontal sinus","Sphenoid sinus","Middle cranial fossa"],"e":"Into the maxillary paranasal sinus."},{"g":"8-20 · Orbital blow-out","q":"What causes cheek anesthesia?","c":"Infraorbital nerve damage","w":["Facial nerve damage","Mandibular nerve damage","Lacrimal nerve damage"],"e":"The infraorbital nerve."},{"g":"8-20 · Orbital blow-out","q":"Which term describes a sunken globe?","c":"Enophthalmos","w":["Exophthalmos","Ptosis","Miosis"],"e":"Enophthalmos."},{"g":"8-20 · Orbital blow-out","q":"Why is upward gaze limited?","c":"Tissue entrapped in the fracture defect","w":["CN VII palsy","Lens dislocation","Sympathetic lesion"],"e":"Entrapment in the defect."},{"g":"8-20 · Orbital blow-out","q":"Blood in the anterior chamber is called?","c":"Hyphema","w":["Ecchymosis","Epistaxis","Chalazion"],"e":"Hyphema."},{"g":"8-20 · Orbital blow-out","q":"Which is not a listed clinical sign?","c":"Ptosis with miosis","w":["Diplopia","Infraorbital paresthesia","Enophthalmos"],"e":"Listed: diplopia, paresthesia, enophthalmos, edema, ecchymosis."},{"g":"8-20 · Orbital blow-out","q":"Which serious ocular injury can occur?","c":"Retinal detachment","w":["Pterygium","Optic neuritis only","Chalazion"],"e":"Also hyphema, dislocated lens, globe rupture."},{"g":"8-20 · Orbital blow-out","q":"Which major fracture can also cause it?","c":"Zygomaticomaxillary complex","w":["Mandibular condyle","Occipital bone","Hyoid"],"e":"Massive ZMC fractures can blow out the floor."},{"g":"8-21 · Extraocular muscles","q":"Which pattern is used to test extraocular muscle movement?","c":"An H pattern","w":["A star pattern","A circle pattern","A zigzag pattern"],"e":"The examiner traces an H with a finger."},{"g":"8-21 · Extraocular muscles","q":"Which muscle alone produces pure abduction?","c":"Lateral rectus","w":["Superior rectus","Inferior oblique","Medial rectus"],"e":"Pure abduction is done by the lateral rectus."},{"g":"8-21 · Extraocular muscles","q":"Which muscle alone produces pure adduction?","c":"Medial rectus","w":["Lateral rectus","Superior oblique","Inferior rectus"],"e":"Pure adduction is done by the medial rectus."},{"g":"8-21 · Extraocular muscles","q":"Finger held up and to the right. Which muscles work mainly?","c":"R
