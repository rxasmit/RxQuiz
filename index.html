{"g":"8-3 · Midface fractures","q":"Which structures does Le Fort II also include?","c":"Infraorbital rims and orbital floors","w":["Zygomatic arches and mandible","Sphenoid wings and clivus","Temporal bone and mastoid"],"e":"It includes the infraorbital rims, orbits and orbital floors."},
{"g":"8-3 · Midface fractures","q":"What does Le Fort III add to Le Fort II?","c":"Fracture of both zygomatic bones","w":["Fracture of the mandible","Fracture of the nasal septum only","Fracture of the hyoid"],"e":"Le Fort III includes Le Fort II plus both zygomatic bones."},
{"g":"8-3 · Midface fractures","q":"Which are complications of Le Fort III?","c":"Airway problems and CSF leakage","w":["Hearing loss and vertigo","Dysphagia and hoarseness","Ptosis and miosis"],"e":"Also nasolacrimal apparatus obstruction."},

{"g":"8-3 · Midface fractures","q":"Which bones does the midface classification cover?","c":"Maxilla, nasoorbital complex, zygomatic","w":["Mandible, hyoid, vomer","Parietal, occipital, temporal","Sphenoid, ethmoid, atlas"],"e":"Midface fractures involve the maxilla, nasoorbital complex and zygomatic bones."},
{"g":"8-3 · Midface fractures","q":"Which finding is not part of Le Fort II?","c":"Fracture through both zygomatic bones","w":["Fracture of both maxillae","Fracture of nasal bones","Fracture of infraorbital rims"],"e":"Zygomatic fractures are the added feature of Le Fort III."},

{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Monro?","c":"Interventricular foramen","w":["Cerebral aqueduct","Lateral aperture","Median aperture"],"e":"The interventricular foramina are the foramina of Monro."},
{"g":"8-4 · Hydrocephalus","q":"What is the aqueduct of Sylvius?","c":"Cerebral aqueduct","w":["Interventricular foramen","Lateral aperture","Median aperture"],"e":"The cerebral aqueduct is the aqueduct of Sylvius."},

{"g":"8-4 · Hydrocephalus","q":"What is the foramen of Magendie?","c":"Median aperture","w":["Lateral apertures","Interventricular foramina","Cerebral aqueduct"],"e":"The median aperture is the foramen of Magendie."},

{"g":"8-4 · Hydrocephalus","q":"Which is not a listed obstruction site?","c":"Foramen magnum","w":["Interventricular foramina","Cerebral aqueduct","Median aperture"],"e":"Listed: Monro, Sylvius, Luschka, Magendie."},

{"g":"8-5 · Meningitis","q":"What is meningitis?","c":"Inflammation of arachnoid and pia","w":["Inflammation of the dura only","Inflammation of the brain tissue","Inflammation of the scalp"],"e":"It is inflammation of the arachnoid mater and pia mater."},
{"g":"8-5 · Meningitis","q":"Which are aseptic causes?","c":"Viral infections and drug reactions","w":["Bacterial abscess only","Fungal sinusitis only","Parasitic cysts only"],"e":"Aseptic causes include viral infections, drug reactions and systemic diseases."},
{"g":"8-5 · Meningitis","q":"Which symptom is listed for meningitis?","c":"Painful stiff neck","w":["Hearing loss","Ptosis","Hoarseness"],"e":"Headache, fever, seizures and a painful stiff neck."},

{"g":"8-5 · Meningitis","q":"How does bacterial infection usually reach the leptomeninges?","c":"Hematogenous spread","w":["Direct nerve spread","Lymphatic spread","Swallowed organisms"],"e":"Usually hematogenous, but it may be direct."},
{"g":"8-5 · Meningitis","q":"Which sites may spread infection directly?","c":"Sinuses, middle ear, mastoid cells","w":["Kidneys and bladder","Liver and gallbladder","Knee and hip joints"],"e":"Direct spread from paranasal sinuses, middle ear and mastoid cells."},
{"g":"8-5 · Meningitis","q":"What can a cribriform plate defect cause?","c":"CSF leak and infection route","w":["Optic nerve damage only","Hearing loss only","Dry nasal mucosa"],"e":"A cribriform defect lets CSF leak and gives infection a route."},
{"g":"8-5 · Meningitis","q":"Which injury can be a source of meningitis?","c":"Basal skull fracture","w":["Wrist fracture","Rib fracture","Tibial fracture"],"e":"A basal skull fracture can open a path for infection."},
{"g":"8-5 · Meningitis","q":"Which is a listed source of infection?","c":"Mastoiditis","w":["Pyelonephritis","Cholecystitis","Appendicitis"],"e":"Listed sources include otitis media, sinusitis, mastoiditis, nasopharyngitis, pneumonia."},
{"g":"8-5 · Meningitis","q":"Which is not a listed symptom?","c":"Hearing loss","w":["Headache","Fever","Seizures"],"e":"Listed: headache, fever, seizures and a painful stiff neck."},
{"g":"8-16 · Trigeminal neuralgia","q":"What is the pain character in trigeminal neuralgia?","c":"Brief, lancinating, burning","w":["Dull, constant ache","Throbbing with visual aura","Pain only at night"],"e":"Recurrent, lancinating, burning pain in short intense episodes.","d":"Trigeminal neuralgia presents with recurrent, brief, lancinating or burning paroxysms of intense unilateral facial pain. The patient winces, which produces the facial tic that gives tic douloureux its name. A constant dull ache, migraine-type throbbing with aura, and pain only at night describe other headache or facial pain syndromes.##Brief electric-shock facial pain in the V2/V3 territory is trigeminal neuralgia."},
{"g":"8-16 · Trigeminal neuralgia","q":"Which divisions does it usually affect?","c":"V2 or V3, unilaterally","w":["V1 only","All three, bilaterally","The motor root of V"],"e":"Usually V2 or V3 on one side.","d":"Pain follows the sensory territory of CN V, most often V2 (maxillary) or V3 (mandibular) on one side. V1 is involved in fewer than 6% of cases. Pain in all three divisions bilaterally is atypical, and the motor root of V carries no pain fibers.##Usually unilateral V2 or V3; V1 is rare (under 6%)."},
{"g":"8-16 · Trigeminal neuralgia","q":"What fraction of cases involve V1?","c":"Less than 6%","w":["About 25%","About 50%","Over 75%"],"e":"V1 is involved in fewer than 6%.","d":"Only about 6% of cases involve the ophthalmic division (V1); the large majority affect V2 or V3. Figures of 25%, 50% or over 75% would greatly overstate V1 involvement.##V1 involvement is under 6%."},
{"g":"8-16 · Trigeminal neuralgia","q":"Typical age at presentation?","c":"Older than 50","w":["Under 10","20 to 30","Neonatal"],"e":"Usually people older than 50.","d":"Trigeminal neuralgia usually begins after age 50, when vascular compression of the nerve becomes more likely. It is uncommon in children, young adults and neonates, in whom other causes of facial pain should be sought.##The typical patient is older than 50."},
{"g":"8-16 · Trigeminal neuralgia","q":"Why does the patient develop a facial tic?","c":"Wincing from the intense pain","w":["Motor nucleus lesion","Facial nerve irritation","Focal seizure"],"e":"The pain makes the patient wince, producing a facial muscle tic.","d":"The tic is a reflex wince from the severe pain, not a motor lesion. A motor nucleus lesion, facial nerve irritation (as in hemifacial spasm) and focal seizures are not the mechanism.##Wincing from pain produces the facial muscle tic."},
{"g":"8-16 · Trigeminal neuralgia","q":"Proposed etiology?","c":"Vascular compression of the trigeminal ganglion","w":["VZV reactivation","Orbital floor fracture","Geniculate ganglion infection"],"e":"Etiology is uncertain, but vascular compression is suspected.","d":"The favored mechanism is vascular compression of the trigeminal sensory ganglion or root by the superior cerebellar artery, although the cause is officially uncertain. VZV reactivation causes herpes zoster, orbital floor fracture causes a blow-out injury, and geniculate ganglion infection involves CN VII.##Suspect vascular compression by the superior cerebellar artery."},
{"g":"8-16 · Trigeminal neuralgia","q":"Which are the classic triggers?","c":"Touch and a draft of cool air","w":["Bright light","Loud noise","Lying flat"],"e":"Trigger points on the face respond to touch and cool air.","d":"Attacks are triggered by light touch (shaving, brushing teeth, washing) and by a draft of cool air at trigger points on the face. Bright light, loud noise and lying flat do not trigger attacks.##Touch and cool air trigger the pain."},
{"g":"8-16 · Trigeminal neuralgia","q":"Which artery is implicated?","c":"Superior cerebellar","w":["Anterior cerebral","Middle meningeal","Facial"],"e":"The superior cerebellar artery compresses the sensory ganglion.","d":"The superior cerebellar artery is the vessel most often found compressing the trigeminal root or ganglion. The anterior cerebral, middle meningeal and facial arteries do not lie against the trigeminal ganglion.##Superior cerebellar artery compression."},
{"g":"8-16 · Trigeminal neuralgia","q":"Which zone-to-division pairing is correct?","c":"Maxillary zone = V2","w":["Ophthalmic zone = V3","Mandibular zone = V2","Maxillary zone = V1"],"e":"Ophthalmic V1, maxillary V2, mandibular V3.","d":"The ophthalmic zone is V1, the maxillary zone is V2 and the mandibular zone is V3. Pain over the cheek and upper lip is therefore V2, and pain over the chin and lower jaw is V3.##V1 ophthalmic, V2 maxillary, V3 mandibular."},
{"g":"8-16 · Trigeminal neuralgia","q":"Another name for trigeminal neuralgia?","c":"Tic douloureux","w":["Bell’s palsy","Shingles","Hyperacusis"],"e":"Tic douloureux means painful tic.","d":"Tic douloureux literally means painful tic and is another name for trigeminal neuralgia. Bell palsy is a facial nerve palsy, shingles is herpes zoster, and hyperacusis is sound sensitivity from stapedius paralysis.##Tic douloureux equals trigeminal neuralgia."},
{"g":"8-17 · Herpes zoster","q":"Herpes zoster is the most common infection of which system?","c":"Peripheral nervous system","w":["Central nervous system","Respiratory tract","Urinary tract"],"e":"It is the most common PNS infection.","d":"Herpes zoster is the most common infection of the peripheral nervous system. It is not primarily a CNS, respiratory or urinary tract infection.##Shingles is the commonest PNS infection."},
{"g":"8-17 · Herpes zoster","q":"What causes it?","c":"Reactivation of varicella-zoster virus","w":["Primary HSV-1 infection","EBV","Bacterial toxin"],"e":"Reactivation of the chickenpox virus.","d":"Shingles results from reactivation of latent varicella-zoster virus, the chickenpox virus. Primary HSV-1 infection, EBV and bacterial toxins do not reactivate in sensory ganglia to cause a dermatomal rash.##VZV reactivation causes zoster."},
{"g":"8-17 · Herpes zoster","q":"Where does the virus lie dormant?","c":"Posterior root or sensory ganglion","w":["Anterior horn","Motor end plate","Sympathetic chain only"],"e":"Dormant in sensory ganglia.","d":"After chickenpox, VZV stays latent in posterior (dorsal) root and cranial sensory ganglia, not in the anterior horn, motor end plate or sympathetic chain. Reactivation then travels along that nerve to its dermatome.##Latent virus sits in sensory ganglia."},
{"g":"8-17 · Herpes zoster","q":"How long after the initial pain do vesicles appear?","c":"72 to 96 hours","w":["About 6 hours","1 to 2 weeks","One month"],"e":"Pain first, vesicles at 72 to 96 hours.","d":"Intense burning, localized pain comes first, and vesicles appear about 72 to 96 hours (3 to 4 days) later, which is why early zoster can be misdiagnosed. Six hours is too short, and one to four weeks is too long.##Pain precedes the rash by 3 to 4 days."},
{"g":"8-17 · Herpes zoster","q":"Approximate prevalence?","c":"0.5% of the population","w":["5%","25%","50%"],"e":"About 0.5%.","d":"About 0.5% of the population is affected. Rates of 5%, 25% or 50% are far too high.##Prevalence is about 0.5%."},
{"g":"8-17 · Herpes zoster","q":"Which dermatomes are usually involved?","c":"T5 to L2","w":["C1 to C4","L3 to S5","T1 only"],"e":"One or several contiguous unilateral dermatomes, T5 to L2.","d":"Thoracic and upper lumbar dermatomes (T5 to L2) are most often involved, usually one or a few contiguous dermatomes on one side. C1 to C4, L3 to S5 and T1 alone are not the typical sites.##Usual dermatomes are T5 to L2, unilateral."},
{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN V is affected?","c":"Semilunar","w":["Geniculate","Ciliary","Otic"],"e":"The semilunar (trigeminal) ganglion.","d":"Zoster of CN V arises from the semilunar (trigeminal, Gasserian) ganglion. The geniculate ganglion belongs to CN VII, and the ciliary and otic ganglia are parasympathetic.##Semilunar ganglion equals CN V."},
{"g":"8-17 · Herpes zoster","q":"Which ganglion is involved when CN VII is affected?","c":"Geniculate","w":["Semilunar","Superior cervical","Spiral"],"e":"The geniculate ganglion.","d":"Zoster of CN VII arises from the geniculate ganglion, as in Ramsay Hunt syndrome. The semilunar ganglion belongs to CN V, the superior cervical ganglion is sympathetic, and the spiral ganglion belongs to CN VIII.##Geniculate ganglion equals CN VII."},
{"g":"8-17 · Herpes zoster","q":"What is the rash distribution?","c":"Unilateral, confined to a dermatome","w":["Bilateral across the midline","Generalized","Palms and soles only"],"e":"Confined to one radicular or cranial nerve distribution.","d":"The rash is unilateral and confined to a single dermatome or cranial nerve distribution. It does not cross the midline, spread diffusely, or localize only to the palms and soles.##Unilateral dermatomal rash."},
{"g":"8-17 · Herpes zoster","q":"What is the initial symptom?","c":"Intense burning, localized pain","w":["Painless rash","Hearing loss","Diplopia"],"e":"Burning pain precedes the vesicles.","d":"The prodrome is intense burning, localized pain before the vesicles appear. A painless rash, hearing loss and diplopia are not the initial symptoms.##Pain first, then vesicles."},
{"g":"8-18 · Bell’s palsy","q":"Most common cause of facial muscle weakness and cranial neuropathy?","c":"Acute unilateral idiopathic facial palsy","w":["Stroke","Acoustic neuroma","Parotid tumor"],"e":"That is Bell’s palsy.","d":"Acute unilateral idiopathic facial palsy (Bell palsy) is the commonest cause of facial muscle weakness and cranial neuropathy. Stroke, acoustic neuroma and parotid tumor are less common causes.##Bell palsy is the most common facial palsy."},
{"g":"8-18 · Bell’s palsy","q":"Which virus can cause facial nerve palsy?","c":"Herpes simplex virus","w":["Hepatitis B virus","Rabies virus","HIV only"],"e":"HSV is a recognized cause.","d":"Herpes simplex virus is a recognized cause of facial nerve palsy. Hepatitis B, rabies and HIV alone are not classically linked to Bell palsy.##HSV can cause facial palsy."},
{"g":"8-18 · Bell’s palsy","q":"A lesion at the internal acoustic meatus adds which feature?","c":"Deafness from CN VIII","w":["Pain behind the ear","Taste loss only","Nothing extra"],"e":"CN VIII runs with CN VII there.","d":"A lesion at the internal acoustic meatus also involves CN VIII, which runs beside CN VII, so deafness is added to all features of the lower sites. Ear pain belongs to the geniculate site and taste loss to the facial canal.##Deafness points to the most proximal lesion."},
{"g":"8-18 · Bell’s palsy","q":"A lesion at the geniculate ganglion adds which feature?","c":"Pain behind the ear","w":["Deafness","Parotid swelling","Nothing extra"],"e":"Ear pain, with possible herpes of tympanum and meatus.","d":"Geniculate ganglion lesions add pain behind the ear (and possible herpetic lesions of the tympanum and external meatus) to all lower-site features. Deafness arises only at the meatus, and parotid swelling is not a feature.##A geniculate lesion adds ear pain."},
{"g":"8-18 · Bell’s palsy","q":"Chorda tympani involvement causes?","c":"Loss of anterior tongue taste and less salivation","w":["Hyperacusis","Deafness","Inability to close the eye only"],"e":"Taste from the anterior tongue and salivation.","d":"The chorda tympani carries taste from the anterior two thirds of the tongue and secretomotor fibers to the submandibular and sublingual glands, so injury causes taste loss and reduced salivation. Hyperacusis is a stapedius effect and deafness a CN VIII effect.##Chorda tympani carries anterior taste and salivation."},
{"g":"8-18 · Bell’s palsy","q":"Hyperacusis results from loss of which muscle’s function?","c":"Stapedius","w":["Tensor tympani","Buccinator","Masseter"],"e":"The nerve to stapedius is affected in the facial canal.","d":"The nerve to stapedius dampens loud sounds; when it is paralyzed, sound becomes painfully loud (hyperacusis). The tensor tympani is supplied by CN V, the buccinator moves the cheek, and the masseter closes the jaw.##Stapedius paralysis causes hyperacusis."},
{"g":"8-18 · Bell’s palsy","q":"Facial paralysis, anterior taste loss, hyperacusis, normal hearing, no ear pain. Lesion site?","c":"Facial canal","w":["Internal acoustic meatus","Geniculate ganglion","Below the stylomastoid foramen"],"e":"Site 3 has taste loss and hyperacusis but not ear pain or deafness.","d":"Facial paralysis with taste loss and hyperacusis but no deafness or ear pain places the lesion in the facial canal (site 3). Site 2 would add ear pain, site 1 would add deafness, and site 4 would spare taste and hearing.##Site 3 gives taste loss plus hyperacusis."},
{"g":"8-18 · Bell’s palsy","q":"Why does food collect between teeth and cheek below the stylomastoid foramen?","c":"Buccinator paralysis","w":["Masseter paralysis","Tongue weakness","Loss of taste"],"e":"The buccinator is paralyzed.","d":"Buccinator paralysis lets food pool between the teeth and cheek on the affected side. The masseter and temporalis close the jaw, and taste loss does not cause food pooling.##Buccinator weakness traps food."},
{"g":"8-18 · Bell’s palsy","q":"What is Bell’s phenomenon?","c":"Eye rolls upward on attempted closure, exposing sclera","w":["Tongue deviates to the lesion side","Uvula deviates","Pupil constricts"],"e":"Seen with peripheral facial weakness.","d":"Bell phenomenon is the upward rolling of the eyeball on attempted lid closure, exposing sclera because the lid does not close. Tongue deviation is hypoglossal, uvular deviation is vagal, and pupillary constriction is the light reflex.##The eye rolls up when the lid cannot close."},
{"g":"8-18 · Bell’s palsy","q":"Incomplete smile, flat nasolabial fold, forehead preserved. Which lesion?","c":"Central (UMN)","w":["Peripheral (LMN)","Geniculate ganglion","Below stylomastoid foramen"],"e":"Brow and forehead are relatively spared in central weakness.","d":"Central (upper motor neuron) lesions weaken the lower face but relatively spare the brow and forehead, because the upper face has bilateral cortical input. A peripheral lesion paralyzes the whole half of the face.##A spared forehead means a central lesion."},

{"g":"8-21 · Extraocular muscles","q":"Which two muscles depress the eye in abduction and adduction?","c":"Inferior rectus and superior oblique","w":["Superior rectus and inferior oblique","Lateral rectus and medial rectus","Superior oblique and medial rectus"],"e":"IR and SO depress, with minimal intorsion or extorsion."},

{"g":"4 · Systolic vs diastolic failure","q":"A 63-year-old man had an MI two years ago and now has orthopnea and fatigue. Echo shows a dilated LV with LVEF 30%. Which best describes the primary defect?","c":"Impaired ejection from reduced contractility","w":["Impaired filling from reduced compliance","Impaired filling from pericardial constriction","Impaired ejection from fixed valvular obstruction"],"e":"Loss of contracting myocardium reduces SV and EF: systolic failure.","ob":"Systolic failure = impaired ejection."},
{"g":"4 · Systolic vs diastolic failure","q":"Why is end-systolic volume increased in systolic failure?","c":"Weak contraction leaves more blood in the ventricle","w":["Strong contraction ejects less than the venous return","Stiff walls prevent the ventricle from relaxing fully","Raised compliance lets the chamber hold more blood"],"e":"A smaller volume is ejected, so more remains at end-systole.","ob":"Weak contraction raises ESV and lowers EF."},
{"g":"4 · Systolic vs diastolic failure","q":"In systolic failure, how does the heart initially compensate for the rise in EDV?","c":"Frank-Starling recruitment of stroke volume","w":["Reduced sympathetic tone lowering heart rate","Natriuretic peptide lowering vascular tone alone","Loss of sarcomeres reducing wall tension"],"e":"Residual blood plus new inflow raises EDV and may transiently support stroke volume.","ob":"Higher EDV recruits Frank-Starling."},
{"g":"4 · Systolic vs diastolic failure","q":"Persistent dilation in systolic failure worsens pump function mainly because of?","c":"Increased wall stress","w":["Reduced end-systolic volume","Increased myocardial compliance","Enhanced coronary perfusion"],"e":"Dilation itself increases wall stress and can further worsen pump function.","ob":"Dilation raises wall stress and worsens failure."},
{"g":"4 · Systolic vs diastolic failure","q":"Which condition most commonly causes diastolic heart failure?","c":"Long-standing hypertension with LV hypertrophy","w":["Dilated cardiomyopathy after viral myocarditis","Large anterior infarction with an akinetic wall","Severe chronic mitral regurgitation with annular dilation"],"e":"Hypertensive hypertrophy and fibrosis stiffen the ventricle.","ob":"Hypertensive LVH is a major cause of diastolic failure."},
{"g":"4 · Systolic vs diastolic failure","q":"A 68-year-old woman with hypertension has exertional dyspnea. Echo shows LVEF 62%, a thick wall, a normal cavity and elevated filling pressure. What is the mechanism?","c":"Reduced compliance requiring higher pressure to fill","w":["Reduced contractility leaving a large residual volume","Excess preload from a chronic regurgitant volume load","Failure of the aortic valve to open fully in systole"],"e":"A stiff, hypertrophied ventricle needs higher pressure to fill even though EF is preserved.","ob":"Diastolic failure = filling failure with preserved EF."},
{"g":"4 · Systolic vs diastolic failure","q":"Which finding best illustrates diastolic failure?","c":"Normal EDV with abnormally high filling pressure","w":["Low ejection fraction with a markedly increased ESV","High ejection fraction with a low filling pressure","Low EDV together with a low left atrial pressure"],"e":"At the same EDV, a stiff ventricle has a higher pressure.","ob":"Stiffness raises pressure at any given volume."},
{"g":"4 · Systolic vs diastolic failure","q":"Why does a stiff ventricle cause pulmonary edema?","c":"Small filling increases sharply raise LV and left atrial pressure","w":["Reduced contractility lowers pulmonary capillary oncotic pressure","Raised compliance lowers the venous return to the right ventricle","A low EF directly increases the permeability of the alveolar membrane"],"e":"Pressure passes back to the pulmonary veins and capillaries, raising hydrostatic pressure.","ob":"↑ LVEDP → ↑ LA pressure → pulmonary edema."},
{"g":"4 · Systolic vs diastolic failure","q":"At rest a patient with diastolic failure appears well, but exertion causes dyspnea. Why?","c":"The stiff ventricle cannot increase filling and output","w":["Contractility falls sharply during even mild exertion","The aortic valve narrows as the heart rate rises with activity","Venous return falls because of peripheral vasodilation"],"e":"Exercise demands more filling and output that a stiff ventricle cannot supply.","ob":"Diastolic failure is unmasked by exercise."},
{"g":"4 · Systolic vs diastolic failure","q":"Which cause of impaired diastolic filling is an infiltrative process?","c":"Amyloidosis (restrictive cardiomyopathy)","w":["Dilated cardiomyopathy from chronic alcohol use","Ischemic cardiomyopathy after a large infarction","Rheumatic aortic stenosis with calcification"],"e":"Restrictive cardiomyopathy, including amyloidosis, stiffens the myocardium.","ob":"Amyloid and fibrosis impair filling."},
{"g":"4 · Systolic vs diastolic failure","q":"Which statement about ejection fraction is correct?","c":"A preserved EF does not exclude heart failure","w":["A reduced EF is the best measure of ventricular stiffness","EF reflects the left atrial pressure directly and reliably","EF is always reduced whenever diastolic failure is present"],"e":"EF is a ratio, not a filling-pressure measurement.","ob":"EF is not a measure of diastolic function."},
{"g":"4 · Systolic vs diastolic failure","q":"Constrictive pericarditis causes heart failure by which mechanism?","c":"Impaired ventricular filling","w":["Impaired myocyte contraction in systole","Excessive afterload during ejection","Valvular regurgitation of blood"],"e":"A rigid pericardium limits diastolic expansion.","ob":"Constriction causes a filling defect."},
{"g":"4 · Systolic vs diastolic failure","q":"Which sequence explains pulmonary edema in diastolic failure?","c":"↑ LVEDP → ↑ LA pressure → ↑ pulmonary capillary pressure","w":["↑ LVEDP → ↓ LA pressure → ↓ pulmonary capillary pressure","↓ LVEDP → ↑ LA pressure → ↑ pulmonary capillary pressure","↑ LVEDP → ↑ RA pressure → ↑ pulmonary capillary pressure"],"e":"Pressure is transmitted backward from the ventricle to the lungs.","ob":"Pressure transmits backward to the pulmonary capillaries."},
{"g":"4 · Systolic vs diastolic failure","q":"Which finding is expected in a dilated, failing left ventricle with severe systolic dysfunction?","c":"Secondary mitral regurgitation from annular stretch","w":["Concentric wall thickening with a small ventricular cavity","Reduced EDV with a normal end-systolic volume","Normal chamber size with a raised ejection fraction"],"e":"Dilation can displace papillary muscles and stretch the annulus.","ob":"Dilation can cause functional mitral regurgitation."},
{"g":"4 · Systolic vs diastolic failure","q":"A patient has LVEF 30% and a dilated LV. Which compensation worsens the disease in the long term?","c":"RAAS-mediated salt and water retention","w":["Frank-Starling length-dependent contraction","Decreased sympathetic outflow to vessels","Natriuretic peptide–mediated vasodilation"],"e":"RAAS expands volume and raises afterload, increasing cardiac stress.","ob":"RAAS activation worsens long-term load."},

{"g":"5 · Left-sided heart failure","q":"Which is the earliest typical symptom of left-sided heart failure?","c":"Exertional dyspnea","w":["Orthopnea during sleep","Dyspnea at rest","Peripheral edema"],"e":"Dyspnea first appears on exertion, then progresses to orthopnea/PND and rest dyspnea.","ob":"Exertional dyspnea precedes orthopnea and rest dyspnea."},
{"g":"5 · Left-sided heart failure","q":"A 70-year-old needs three pillows to sleep. Why does lying flat worsen his dyspnea?","c":"Increased venous return redistributes fluid to the thorax","w":["Reduced venous return lowers the pulmonary blood volume","Lower systemic resistance reduces left atrial pressure","Diaphragmatic descent relieves compression of the lungs"],"e":"Recumbency raises venous return and shifts fluid toward the chest.","ob":"Orthopnea reflects fluid redistribution when supine."},
{"g":"5 · Left-sided heart failure","q":"Sudden nocturnal awakening with a feeling of suffocation is termed?","c":"Paroxysmal nocturnal dyspnea","w":["Cheyne-Stokes respiration","Platypnea-orthodeoxia","Kussmaul breathing"],"e":"PND reflects worsening pulmonary congestion during recumbency.","ob":"PND = nocturnal attacks from pulmonary congestion."},
{"g":"5 · Left-sided heart failure","q":"Which auscultatory finding is typical of pulmonary congestion?","c":"Fine basal rales","w":["Coarse upper-lobe wheezing","Biphasic tracheal stridor","Pleural friction rub"],"e":"Edematous alveoli reopen during inspiration producing fine basal rales.","ob":"Fine basal rales signal pulmonary edema."},
{"g":"5 · Left-sided heart failure","q":"What produces fine rales in pulmonary edema?","c":"Reopening of fluid-filled alveoli during inspiration","w":["Vibration of mucus in large central airways","Rubbing of inflamed pleural layers together","Narrowing of bronchioles during expiration"],"e":"The sound arises as collapsed, fluid-laden alveoli open on inspiration.","ob":"Rales = alveoli reopening."},
{"g":"5 · Left-sided heart failure","q":"What is the typical morphology of the left ventricle in chronic left-sided failure?","c":"Hypertrophied and often dilated","w":["Atrophic with a thin wall","Normal size with no fibrosis","Small, with a hypoplastic cavity"],"e":"Except in a few disorders, the LV is hypertrophied and often dilated with interstitial fibrosis.","ob":"The failing LV is usually hypertrophied and often dilated."},
{"g":"5 · Left-sided heart failure","q":"Why does left atrial dilation predispose to thrombus formation?","c":"Atrial fibrillation causes stasis in the appendage","w":["Atrial contraction becomes forceful and turbulent","Elevated BNP promotes platelet activation","Pulmonary vein flow is reversed continuously"],"e":"Loss of coordinated contraction promotes stasis and mural thrombi.","ob":"Dilated LA → AF → stasis → thrombus."},
{"g":"5 · Left-sided heart failure","q":"A systemic embolic stroke in a patient with chronic left heart disease most likely arises from which source?","c":"Mural thrombus in the left atrial appendage","w":["Deep vein thrombus of the calf veins","Right ventricular apical thrombus","Thrombus in the inferior vena cava"],"e":"Left-sided thrombi embolize to the systemic circulation.","ob":"Left atrial mural thrombi cause systemic emboli."},
{"g":"5 · Left-sided heart failure","q":"Functional (secondary) mitral regurgitation in a dilated left ventricle is due to?","c":"Papillary muscle displacement and annular stretching","w":["Rheumatic fusion of the mitral valve commissures","Infective destruction of the mitral leaflet tissue","Myxomatous degeneration of the chordae tendineae"],"e":"Ventricular dilation distorts the mitral apparatus without primary leaflet disease.","ob":"Dilation causes functional MR and more volume overload."},
{"g":"5 · Left-sided heart failure","q":"Which renal change follows low effective arterial perfusion in left-sided failure?","c":"RAAS activation with sodium and water retention","w":["Suppressed renin release with natriuresis","Increased GFR with brisk diuresis","Tubular necrosis from venous congestion alone"],"e":"Retention expands volume and further raises filling pressures.","ob":"Low perfusion activates RAAS."},
{"g":"5 · Left-sided heart failure","q":"Severe renal hypoperfusion in advanced left-sided failure produces which condition?","c":"Prerenal azotemia","w":["Intrinsic glomerulonephritis","Postrenal obstruction","Nephrotic syndrome"],"e":"Reduced perfusion raises urea and creatinine without intrinsic renal disease.","ob":"Low output causes prerenal azotemia."},
{"g":"5 · Left-sided heart failure","q":"Confusion in a patient with advanced low-output failure reflects which mechanism?","c":"Reduced cerebral perfusion","w":["Pulmonary venous congestion","Hepatic venous congestion","Hyperaldosteronism"],"e":"Advanced low output impairs cerebral perfusion.","ob":"Low output can impair cerebral perfusion."},
{"g":"5 · Left-sided heart failure","q":"What is the classic progression of symptoms in left-sided failure?","c":"Exertional dyspnea, orthopnea/PND, dyspnea at rest","w":["Orthopnea, exertional dyspnea, ascites, dyspnea at rest","Dyspnea at rest, PND, exertional dyspnea, orthopnea","Peripheral edema, ascites, orthopnea, exertional dyspnea"],"e":"Symptoms worsen as pulmonary congestion increases.","ob":"Exertional dyspnea → orthopnea/PND → rest dyspnea."},
{"g":"5 · Left-sided heart failure","q":"Which presentation would NOT be expected in isolated left-sided failure?","c":"Isolated ascites with clear lungs","w":["Orthopnea with nocturnal dyspnea","Fine basal rales with tachycardia","Exertional dyspnea with cardiomegaly"],"e":"Ascites with clear lungs suggests right-sided failure.","ob":"Left failure = lungs; right failure = systemic veins."},
{"g":"5 · Left-sided heart failure","q":"A patient has hypoxemia and frothy sputum. Which sequence is responsible?","c":"↑ LA pressure → ↑ pulmonary capillary pressure → alveolar edema","w":["↓ LA pressure → ↑ lymph drainage → alveolar drying","↑ RA pressure → ↑ hepatic pressure → alveolar edema","↑ LA pressure → ↓ capillary pressure → alveolar edema"],"e":"Raised hydrostatic pressure drives fluid into alveoli.","ob":"Backward pressure causes pulmonary edema."},

{"g":"6 · Right-sided failure, tests and cases","q":"What is the most common cause of right-sided heart failure?","c":"Left-sided heart failure","w":["Primary pulmonary hypertension","Tricuspid valve stenosis","Pulmonic valve disease"],"e":"Pulmonary venous congestion raises the load on the right ventricle.","ob":"Right failure is most often secondary to left failure."},
{"g":"6 · Right-sided failure, tests and cases","q":"Cor pulmonale is defined as?","c":"RV failure from lung or pulmonary vascular disease","w":["RV failure caused only by left-sided valvular disease","LV hypertrophy resulting from chronic pulmonary disease","Biventricular failure from primary myocardial disease"],"e":"It is right ventricular disease caused by pulmonary parenchymal or vascular disease.","ob":"Cor pulmonale = RV disease due to pulmonary disease."},
{"g":"6 · Right-sided failure, tests and cases","q":"A 60-year-old with severe COPD has jugular venous distension, ascites and ankle edema, with clear lungs. What is the mechanism?","c":"Raised pulmonary vascular resistance causing RV failure","w":["Reduced LV contractility causing marked pulmonary edema","Aortic stenosis causing concentric hypertrophy","Constrictive pulmonary fibrosis causing orthopnea"],"e":"Isolated right failure from lung disease spares the lungs of congestion.","ob":"Chronic lung disease raises RV afterload."},
{"g":"6 · Right-sided failure, tests and cases","q":"Which finding indicates elevated right atrial pressure?","c":"Jugular venous distension","w":["Fine basal rales","Orthopnea","Paroxysmal nocturnal dyspnea"],"e":"Raised right-sided filling pressure shows as JVD, edema and ascites.","ob":"JVD reflects raised right-sided pressure."},
{"g":"6 · Right-sided failure, tests and cases","q":"Which organ system shows prominent congestion in right-sided failure?","c":"Liver and the portal system","w":["Alveolar capillaries of the lungs","Cerebral cortex","Adrenal cortex"],"e":"Systemic and portal venous engorgement dominate.","ob":"Right failure congests liver and systemic veins."},
{"g":"6 · Right-sided failure, tests and cases","q":"Why does isolated right failure produce limited pulmonary congestion?","c":"The failure lies upstream of the pulmonary circulation","w":["Left atrial pressure is markedly elevated in this state","Pulmonary veins drain directly into the right atrium","Pulmonary capillaries are impermeable to any fluid"],"e":"Pressure backs up into systemic, not pulmonary, veins.","ob":"Isolated right failure congests systemic veins."},
{"g":"6 · Right-sided failure, tests and cases","q":"Which edema pattern dominates right-sided failure?","c":"Dependent peripheral edema, ascites and effusions","w":["Pulmonary interstitial and alveolar edema only","Cerebral edema with papilledema","Pulmonary edema with orthopnea alone"],"e":"Systemic venous hypertension produces dependent edema and fluid collections.","ob":"Right failure: peripheral edema, ascites, effusions."},
{"g":"6 · Right-sided failure, tests and cases","q":"Recurrent pulmonary emboli lead to right-sided failure by which mechanism?","c":"Chronically raised RV afterload","w":["Reduced RV preload","Mitral stenosis","Loss of systemic vascular resistance"],"e":"Pulmonary vascular obstruction raises pulmonary resistance.","ob":"Pulmonary vascular disease raises RV afterload."},
{"g":"6 · Right-sided failure, tests and cases","q":"Which interpretation of an elevated BNP is correct?","c":"It reflects increased ventricular wall stress","w":["It proves that the cause is purely right-sided","It rules out systolic dysfunction in the patient","It indicates complete suppression of the RAAS system"],"e":"BNP is a marker of the failing ventricle, not the cause of failure.","ob":"BNP reflects wall stress."},
{"g":"6 · Right-sided failure, tests and cases","q":"Echocardiography helps distinguish systolic from diastolic patterns by assessing which parameters?","c":"EF, chamber size, wall thickness and valvular function","w":["Serum BNP, creatinine and electrolyte measurements","Pulmonary rales, heart sounds and JVP height changes","Chest radiograph, ECG voltage and troponin levels"],"e":"Echo evaluates EF, chamber size, wall motion, valves and possible thrombus.","ob":"Echo defines the structural and functional pattern."},
{"g":"6 · Right-sided failure, tests and cases","q":"A 66-year-old hypertensive has a thick LV wall, normal cavity, LVEF 60% and elevated filling pressure. What is the most likely functional pattern?","c":"Diastolic failure from pressure-overload remodeling","w":["Systolic failure after prior ischemic injury","Systolic failure from volume-overload dilation","Right-sided failure from chronic cor pulmonale"],"e":"Pressure overload causes concentric hypertrophy, stiffness and preserved EF.","ob":"Hypertension → concentric LVH → diastolic failure."},
{"g":"6 · Right-sided failure, tests and cases","q":"A 63-year-old with prior MI has a dilated LV, LVEF 30% and increased ESV. What is the most likely functional pattern?","c":"Systolic failure after ischemic myocardial injury","w":["Diastolic failure from restrictive cardiomyopathy","Diastolic failure from LV hypertrophy and fibrosis","Isolated right failure from pulmonary hypertension"],"e":"Loss of contracting myocardium raises ESV and lowers EF.","ob":"Prior MI → dilated LV → systolic failure."},
{"g":"6 · Right-sided failure, tests and cases","q":"In the post-MI patient, which compensation is recruited by residual blood plus subsequent venous return?","c":"Frank-Starling mechanism via higher EDV","w":["Concentric hypertrophy via parallel sarcomeres","Natriuresis via suppressed aldosterone","Reduced afterload via arteriolar dilation"],"e":"Greater EDV stretches fibers and transiently supports stroke volume.","ob":"Higher EDV recruits Frank-Starling."},
{"g":"6 · Right-sided failure, tests and cases","q":"Which pair correctly matches the failing side with its congested organs?","c":"Left-sided: lungs; right-sided: liver and systemic veins","w":["Left-sided: liver; right-sided: lungs and systemic veins","Left-sided: kidneys only; right-sided: lungs only","Left-sided: systemic veins; right-sided: lungs only"],"e":"Left failure congests the pulmonary veins; right failure congests systemic and portal veins.","ob":"Ask where blood is backing up."},
{"g":"6 · Right-sided failure, tests and cases","q":"In chronic disease, left and right failure often merge into which state?","c":"Biventricular failure with pulmonary and systemic congestion","w":["Isolated right failure with clear lungs and edema","High-output failure with warm extremities only","Isolated diastolic failure with a normal EF only"],"e":"Patients may show both pulmonary and systemic congestion.","ob":"Chronic disease often causes biventricular failure."}

"virology":{"name":"Virology: DNA Enveloped Viruses","D":[
{"g":"1 · Herpesvirus general features","q":"A research lab characterizes an enveloped, linear double-stranded DNA virus. Infected cells show intranuclear inclusions, and purified virions contain no polymerase. Which statement best explains how the virus copies its genome?","c":"It uses host cell enzymes inside the nucleus","w":["It uses a virion RNA polymerase in the cytoplasm","It uses its own reverse transcriptase after entry","It integrates first into mitochondrial DNA to copy"],"e":"Herpesviruses replicate in the nucleus and rely on host cell enzymes, so they carry no polymerase. Poxviruses are the cytoplasmic exception.","ob":"Herpesviruses: nucleus, host enzymes, no virion polymerase."},
{"g":"1 · Herpesvirus general features","q":"Electron microscopy of a herpesvirus shows a protein layer between the nucleocapsid and the envelope. It contains transcription and translation factors that help viral replication. What is this layer called?","c":"Tegument","w":["Capsomere shell","Nucleoid core","Peplomer layer"],"e":"The tegument lies between the nucleocapsid and the envelope and holds regulatory proteins that assist replication.","ob":"Tegument = regulatory proteins between capsid and envelope."},
{"g":"1 · Herpesvirus general features","q":"A student asks how herpesvirions obtain their lipid envelope. Which answer is correct?","c":"Budding through the nuclear membrane","w":["Budding through the plasma membrane","Budding through the Golgi membrane","Budding through the lysosomal membrane"],"e":"Herpesviruses acquire the envelope by budding from the nuclear membrane, the site where the nucleocapsid is assembled.","ob":"The herpesvirus envelope comes from the nuclear membrane."},
{"g":"1 · Herpesvirus general features","q":"A pathologist reviews smears and cultures from several herpesvirus infections. Which group of viruses forms multinucleated giant cells?","c":"HSV-1, HSV-2, VZV and CMV","w":["HSV-1, HSV-2, VZV and EBV","HSV-2, VZV, EBV and smallpox","HSV-1, CMV, EBV and smallpox"],"e":"HSV-1, HSV-2, VZV and CMV form multinucleated giant cells. The Tzanck smear exploits this for vesicular lesions. EBV and poxviruses do not.","ob":"Giant cells: HSV-1, HSV-2, VZV, CMV (not EBV)."},
{"g":"1 · Herpesvirus general features","q":"A man develops vesicles at the same lip site every few months with no new exposure. Which property of herpesviruses explains this pattern?","c":"Latency with periodic reactivation","w":["Integration into host chromosomes during lysis","Frequent antigenic shifts between serotypes","Complete lack of host immune recognition"],"e":"All herpesviruses establish latent infection. Reactivation of the latent virus produces recurrent disease.","ob":"Latent infection with reactivation causes recurrences."},
{"g":"1 · Herpesvirus general features","q":"Which enveloped DNA virus differs from the herpesviruses by replicating in the cytoplasm using its own virion polymerase?","c":"Smallpox virus","w":["Varicella-zoster virus","Cytomegalovirus","Epstein-Barr virus"],"e":"Poxviruses carry a DNA-dependent RNA polymerase in the virion and replicate in the cytoplasm. Herpesviruses replicate in the nucleus without a virion polymerase.","ob":"Pox carry their own polymerase; herpes use the nucleus."},
{"g":"2 · Herpes simplex virus 1","q":"A 6-year-old has fever, drooling and painful vesicles and ulcers on the gums and oral mucosa. Which diagnosis is most likely?","c":"HSV-1 gingivostomatitis","w":["VZV zoster of the face","EBV infectious mononucleosis","CMV pneumonia in a child"],"e":"Gingivostomatitis is a primary HSV-1 infection of the mouth. Mnemonic: GLKE = Gingivostomatitis, Labialis, Keratitis, Encephalitis.","ob":"HSV-1 causes GLKE diseases."},
{"g":"2 · Herpes simplex virus 1","q":"A 22-year-old develops recurrent blisters on the lip after intense sun exposure. Which is the most likely cause?","c":"HSV-1 herpes labialis","w":["HSV-2 herpes genitalis","VZV chickenpox rash","EBV mononucleosis"],"e":"Herpes labialis (cold sores or fever blisters) is caused by HSV-1, and recurrences are triggered by fever, sunlight and stress.","ob":"Cold sores are HSV-1 recurrences triggered by fever, sun, stress."},
{"g":"2 · Herpes simplex virus 1","q":"A 35-year-old has eye pain, tearing, photophobia and a dendritic corneal ulcer. Which virus is the most likely cause?","c":"HSV-1","w":["Adenovirus","Smallpox virus","Epstein-Barr virus"],"e":"HSV-1 keratitis is a classic cause of dendritic corneal ulceration and is treated with trifluridine or acyclovir.","ob":"HSV-1 causes keratitis."},
{"g":"2 · Herpes simplex virus 1","q":"A 40-year-old has fever, headache, personality change and a focal seizure. MRI shows temporal lobe involvement. Which virus is the most likely cause?","c":"HSV-1","w":["HSV-2","VZV","CMV"],"e":"HSV-1 is the classic cause of encephalitis, whereas HSV-2 typically causes aseptic meningitis.","ob":"HSV-1 = encephalitis; HSV-2 = aseptic meningitis."},
{"g":"2 · Herpes simplex virus 1","q":"Serum from a patient with HSV-1 infection reacts partly with HSV-2 antigens. Which statement explains this finding?","c":"The two viruses cross-react serologically","w":["HSV-1 has several overlapping serotypes","They share a herpes group-specific antigen","The patient certainly has a dual infection"],"e":"HSV-1 and HSV-2 each have one serotype and cross-react with one another. Neither has a herpes group-specific antigen.","ob":"One serotype each, with cross-reaction between HSV-1 and HSV-2."},
{"g":"2 · Herpes simplex virus 1","q":"A laboratory hopes to use one universal antigen to detect every herpesvirus. Why does this fail for HSV-1?","c":"HSV-1 has no group-specific antigen","w":["HSV-1 has too many serotypes for one assay","The shared antigen is hidden in the nucleus","The tegument masks all HSV-1 antigens"],"e":"HSV-1 lacks a herpes group-specific antigen shared across the whole herpesvirus family.","ob":"No herpes group-specific antigen exists."},
{"g":"2 · Herpes simplex virus 1","q":"A toddler develops oral vesicles after a relative with an active cold sore kissed him. Which route best explains the infection?","c":"Saliva or contact with vesicle virus","w":["Respiratory aerosol from a distant source","Fecal-oral spread through shared toys","Bite from an infected arthropod vector"],"e":"HSV-1 spreads human to human through saliva or direct contact with virus from the vesicle. Transmission is most likely when lesions are active.","ob":"HSV-1: saliva and vesicle contact."},
{"g":"2 · Herpes simplex virus 1","q":"An adult with no visible lesions passes HSV-1 to a partner. Which mechanism explains this?","c":"Asymptomatic shedding of virus in saliva","w":["Release of virions from circulating B cells","Aerosolization of virus from the ganglia","Integration of viral DNA into the epithelium"],"e":"Asymptomatic shedding plays an important role in HSV-1 transmission, even when no lesions are present.","ob":"Asymptomatic shedding transmits HSV-1."},
{"g":"2 · Herpes simplex virus 1","q":"After primary oral infection, the virus ascends sensory axons and persists in neurons. Where is HSV-1 latent?","c":"Trigeminal ganglia","w":["Sacral dorsal root ganglia","Circulating B lymphocytes","Peripheral blood monocytes"],"e":"HSV-1 travels via the axon and becomes latent in the trigeminal sensory ganglia (trigeminal = top). Sacral ganglia are for HSV-2, B cells for EBV and monocytes for CMV.","ob":"HSV-1 latency: trigeminal ganglia."},
{"g":"2 · Herpes simplex virus 1","q":"Which statement about HSV-1 DNA during latency is correct?","c":"It stays in the nucleus, not integrated","w":["It integrates into host chromosomal DNA","It replicates freely in the cytoplasm","It circulates in plasma as free virions"],"e":"HSV-1 does not integrate into cellular DNA. During latency the genome resides in the nucleus of the neuron.","ob":"No integration; the DNA persists in the nucleus."},
{"g":"2 · Herpes simplex virus 1","q":"A man gets cold sores after fever, strong sunlight and exam stress. What underlies these recurrences?","c":"Reactivation of latent virus in ganglia","w":["Reinfection from a new exogenous strain","Activation of a viral reverse transcriptase","Loss of the viral envelope glycoproteins"],"e":"Fever, sunlight and stress (FSS) trigger reactivation of the latent virus, which travels down the nerve to cause lesions.","ob":"Triggers: Fever, Sunlight, Stress."},
{"g":"2 · Herpes simplex virus 1","q":"A clinician orders serum antibody ELISA for suspected HSV-1 infection. For which situation is it useful?","c":"Diagnosis of a primary infection","w":["Diagnosis of each recurrent episode","Detection of latent DNA in ganglia","Separating HSV-1 from VZV directly"],"e":"Serum ELISA detects antibodies and is used to diagnose primary infection, not recurrences.","ob":"ELISA diagnoses primary HSV infection only."},
{"g":"2 · Herpes simplex virus 1","q":"Which reagent allows serologic differentiation of HSV-1 from HSV-2?","c":"Antibodies to glycoprotein G","w":["Antibodies to capsid antigens","Antibodies to the tegument","Antibodies to viral thymidine kinase"],"e":"Monoclonal antibodies against glycoprotein G distinguish HSV-1 from HSV-2.","ob":"Glycoprotein G separates HSV-1 from HSV-2."},
{"g":"2 · Herpes simplex virus 1","q":"Which test on cerebrospinal fluid best confirms herpes simplex encephalitis?","c":"PCR of CSF for HSV DNA","w":["Tzanck smear of CSF cells","Serum IgM ELISA performed alone","Culture with fluorescent antibody only"],"e":"CSF PCR detects HSV-1 DNA in encephalitis or meningitis and is the preferred test.","ob":"CSF PCR diagnoses HSV encephalitis."},
{"g":"2 · Herpes simplex virus 1","q":"Which statement about the Tzanck smear from a vesicle base is correct?","c":"Rapid, but sensitivity is limited","w":["Slow, yet highly sensitive and specific","Rapid, and it separates HSV-1 from HSV-2","Slow, and it detects only VZV lesions"],"e":"A Tzanck smear shows multinucleated giant cells with intranuclear inclusions. It has a short turnaround but limited sensitivity and specificity and cannot type the virus.","ob":"Tzanck: fast, limited sensitivity and specificity."},
{"g":"2 · Herpes simplex virus 1","q":"Which drug is used for herpes simplex encephalitis and disseminated disease?","c":"Acyclovir","w":["Oseltamivir","Ganciclovir","Ribavirin"],"e":"Acyclovir is the drug for HSV encephalitis and disseminated disease. Primary infections and localized recurrences are self-limited.","ob":"Acyclovir treats HSV encephalitis."},
{"g":"2 · Herpes simplex virus 1","q":"A patient with HSV-1 keratitis needs antiviral therapy. Which drugs are appropriate?","c":"Trifluridine or acyclovir","w":["Amantadine or oseltamivir","Ganciclovir or ribavirin","Interferon or amantadine"],"e":"Trifluridine or acyclovir is used for keratitis.","ob":"Keratitis: trifluridine or acyclovir."},
{"g":"2 · Herpes simplex virus 1","q":"A patient receives acyclovir. Which statement describes its mechanism of action?","c":"Inhibits DNA polymerase after viral kinase activation","w":["Blocks neuraminidase after cleavage by host proteases","Inhibits reverse transcriptase after host kinase activation","Blocks viral entry after binding to glycoprotein G"],"e":"Acyclovir is a nucleoside analog that inhibits the viral DNA polymerase and must first be phosphorylated by a virus-encoded thymidine kinase.","ob":"Acyclovir: nucleoside inhibitor of DNA polymerase."},
{"g":"2 · Herpes simplex virus 1","q":"Acyclovir is largely harmless to uninfected cells. Which feature explains this selectivity?","c":"Viral thymidine kinase activates the drug","w":["Host liver enzymes convert it in all cells","The nuclear membrane excludes it from cells","It binds only to viral envelope proteins"],"e":"Only infected cells make the virus-encoded thymidine kinase that phosphorylates acyclovir, so the drug is activated only there.","ob":"TK lights the fuse: activation only in infected cells."},
{"g":"2 · Herpes simplex virus 1","q":"A patient on long-term suppressive antivirals asks whether the virus is gone. Which answer is correct?","c":"No; antivirals do not affect latency","w":["Yes; acyclovir clears the latent neurons","Yes; the ganglion is sterilized by therapy","No; latent virus cannot be targeted by any drug"],"e":"Antivirals have no effect on the latent state, so the virus cannot be eliminated completely.","ob":"Latent HSV cannot be eradicated."},
{"g":"2 · Herpes simplex virus 1","q":"A patient with frequent cold sores asks about a vaccine. Which statement is correct?","c":"No vaccine exists; avoid triggers such as sun","w":["A live attenuated vaccine is given in childhood","An inactivated annual injection prevents recurrence","A subunit vaccine is given after each outbreak"],"e":"There is no vaccine against HSV-1. Recurrences are reduced by avoiding the inciting agent (intense sunlight).","ob":"No HSV-1 vaccine; avoid triggers."},
